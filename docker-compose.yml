name: egma

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-egma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-egma}
      POSTGRES_DB: ${POSTGRES_DB:-egma}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-egma} -d ${POSTGRES_DB:-egma}"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The trace store. Single node, no Keeper and no replication: this is the
  # honest floor for a self-host, not a cluster. The version is pinned to the
  # newest long-term-support release rather than to a moving tag, because the
  # one thing a self-hoster must never get from `docker compose pull` is a
  # different engine underneath their stored traces.
  clickhouse:
    image: clickhouse/clickhouse-server:26.3.17.56
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-egma}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-egma}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-egma}
    ports:
      - "${CLICKHOUSE_PORT:-8124}:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    # No `ulimits` here on purpose. ClickHouse wants far more descriptors than
    # a shell's default hands it, but asking for them in this file makes
    # `docker compose up` fail outright — a container may not raise its limit
    # above the daemon's own hard one, and on a host whose hard `nofile` is
    # 1024 or 4096 creation fails with "error setting rlimit type 7: operation
    # not permitted". A compose file that does not start is worse than one
    # whose descriptor limit is low, so the raise lives in
    # `docker-compose.override.yml.example` for the self-hoster who needs it.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-egma}:${POSTGRES_PASSWORD:-egma}@postgres:5432/${POSTGRES_DB:-egma}
      CLICKHOUSE_URL: http://${CLICKHOUSE_USER:-egma}:${CLICKHOUSE_PASSWORD:-egma}@clickhouse:8123/${CLICKHOUSE_DB:-egma}
      HOST: 0.0.0.0
      PORT: "3100"
      # Signs session cookies. The default is a development one and every
      # instance that anybody else can reach needs its own; see .env.example.
      EGMA_AUTH_SECRET: ${EGMA_AUTH_SECRET:-development-only-change-this-before-anybody-else-can-reach-it}
      # Seals connection credentials before they reach the database. The
      # default is a development one and every instance that anybody else can
      # reach needs its own — `openssl rand -hex 32` makes one. Back it up
      # alongside the database; losing it loses every stored credential.
      EGMA_ENCRYPTION_KEY: ${EGMA_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      # Where a browser reaches this instance. The pages and the API answer on
      # one origin, and that origin is the self-hoster's own.
      EGMA_BASE_URL: ${EGMA_BASE_URL:-http://localhost:3101}
      EGMA_SINGLE_ORGANIZATION: ${EGMA_SINGLE_ORGANIZATION:-true}
      EGMA_TRUST_PROXY: ${EGMA_TRUST_PROXY:-false}
      # The budget belongs to the organization rather than to a key, so
      # rotating a key does not reset it.
      EGMA_RATE_LIMIT_PER_MINUTE: ${EGMA_RATE_LIMIT_PER_MINUTE:-600}
      # Mail is optional and unset by default. With none, invitations hand
      # their link back to whoever sent them and signup asks for no
      # verification; setting this turns both around at once. It is never a
      # prerequisite for anything, including adding a second person.
      EGMA_SMTP_URL: ${EGMA_SMTP_URL:-}
      EGMA_MAIL_FROM: ${EGMA_MAIL_FROM:-}
    ports:
      - "3100:3100"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # The web application proxies the API's paths so that both answer on one
        # origin. Next resolves this into the build, so it is an argument rather
        # than an environment variable.
        EGMA_API_ORIGIN: ${EGMA_API_ORIGIN:-http://api:3100}
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3101"
    ports:
      - "3101:3101"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3101/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s

  # The simulator: the service that conducts simulations. It claims its
  # work rather than being sent it, so there is no `ports:` here and there
  # never will be — every arrow points out, and adding this container to a
  # self-host costs no inbound networking at all. Everything it needs is
  # below; there are no files to place and no flags to pass.
  simulator:
    build:
      context: .
      dockerfile: apps/simulator/Dockerfile
    environment:
      # Where it claims, heartbeats and reports. The API and the simulator
      # meet inside this network, so this is the service name rather than
      # the origin a browser uses. The endpoints it dials arrive with the
      # trigger; until then it asks, is told there is nothing, and asks
      # again, which is what a queue with nothing in it looks like.
      EGMA_SIMULATOR_CONTROL_PLANE_URL: ${EGMA_SIMULATOR_CONTROL_PLANE_URL:-http://api:3100}
      # What it shows the control plane to be allowed to claim, as a bearer
      # — the same header an egma key uses everywhere else. Unset is fine
      # while both halves are yours and meet on this network; a simulator
      # claiming across the internet needs one.
      EGMA_SIMULATOR_SERVICE_TOKEN: ${EGMA_SIMULATOR_SERVICE_TOKEN:-}
      # How many simulations one simulator conducts at once. It claims only
      # what it has room for, so a big run degrades to a queue rather than
      # to overload — raise this, or start a second simulator, and they
      # distribute between themselves with nothing in front of them.
      EGMA_SIMULATOR_CAPACITY: ${EGMA_SIMULATOR_CAPACITY:-4}
      # Where the persona's words come from. `scripted` walks the scenario
      # deterministically and needs no account, which is why it is the
      # default; `openai` speaks to any provider using that shape and makes
      # the next two required.
      EGMA_SIMULATOR_MODEL_PROVIDER: ${EGMA_SIMULATOR_MODEL_PROVIDER:-scripted}
      EGMA_SIMULATOR_MODEL_NAME: ${EGMA_SIMULATOR_MODEL_NAME:-}
      EGMA_SIMULATOR_MODEL_API_KEY: ${EGMA_SIMULATOR_MODEL_API_KEY:-}
      EGMA_SIMULATOR_MODEL_BASE_URL: ${EGMA_SIMULATOR_MODEL_BASE_URL:-}
      # What the persona hears and speaks with in a voice simulation. Both
      # default to `scripted`, which needs no account and no network — a
      # first voice simulation costs nothing — and each is chosen on its
      # own. Naming `deepgram` or `elevenlabs` makes that provider's key
      # required, and the simulator says so at startup rather than failing
      # every voice simulation it later claims.
      EGMA_SIMULATOR_STT_PROVIDER: ${EGMA_SIMULATOR_STT_PROVIDER:-scripted}
      EGMA_SIMULATOR_DEEPGRAM_API_KEY: ${EGMA_SIMULATOR_DEEPGRAM_API_KEY:-}
      EGMA_SIMULATOR_TTS_PROVIDER: ${EGMA_SIMULATOR_TTS_PROVIDER:-scripted}
      EGMA_SIMULATOR_ELEVENLABS_API_KEY: ${EGMA_SIMULATOR_ELEVENLABS_API_KEY:-}
      # How a phone call's audio travels, for a simulation whose connection
      # names a number. Naming a backend is what makes the rest required
      # and what makes this simulator able to dial at all; unset, it starts
      # in silence and refuses such a simulation with the variable to set.
      # The simulator's own posture is unchanged either way: it joins a
      # LiveKit room outbound and is never dialled into. `scripted` places
      # no call at all and is what the local story and CI use. A LiveKit
      # and a SIP trunk are what make a real call possible; the trunk is
      # yours, from any carrier, either one already stored in LiveKit or
      # the inline fields below. Standing the LiveKit and SIP containers up
      # beside this one is a separate, opt-in overlay: those need a public
      # IP, which this file never assumes.
      EGMA_SIMULATOR_MEDIA_BACKEND: ${EGMA_SIMULATOR_MEDIA_BACKEND:-}
      EGMA_SIMULATOR_LIVEKIT_URL: ${EGMA_SIMULATOR_LIVEKIT_URL:-}
      EGMA_SIMULATOR_LIVEKIT_API_KEY: ${EGMA_SIMULATOR_LIVEKIT_API_KEY:-}
      EGMA_SIMULATOR_LIVEKIT_API_SECRET: ${EGMA_SIMULATOR_LIVEKIT_API_SECRET:-}
      EGMA_SIMULATOR_SIP_TRUNK_ID: ${EGMA_SIMULATOR_SIP_TRUNK_ID:-}
      EGMA_SIMULATOR_SIP_TRUNK_ADDRESS: ${EGMA_SIMULATOR_SIP_TRUNK_ADDRESS:-}
      EGMA_SIMULATOR_SIP_TRUNK_NUMBER: ${EGMA_SIMULATOR_SIP_TRUNK_NUMBER:-}
      EGMA_SIMULATOR_SIP_TRUNK_USERNAME: ${EGMA_SIMULATOR_SIP_TRUNK_USERNAME:-}
      EGMA_SIMULATOR_SIP_TRUNK_PASSWORD: ${EGMA_SIMULATOR_SIP_TRUNK_PASSWORD:-}
      # The volume below, and the two things kept on it. Recordings are
      # what a report can only point at, and the write-ahead log is the
      # only record of a report that never got through — losing either to
      # a container being replaced would lose a simulation's evidence, so
      # both live on the volume rather than in the container.
      EGMA_SIMULATOR_BLOB_DIR: /var/lib/egma-simulator/blobs
      EGMA_SIMULATOR_WAL_DIR: /var/lib/egma-simulator/wal
      # How the pull behaves. The defaults suit a control plane on the same
      # network; a slow link is what these are for.
      EGMA_SIMULATOR_CLAIMANT: ${EGMA_SIMULATOR_CLAIMANT:-}
      EGMA_SIMULATOR_HEARTBEAT_SECONDS: ${EGMA_SIMULATOR_HEARTBEAT_SECONDS:-}
      EGMA_SIMULATOR_CLAIM_WAIT_SECONDS: ${EGMA_SIMULATOR_CLAIM_WAIT_SECONDS:-}
      EGMA_SIMULATOR_REPORT_DEADLINE_SECONDS: ${EGMA_SIMULATOR_REPORT_DEADLINE_SECONDS:-}
      EGMA_SIMULATOR_LOG_LEVEL: ${EGMA_SIMULATOR_LOG_LEVEL:-INFO}
    volumes:
      - simulator-data:/var/lib/egma-simulator
    depends_on:
      api:
        condition: service_healthy
    # No `healthcheck` here, unlike every other service, and for the same
    # reason there is no `ports`: nothing listens. The other four are
    # probed by asking them something over a port they listen on, and this
    # one listens on none — a check that only proved the process exists
    # would prove nothing Docker does not already know, since the process
    # is the container and its death is the container's exit.
    #
    # What could go wrong instead is already answered elsewhere. Bad
    # configuration stops it before it claims anything, saying which
    # variable. A control plane it cannot reach is in its log, once and
    # then once a minute. And a simulator that dies holding claimed work
    # is the control plane's to notice, by the heartbeats stopping — which
    # is the one place that can act on it, because it is the only side
    # that knows what was claimed.

  # The grader: the service that judges finished conversations. It claims its
  # work rather than being sent it, so there is no `ports:` here and there
  # never will be — every arrow points out, exactly as the simulator's do,
  # and adding this container to a self-host costs no inbound networking at
  # all. It sits on the control plane's side of the wire, so it reads the two
  # stores directly rather than through the API; the API gains nothing at all
  # from grading existing.
  #
  # Scaling it is running more copies of it. They claim from one queue, take
  # what they have room for, and distribute between themselves with nothing in
  # front of them: `docker compose up --scale grader=3` is the whole dial.
  grader:
    build:
      context: .
      dockerfile: apps/grader/Dockerfile
    environment:
      # The two stores, on the same terms the API reads them: conversations and
      # graders come out of Postgres, verdicts go into ClickHouse. Both are
      # required, because a grader that started with nowhere to read from and
      # nowhere to write to would look healthy and judge nothing.
      DATABASE_URL: postgres://${POSTGRES_USER:-egma}:${POSTGRES_PASSWORD:-egma}@postgres:5432/${POSTGRES_DB:-egma}
      CLICKHOUSE_URL: http://${CLICKHOUSE_USER:-egma}:${CLICKHOUSE_PASSWORD:-egma}@clickhouse:8123/${CLICKHOUSE_DB:-egma}
      # `EGMA_ENCRYPTION_KEY` is deliberately absent, and its absence is the
      # point: grading reads conversations, graders and test versions, and
      # writes verdicts. It never touches a connection's credentials, so it is
      # never handed the key that could unseal one.
      #
      # This copy's own name for itself, in claims and in its log. Unset is
      # fine and usual — it names itself after its host and process, which is
      # what tells two copies apart.
      EGMA_GRADER_CLAIMANT: ${EGMA_GRADER_CLAIMANT:-}
      # How many conversations one copy judges at once. It claims only what it
      # has room for, so a burst of finished simulations degrades to a queue
      # rather than to overload — raise this, or start a second copy.
      EGMA_GRADER_CAPACITY: ${EGMA_GRADER_CAPACITY:-4}
      # How the claim behaves. A copy says it is still alive every heartbeat
      # while it holds a conversation, and a copy silent for longer than the
      # lease loses it to whichever copy asks next — which is how a container
      # replaced mid-judgment costs one lease and no verdict. The heartbeat
      # must stay well under the lease.
      EGMA_GRADER_HEARTBEAT_SECONDS: ${EGMA_GRADER_HEARTBEAT_SECONDS:-}
      EGMA_GRADER_LEASE_SECONDS: ${EGMA_GRADER_LEASE_SECONDS:-}
      # The backstop, and **not** how work arrives. A conversation ending wakes
      # this service on the transaction that ended it, so nothing a verdict
      # waits for is on a timer. This is for the notification raised while
      # every copy happened to be restarting: it costs one indexed query and
      # catches the case that would otherwise look like grading having stopped.
      EGMA_GRADER_SWEEP_SECONDS: ${EGMA_GRADER_SWEEP_SECONDS:-}
      # How long a production conversation has to be quiet before it is judged
      # without ever having been closed. A well-behaved exporter closes the span
      # the whole conversation happened inside, egma is woken by it, and this
      # decides nothing. It is here for the exporter that never closes one — a
      # crashed agent, a framework that emits no session span — where the event
      # to wait for is the absence of events. Five minutes by default: shorter
      # judges a caller left on hold halfway through, longer leaves a broken
      # exporter's conversations unjudged for an afternoon.
      EGMA_GRADER_TRACE_IDLE_SECONDS: ${EGMA_GRADER_TRACE_IDLE_SECONDS:-}
      EGMA_GRADER_LOG_LEVEL: ${EGMA_GRADER_LOG_LEVEL:-INFO}
    depends_on:
      api:
        condition: service_healthy
    # No `healthcheck` here, for the reason the simulator has none: nothing
    # listens. The schema is applied by the API on boot, which is what this
    # waits for — there is no migration container and no manual step, and a
    # second migrator racing the first would buy nothing.
    #
    # What could go wrong instead is answered elsewhere. Bad configuration
    # stops it before it claims anything, saying which variable. A store it
    # cannot reach is in its log. And a copy that dies holding a conversation
    # is the claim's to notice, by the heartbeats stopping — which is the one
    # place that can act on it, because it is the only side that knows what
    # was claimed.

volumes:
  postgres-data:
  clickhouse-data:
  simulator-data:
