name: egma

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-egma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-egma}
      POSTGRES_DB: ${POSTGRES_DB:-egma}
    ports:
      # **Published to this machine and no further**, which is the object
      # store's idiom below and the media server's, for the same reason and a
      # blunter version of it. What answers here is every row this platform
      # holds — organizations, keys, and the sealed settings this effort just
      # moved into the database — and the user and password it answers to are
      # written a few lines above, in a public repository. On 0.0.0.0 that is
      # `docker compose up` on a coffee-shop network offering every customer's
      # data to the room.
      #
      # A default is right for these two where it was wrong for the secrets,
      # because this file creates the container it names them for: the value is
      # consistent with itself, and a self-hoster who sets nothing gets the
      # deployment the README documents. What the default must not also do is
      # carry that consistency onto the network, so the bind closes the door
      # the published pair would otherwise open. Widen it deliberately — and
      # set POSTGRES_PASSWORD in the same breath.
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-egma} -d ${POSTGRES_DB:-egma}"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The trace store. Single node, no Keeper and no replication: this is the
  # honest floor for a self-host, not a cluster. The version is pinned to the
  # newest long-term-support release rather than to a moving tag, because the
  # one thing a self-hoster must never get from `docker compose pull` is a
  # different engine underneath their stored traces.
  clickhouse:
    image: clickhouse/clickhouse-server:26.3.17.56
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-egma}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-egma}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-egma}
    ports:
      # Loopback by default, for the reason Postgres beside it is: the user and
      # password this store answers to are published in this repository, and
      # what it holds is every conversation this platform has ever recorded a
      # trace of. See the paragraph on the Postgres port.
      - "${CLICKHOUSE_BIND:-127.0.0.1}:${CLICKHOUSE_PORT:-8124}:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    # No `ulimits` here on purpose. ClickHouse wants far more descriptors than
    # a shell's default hands it, but asking for them in this file makes
    # `docker compose up` fail outright — a container may not raise its limit
    # above the daemon's own hard one, and on a host whose hard `nofile` is
    # 1024 or 4096 creation fails with "error setting rlimit type 7: operation
    # not permitted". A compose file that does not start is worse than one
    # whose descriptor limit is low, so the raise lives in
    # `docker-compose.override.yml.example` for the self-hoster who needs it.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The object store, and the third thing this deployment keeps. Postgres holds
  # what happened, ClickHouse holds the traces of it, and this holds the bytes
  # neither of them should ever carry: a voice simulation's recording, which is
  # megabytes of audio that a row can only point at.
  #
  # It is required rather than optional, and that reverses an earlier position.
  # A recording written inside the simulator that made it is a recording only
  # that container can read — so the moment a self-hoster does what this file
  # invites them to do and starts a second simulator, half their audio becomes
  # unreadable with nothing said about it. The cost is one container, accepted
  # knowingly.
  #
  # MinIO speaks the S3 API, so nothing above it knows whether it is talking to
  # this container or to a bucket at any provider: point
  # EGMA_SIMULATOR_S3_ENDPOINT somewhere else and this container is simply not
  # used. The release is pinned rather than left on a moving tag, for the reason
  # ClickHouse's is: what a self-hoster must never get from `docker compose
  # pull` is a different engine underneath their stored objects.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data"]
    environment:
      # The store's own root credential, and the one the simulator writes
      # with. Interpolated into both from one pair here so the two halves can
      # never disagree — the same idiom the LiveKit key below uses.
      #
      # **It has no default, and that is the point.** It used to be a
      # development pair written in this file, in a public repository, and
      # what it opens is the admin surface of the store every recording lives
      # in — rights to list, replace and delete a customer's call audio. A
      # deployment must state its own, and one that states none is refused at
      # `up` with the variable's name rather than started on a password every
      # reader of this repository holds. MinIO refuses a root password under
      # eight characters, so a short one fails at `up` too.
      MINIO_ROOT_USER: ${EGMA_S3_ACCESS_KEY_ID:?no default — the recording store's own credential. openssl rand -hex 8 makes one, set it in .env}
      MINIO_ROOT_PASSWORD: ${EGMA_S3_SECRET_ACCESS_KEY:?no default — openssl rand -base64 24 makes one, at least 8 characters, set it in .env}
    volumes:
      - minio-data:/data
    ports:
      # This is that day, and this port is what a signed link costs.
      #
      # Until recordings could be heard, nothing outside this network read one:
      # the simulator wrote over the compose network, by service name, exactly
      # as it claims from the API, and there was no `ports:` here at all. Then
      # the control plane started handing a browser a link to an object — and a
      # link is only useful if the browser can reach what it points at. The
      # bytes go from this container straight to the browser and never through
      # the API, which is the whole design: seeking inside a recording is a byte
      # range this store serves, not megabytes of audio re-proxied by a control
      # plane whose job was the permission decision.
      #
      # So this is published, and what protects it is not the network. It is
      # that every object in it is reachable only with a signature the control
      # plane mints, for one object, for fifteen minutes, after checking that
      # the person asking is in the organization the simulation belongs to. The
      # credential that mints those signatures is read-only — see the bucket job
      # below — so the worst a leaked one can do is read a recording, never
      # replace one.
      #
      # **Published to this machine and no further**, which is the LiveKit
      # server's idiom above and for a sharper version of its reason. What
      # answers on this port is not only the recordings: it is the store's
      # admin surface and its *root* credential, which can list, replace and
      # delete every recording a deployment holds. On 0.0.0.0 that is
      # `docker compose up` on a coffee-shop network offering every customer's
      # recording to the room, to read and to overwrite. This product calls a
      # recording evidence, and evidence somebody else can replace is not
      # evidence.
      #
      # That credential used to have a development default written in this
      # repository, where anybody could read it, which made the paragraph above
      # true on the machine's own network too. It has none now — see the store
      # above — so what stands between a wide bind and a stranger is a password
      # this deployment chose. The bind stays loopback all the same: a
      # credential is one mistake away from a wide port, and this is the cheap
      # half of that pair.
      #
      # The loopback bind costs the default deployment nothing, because
      # EGMA_BLOB_PUBLIC_URL defaults to `http://localhost:9000` — a browser on
      # this machine, which is the deployment this file is written for.
      #
      # **Opening it is one variable, and it is a real decision.** A deployment
      # whose browsers are somewhere else — a server, a colleague's laptop —
      # sets `EGMA_S3_BIND=0.0.0.0` and sets EGMA_BLOB_PUBLIC_URL to the
      # address those browsers use. What that then offers the network is a
      # writable store behind the credential above, so it is worth having
      # chosen that one deliberately rather than typed the shortest thing that
      # got `up` to stop complaining.
      #
      # **EGMA_BLOB_PUBLIC_URL on the api service must name this address**, and
      # naming the wrong one is the single most common way a self-hosted object
      # store breaks. A signature covers the host it was made for: sign for
      # `minio:9000`, fetch from `localhost:9000`, and every recording fails
      # with `SignatureDoesNotMatch`, which names neither address and sends
      # whoever meets it looking at their credentials for an afternoon. The
      # default below assumes a browser on this machine. An egma other people
      # reach — at 192.168.1.10, at egma.example — must say so there, the same
      # way it already has to say so in EGMA_BASE_URL.
      - "${EGMA_S3_BIND:-127.0.0.1}:${EGMA_S3_PORT:-9000}:9000"
    healthcheck:
      # `mc` ships inside this image, so the probe needs no second one. `local`
      # is the alias the server answers to from inside its own container.
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The bucket and the read-only user, made once and then never again.
  #
  # A fresh volume arrives empty, and an empty object store has no bucket in
  # it — so without this the first recording of every new deployment fails
  # against a bucket nobody was told to create, and the error names the bucket
  # rather than the missing step. It runs to completion and exits; the
  # simulator waits for that exit rather than for the store, which is what
  # makes "the deployment creates its bucket on first start" true rather than
  # nearly true.
  #
  # Every step of it is safe to run again, which is what makes it safe to run
  # on every `up`: `mc mb --ignore-existing` finds the bucket and says nothing,
  # and `mc admin policy create`, `mc admin user add` and `mc admin policy
  # attach` each write what is already there and exit zero. That matters more
  # than it looks — the simulator waits on this job *completing*, so a step that
  # failed the second time would take the whole deployment down on its first
  # restart.
  #
  # ## Two credentials, and the reason they are two
  #
  # The simulator holds one that can write, because writing a recording is what
  # a simulator does. The control plane holds one that can do nothing but read
  # one object at a time, because reading is all it ever does: it is handed a
  # reference by a row it has already checked the reader against, and it signs.
  # A leaked read credential must not be usable to overwrite a customer's call
  # recording — a recording is evidence, and evidence somebody else can replace
  # is not evidence.
  #
  # The policy is `s3:GetObject` on this bucket and nothing else. Not `s3:*`,
  # not a `s3:PutObject` "for later", and deliberately not `s3:ListBucket`: a
  # credential that can list is a credential that can enumerate every recording
  # a deployment holds, and nothing in egma ever asks this store a question it
  # does not already know the answer to.
  minio-bucket:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      EGMA_S3_ACCESS_KEY_ID: ${EGMA_S3_ACCESS_KEY_ID:?no default — the recording store's own credential. openssl rand -hex 8 makes one, set it in .env}
      EGMA_S3_SECRET_ACCESS_KEY: ${EGMA_S3_SECRET_ACCESS_KEY:?no default — openssl rand -base64 24 makes one, at least 8 characters, set it in .env}
      EGMA_S3_BUCKET: ${EGMA_S3_BUCKET:-egma-recordings}
      # The read-only half, interpolated into the api service below from the
      # same pair so the two can never disagree. It has no default for the
      # reason the root pair above has none: a credential written in a public
      # repository is a credential every reader of it holds, and this one
      # reads every recording a deployment has.
      EGMA_S3_READ_ACCESS_KEY_ID: ${EGMA_S3_READ_ACCESS_KEY_ID:?no default — the read-only credential playback links are signed with. openssl rand -hex 8 makes one, set it in .env}
      EGMA_S3_READ_SECRET_ACCESS_KEY: ${EGMA_S3_READ_SECRET_ACCESS_KEY:?no default — openssl rand -base64 24 makes one, set it in .env beside EGMA_S3_READ_ACCESS_KEY_ID}
    # Everything reaches `mc` through the environment rather than as arguments,
    # and `$$` is an escaped `$`: compose leaves it alone and the shell inside
    # the container reads it.
    #
    # For the credentials that keeps the store's password out of this
    # container's command line, which `ps` on the host and `docker top` both
    # show. For the bucket it is the other reason: a name interpolated
    # straight into this string is a name a shell then reads, so one carrying
    # a quote or a `$(...)` would run rather than fail. The simulator refuses
    # a bucket name no store would take, at startup, by name — this job
    # trying something else instead of failing the same way is the asymmetry
    # worth closing, not the privilege, which whoever writes .env already has.
    #
    # The policy document is written by `printf` with the bucket as its one
    # argument, for that same reason: the name goes in as data rather than as
    # something the shell reads, and `mc` gets a file rather than a here-string
    # a quote could end early.
    entrypoint:
      - sh
      - -c
      - >
        mc alias set egma http://minio:9000
        "$$EGMA_S3_ACCESS_KEY_ID" "$$EGMA_S3_SECRET_ACCESS_KEY" &&
        mc mb --ignore-existing "egma/$$EGMA_S3_BUCKET" &&
        printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::%s/*"]}]}'
        "$$EGMA_S3_BUCKET" > /tmp/read-recordings.json &&
        mc admin policy create egma egma-read-recordings /tmp/read-recordings.json &&
        mc admin user add egma
        "$$EGMA_S3_READ_ACCESS_KEY_ID" "$$EGMA_S3_READ_SECRET_ACCESS_KEY" &&
        mc admin policy attach egma egma-read-recordings
        --user "$$EGMA_S3_READ_ACCESS_KEY_ID"
    depends_on:
      minio:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-egma}:${POSTGRES_PASSWORD:-egma}@postgres:5432/${POSTGRES_DB:-egma}}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://${CLICKHOUSE_USER:-egma}:${CLICKHOUSE_PASSWORD:-egma}@clickhouse:8123/${CLICKHOUSE_DB:-egma}}
      HOST: 0.0.0.0
      PORT: "3100"
      # Signs session cookies. No default — one written here is one every
      # reader of this repository can mint a session with. `openssl rand
      # -base64 32` makes one; see .env.example.
      EGMA_AUTH_SECRET: ${EGMA_AUTH_SECRET:?no default — openssl rand -base64 32 makes one, set it in .env}
      # Seals connection credentials and every platform setting before they
      # reach the database. No default, and this is the sharpest of the three:
      # a deployment sealed with a key printed in a public repository is not
      # sealed, and a copy of its database is a copy of its provider accounts.
      # `openssl rand -hex 32` makes one. Back it up alongside the database;
      # losing it loses every stored credential and every stored setting.
      EGMA_ENCRYPTION_KEY: ${EGMA_ENCRYPTION_KEY:?no default — openssl rand -hex 32 makes one, set it in .env and back it up beside the database}
      # What the simulator must show to claim work. Claim answers carry
      # customers' live connection credentials and port 3100 is published on
      # this machine, so the check is always on and there is no default: it is
      # interpolated identically into the simulator below, so one line in .env
      # sets both halves and they always match. egma_st_ then `openssl rand
      # -hex 32` makes one.
      EGMA_SIMULATOR_SERVICE_TOKEN: ${EGMA_SIMULATOR_SERVICE_TOKEN:?no default — egma_st_ then openssl rand -hex 32, set it in .env for both containers}
      # Where a browser reaches this instance. The pages and the API answer on
      # one origin, and that origin is the self-hoster's own — which is why
      # there is no default for it to quietly be wrong about. Every agent
      # repository binds to what this says, and an instance others reach at
      # 192.168.1.10 while this says localhost refuses their first command
      # rather than answering it about somebody else's machine. `egma
      # self-host up` sets this to the address it prints.
      EGMA_BASE_URL: ${EGMA_BASE_URL:?no default — the whole address a browser reaches egma at, scheme host and port. egma self-host up sets it for you, or set it in .env}
      # Where **a browser** reaches the recording store, which is not where this
      # container reaches it. Beside EGMA_BASE_URL because it is the same kind
      # of fact and gets set at the same moment: an egma other people reach at
      # 192.168.1.10 or at egma.example has to say so in both.
      #
      # A signature covers the host it was made for, so this is the one setting
      # in the whole deployment that fails silently and expensively when it is
      # wrong: sign for `minio:9000`, fetch from a browser, and every recording
      # comes back `SignatureDoesNotMatch` — an error naming neither address.
      # Which is why the API holds no internal address for the store at all. It
      # never opens a connection to it; signing is arithmetic, and the bytes go
      # from the store to the browser.
      #
      # **This and EGMA_BASE_URL must agree about http: and https:.** They are
      # one browser's two addresses. A page served over https: may not fetch
      # audio over http: — the browser blocks it as mixed content before the
      # request is even sent, so the store is never asked and the perfect
      # signature never checked. The API refuses to start on that pair and names
      # both variables, rather than let it be found one silent player at a time.
      #
      # **A plaintext address here has a price, and it is worth knowing before
      # you type one.** `http://192.168.1.10:9000` works, and it also puts the
      # recording — a customer's call audio — and the fifteen-minute link that
      # replays it on the wire readable by anybody who can see that network.
      # `http://localhost:9000` shows that to nobody. It is allowed rather than
      # refused because an egma on http: is already handing the same network the
      # session cookie that opens every recording; put the store behind the same
      # certificate as egma on any network you do not trust.
      #
      # Leaving it unset is allowed and is not a failure: the platform runs, the
      # runs run, and a request for a recording answers with the name of this
      # variable rather than with an empty player.
      EGMA_BLOB_PUBLIC_URL: ${EGMA_BLOB_PUBLIC_URL:-http://localhost:${EGMA_S3_PORT:-9000}}
      EGMA_BLOB_BUCKET: ${EGMA_BLOB_BUCKET:-${EGMA_S3_BUCKET:-egma-recordings}}
      # One region for one store, from one place. The simulator signs its
      # uploads with a region and this container signs its playback links with
      # one, and the day those two disagree is a day every upload works and
      # every playback fails with `SignatureDoesNotMatch` — naming neither the
      # setting nor the region, which is the same nameless failure the public
      # address above is written about. So both default from `EGMA_S3_REGION`
      # and a self-hoster on real S3 sets it once.
      EGMA_BLOB_REGION: ${EGMA_BLOB_REGION:-${EGMA_S3_REGION:-}}
      # The read-only half of the store's credentials, interpolated from the
      # same pair the bucket job creates the user with so the two always match.
      # It can fetch one object at a time and nothing else — it cannot write,
      # cannot delete and cannot list, so a leak of it reads a recording rather
      # than replacing one. A deployment pointed at somebody else's S3 sets
      # these two directly and gives that credential the same shape.
      EGMA_BLOB_ACCESS_KEY_ID: ${EGMA_BLOB_ACCESS_KEY_ID:-${EGMA_S3_READ_ACCESS_KEY_ID:?no default — the read-only credential playback links are signed with. openssl rand -hex 8 makes one, set it in .env}}
      EGMA_BLOB_SECRET_ACCESS_KEY: ${EGMA_BLOB_SECRET_ACCESS_KEY:-${EGMA_S3_READ_SECRET_ACCESS_KEY:?no default — openssl rand -base64 24 makes one, set it in .env beside EGMA_S3_READ_ACCESS_KEY_ID}}
      EGMA_SINGLE_ORGANIZATION: ${EGMA_SINGLE_ORGANIZATION:-true}
      EGMA_TRUST_PROXY: ${EGMA_TRUST_PROXY:-false}
      # The budget belongs to the organization rather than to a key, so
      # rotating a key does not reset it.
      EGMA_RATE_LIMIT_PER_MINUTE: ${EGMA_RATE_LIMIT_PER_MINUTE:-600}
      # Mail is optional and unset by default. With none, invitations hand
      # their link back to whoever sent them and signup asks for no
      # verification; setting this turns both around at once. It is never a
      # prerequisite for anything, including adding a second person.
      EGMA_SMTP_URL: ${EGMA_SMTP_URL:-}
      EGMA_MAIL_FROM: ${EGMA_MAIL_FROM:-}
      # The judge a project is given when it has configured none. It is the
      # one thing setup does not put in the platform's store: a judge belongs
      # to the project that chose it, so it is seeded from here on boot.
      # Written into each project's own
      # sealed row on boot and never over one that is already there. It is here
      # rather than on the grader on purpose: a judge configured per container
      # is a judge no project chose. All three or none — the API refuses to
      # start on half, because half a judge errors every verdict it is given.
      EGMA_JUDGE_PROVIDER: ${EGMA_JUDGE_PROVIDER:-}
      EGMA_JUDGE_MODEL: ${EGMA_JUDGE_MODEL:-}
      EGMA_JUDGE_API_KEY: ${EGMA_JUDGE_API_KEY:-}
      # What this deployment has been configured with — the persona's model,
      # its speech legs, and the carrier a phone call goes over. The
      # platform's own settings rather than any one container's: they are
      # written into the platform's store on boot, sealed, for anything the
      # store does not already hold — and never over a value somebody
      # changed, so a redeploy carrying an old key in a script cannot undo a
      # new one. They then reach the simulator on the work order it claims,
      # which is why no simulator container names any of them.
      #
      # Setting them here is one of the two ways in, and it is for a
      # deployment that answers no questions; the other is
      # `egma self-host setup`, which asks. Leave them empty and the platform
      # reports `setup required` naming each one until somebody supplies it —
      # which is the whole difference from the file this replaced, where an
      # absent setting was an empty setting and nothing said so.
      EGMA_PERSONA_MODEL_PROVIDER: ${EGMA_PERSONA_MODEL_PROVIDER:-}
      EGMA_PERSONA_MODEL: ${EGMA_PERSONA_MODEL:-}
      EGMA_PERSONA_MODEL_API_KEY: ${EGMA_PERSONA_MODEL_API_KEY:-}
      EGMA_PERSONA_STT_PROVIDER: ${EGMA_PERSONA_STT_PROVIDER:-}
      EGMA_PERSONA_STT_API_KEY: ${EGMA_PERSONA_STT_API_KEY:-}
      EGMA_PERSONA_TTS_PROVIDER: ${EGMA_PERSONA_TTS_PROVIDER:-}
      EGMA_PERSONA_TTS_API_KEY: ${EGMA_PERSONA_TTS_API_KEY:-}
      EGMA_PERSONA_TTS_MODEL: ${EGMA_PERSONA_TTS_MODEL:-}
      EGMA_PERSONA_TTS_VOICE: ${EGMA_PERSONA_TTS_VOICE:-}
      EGMA_PERSONA_VAD_PROVIDER: ${EGMA_PERSONA_VAD_PROVIDER:-}
      # The carrier, under the names the old phone setup wrote, so an
      # operator upgrading meets the words they were given before. The API
      # holds the trunk password only long enough to seal it — exactly as it
      # already holds a judge's key and a connection's credentials — and it
      # neither dials nor speaks with any of it.
      EGMA_MEDIA_BACKEND: ${EGMA_MEDIA_BACKEND:-}
      EGMA_PHONE_TRUNK_ADDRESS: ${EGMA_PHONE_TRUNK_ADDRESS:-}
      EGMA_PHONE_SOURCE_NUMBER: ${EGMA_PHONE_SOURCE_NUMBER:-}
      EGMA_PHONE_TRUNK_USERNAME: ${EGMA_PHONE_TRUNK_USERNAME:-}
      EGMA_PHONE_TRUNK_PASSWORD: ${EGMA_PHONE_TRUNK_PASSWORD:-}
    ports:
      # Published on the host, so that a self-hoster who already runs
      # something on these can move egma rather than move the other thing —
      # and so that two egma platforms can stand side by side on one machine,
      # each with its own instance identity, which is how the boundary between
      # a platform and an agent repository is proved at all. The port inside
      # the container never moves: it is the compose network's, and the two
      # halves of a published port are not the same decision.
      - "${EGMA_API_PORT:-3100}:3100"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # The web application proxies the API's paths so that both answer on one
        # origin. Next resolves this into the build, so it is an argument rather
        # than an environment variable.
        EGMA_API_ORIGIN: ${EGMA_API_ORIGIN:-http://api:3100}
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3101"
    ports:
      - "${EGMA_WEB_PORT:-3101}:3101"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3101/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s

  # The simulator: the service that conducts simulations. It claims its
  # work rather than being sent it, so there is no `ports:` here and there
  # never will be — every arrow points out, and adding this container to a
  # self-host costs no inbound networking at all. Everything it needs is
  # below; there are no files to place and no flags to pass.
  simulator:
    build:
      context: .
      dockerfile: apps/simulator/Dockerfile
    environment:
      # Where it claims, heartbeats and reports. The API and the simulator
      # meet inside this network, so this is the service name rather than
      # the origin a browser uses. The endpoints it dials arrive with the
      # trigger; until then it asks, is told there is nothing, and asks
      # again, which is what a queue with nothing in it looks like.
      EGMA_SIMULATOR_CONTROL_PLANE_URL: ${EGMA_SIMULATOR_CONTROL_PLANE_URL:-http://api:3100}
      # What it shows the control plane to be allowed to claim, as a bearer
      # — the same header an egma key uses everywhere else. The API checks it
      # on every claim, so this reads the same variable as the api service
      # above and the two halves always match. It has no default there and
      # none here: one line in .env sets both.
      EGMA_SIMULATOR_SERVICE_TOKEN: ${EGMA_SIMULATOR_SERVICE_TOKEN:?no default — egma_st_ then openssl rand -hex 32, set it in .env for both containers}
      # How many simulations one simulator conducts at once. It claims only
      # what it has room for, so a big run degrades to a queue rather than
      # to overload — raise this, or start a second simulator, and they
      # distribute between themselves with nothing in front of them.
      # Blank means the simulator's own default of two. Compose passes the
      # variable through but does not restate that default, so a bare process
      # and a container cannot silently acquire different limits again.
      EGMA_SIMULATOR_CAPACITY: ${EGMA_SIMULATOR_CAPACITY:-}
      # **No provider setting reaches this container.** Which model the
      # persona thinks with, what it speaks and hears with, what tells it
      # the agent has stopped talking, which bridge places a call and which
      # carrier trunk it goes over are all the *platform's* settings now:
      # the API seals them into its own store and hands them to this
      # container on the work order it claims, read afresh for every
      # simulation. So there is nothing here to set, nothing to keep in
      # step with the api service above, and nothing that can go missing
      # when this container is recreated. A second simulator is started and
      # nothing is copied to it.
      #
      # Two per-container exceptions stay, and each is here because it
      # cannot be anywhere else. This is the address this container reaches
      # a model provider at — a property of the network it is on rather
      # than of the deployment's account:
      EGMA_SIMULATOR_MODEL_BASE_URL: ${EGMA_SIMULATOR_MODEL_BASE_URL:-}
      # And this is which model the listening leg asks for, which the
      # platform's settings do not carry:
      EGMA_SIMULATOR_STT_MODEL: ${EGMA_SIMULATOR_STT_MODEL:-}
      # The media server this container talks to. It is a third-party
      # binary that reads its own key and secret when it is *created*, so
      # it can never reach the platform's database and its address and
      # credential stay bootstrap configuration on both sides. The default
      # is the LiveKit beside it, filled in from the same pair the two
      # containers below authenticate each other with, so the three halves
      # can never disagree. That pair has no default here: `egma self-host`
      # generates one for the workspace and hands it to all three, so a
      # deployment never runs on a credential published in this repository.
      #
      # Nothing here makes this simulator dial. Whether it may, and what
      # trunk it goes over, is the platform's `media_backend` and carrier
      # trunk — so `docker compose up` on a machine that has never seen a
      # carrier starts exactly as it always did, and platform readiness
      # never waits on carrier setup.
      EGMA_SIMULATOR_LIVEKIT_URL: ${EGMA_SIMULATOR_LIVEKIT_URL:-ws://livekit:7880}
      EGMA_SIMULATOR_LIVEKIT_API_KEY: ${EGMA_SIMULATOR_LIVEKIT_API_KEY:-${EGMA_LIVEKIT_API_KEY:?no default anywhere — egma self-host up generates this pair and writes it to .egma-platform/platform.env}}
      EGMA_SIMULATOR_LIVEKIT_API_SECRET: ${EGMA_SIMULATOR_LIVEKIT_API_SECRET:-${EGMA_LIVEKIT_API_SECRET:?no default anywhere — egma self-host up generates this pair and writes it to .egma-platform/platform.env}}
      # Where recordings go. Naming an endpoint is the whole of what sends
      # them to object storage; naming none keeps them in a directory on
      # whatever disk the process is running on, which is what a bare
      # `egma-simulator` and the test suite do. This deployment names one,
      # so no recording touches the simulator container's disk — which is
      # the point: a recording only the container that made it can read is
      # a recording nobody can hear, and starting a second simulator would
      # silently lose half the audio.
      #
      # The service name, not the address a browser uses. They are two
      # different addresses on nearly every real deployment and confusing
      # them is the most common way a self-hosted object store breaks.
      EGMA_SIMULATOR_S3_ENDPOINT: ${EGMA_SIMULATOR_S3_ENDPOINT:-http://minio:9000}
      EGMA_SIMULATOR_S3_BUCKET: ${EGMA_SIMULATOR_S3_BUCKET:-${EGMA_S3_BUCKET:-egma-recordings}}
      # The same region the API signs playback links with, from the same
      # place — see EGMA_BLOB_REGION on the api service. Two halves of one
      # store signing for two different regions is every upload working and
      # every playback failing.
      EGMA_SIMULATOR_S3_REGION: ${EGMA_SIMULATOR_S3_REGION:-${EGMA_S3_REGION:-}}
      # The write credential, interpolated from the same pair the store
      # above is stood up with so the two halves always match. A
      # deployment pointed at somebody else's S3 sets these two directly
      # and leaves the store above unused.
      EGMA_SIMULATOR_S3_ACCESS_KEY_ID: ${EGMA_SIMULATOR_S3_ACCESS_KEY_ID:-${EGMA_S3_ACCESS_KEY_ID:?no default — the recording store's own credential. openssl rand -hex 8 makes one, set it in .env}}
      EGMA_SIMULATOR_S3_SECRET_ACCESS_KEY: ${EGMA_SIMULATOR_S3_SECRET_ACCESS_KEY:-${EGMA_S3_SECRET_ACCESS_KEY:?no default — openssl rand -base64 24 makes one, at least 8 characters, set it in .env}}
      # The volume below, and the one thing kept on it. The write-ahead
      # log is the only record of a report that never got through, so
      # losing it to a container being replaced would lose a simulation's
      # evidence — it lives on the volume rather than in the container.
      # Recordings used to sit beside it and now do not; the volume stays
      # for this.
      EGMA_SIMULATOR_WAL_DIR: /var/lib/egma-simulator/wal
      # How the pull behaves. The defaults suit a control plane on the same
      # network; a slow link is what these are for.
      EGMA_SIMULATOR_CLAIMANT: ${EGMA_SIMULATOR_CLAIMANT:-}
      EGMA_SIMULATOR_HEARTBEAT_SECONDS: ${EGMA_SIMULATOR_HEARTBEAT_SECONDS:-}
      EGMA_SIMULATOR_CLAIM_WAIT_SECONDS: ${EGMA_SIMULATOR_CLAIM_WAIT_SECONDS:-}
      EGMA_SIMULATOR_REPORT_DEADLINE_SECONDS: ${EGMA_SIMULATOR_REPORT_DEADLINE_SECONDS:-}
      EGMA_SIMULATOR_LOG_LEVEL: ${EGMA_SIMULATOR_LOG_LEVEL:-INFO}
    volumes:
      - simulator-data:/var/lib/egma-simulator
    depends_on:
      api:
        condition: service_healthy
      # The bucket rather than the store, and completed rather than
      # healthy: a store that is up but has no bucket in it refuses every
      # recording, and the one-shot job above is what puts one there.
      minio-bucket:
        condition: service_completed_successfully
      livekit:
        condition: service_healthy
      # Named even though the simulator never speaks to the gateway
      # directly — it asks the *server* to place a call, and the server
      # hands that to whichever gateway has announced itself. Without this
      # line the gateway is a container nothing depends on, so
      # `docker compose up simulator` would bring up a phone stack that
      # cannot place a phone call, and the first thing to notice would be
      # a dial.
      livekit-sip:
        condition: service_started
    # No `healthcheck` here, unlike every other service, and for the same
    # reason there is no `ports`: nothing listens. The other four are
    # probed by asking them something over a port they listen on, and this
    # one listens on none — a check that only proved the process exists
    # would prove nothing Docker does not already know, since the process
    # is the container and its death is the container's exit.
    #
    # What could go wrong instead is already answered elsewhere. Bad
    # configuration stops it before it claims anything, saying which
    # variable. A control plane it cannot reach is in its log, once and
    # then once a minute. And a simulator that dies holding claimed work
    # is the control plane's to notice, by the heartbeats stopping — which
    # is the one place that can act on it, because it is the only side
    # that knows what was claimed.

  # The grader: the service that judges finished conversations. It claims its
  # work rather than being sent it, so there is no `ports:` here and there
  # never will be — every arrow points out, exactly as the simulator's do,
  # and adding this container to a self-host costs no inbound networking at
  # all. It sits on the control plane's side of the wire, so it reads the two
  # stores directly rather than through the API; the API gains nothing at all
  # from grading existing.
  #
  # Scaling it is running more copies of it. They claim from one queue, take
  # what they have room for, and distribute between themselves with nothing in
  # front of them: `docker compose up --scale grader=3` is the whole dial.
  grader:
    build:
      context: .
      dockerfile: apps/grader/Dockerfile
    environment:
      # The two stores, on the same terms the API reads them: conversations and
      # graders come out of Postgres, verdicts go into ClickHouse. Both are
      # required, because a grader that started with nowhere to read from and
      # nowhere to write to would look healthy and judge nothing.
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-egma}:${POSTGRES_PASSWORD:-egma}@postgres:5432/${POSTGRES_DB:-egma}}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://${CLICKHOUSE_USER:-egma}:${CLICKHOUSE_PASSWORD:-egma}@clickhouse:8123/${CLICKHOUSE_DB:-egma}}
      # The same key the API seals with, because a judged grader has to replay
      # the project's own judge key to the provider, and the process making the
      # call is this one. What it can open is held narrow on the other side: a
      # judge key is resolved through one door that refuses every caller whose
      # context did not come from a grading claim, and a connection's
      # credentials sit behind a door asking for a permission the engine's
      # context does not carry. It is the same variable the api service reads
      # and it has no default on either — one line in .env, and the two
      # processes open the same envelopes. A deployment whose projects
      # configure no judge still needs it, because the platform's own settings
      # are sealed with it too.
      #
      # There is still deliberately no model key here. A judge belongs to the
      # project that configured it, never to a container.
      EGMA_ENCRYPTION_KEY: ${EGMA_ENCRYPTION_KEY:?no default — openssl rand -hex 32 makes one, set it in .env and back it up beside the database}
      # This copy's own name for itself, in claims and in its log. Unset is
      # fine and usual — it names itself after its host and process, which is
      # what tells two copies apart.
      EGMA_GRADER_CLAIMANT: ${EGMA_GRADER_CLAIMANT:-}
      # How many conversations one copy judges at once. It claims only what it
      # has room for, so a burst of finished simulations degrades to a queue
      # rather than to overload — raise this, or start a second copy.
      EGMA_GRADER_CAPACITY: ${EGMA_GRADER_CAPACITY:-4}
      # How the claim behaves. A copy says it is still alive every heartbeat
      # while it holds a conversation, and a copy silent for longer than the
      # lease loses it to whichever copy asks next — which is how a container
      # replaced mid-judgment costs one lease and no verdict. The heartbeat
      # must stay well under the lease.
      EGMA_GRADER_HEARTBEAT_SECONDS: ${EGMA_GRADER_HEARTBEAT_SECONDS:-}
      EGMA_GRADER_LEASE_SECONDS: ${EGMA_GRADER_LEASE_SECONDS:-}
      # The backstop, and **not** how work arrives. A conversation ending wakes
      # this service on the transaction that ended it, so nothing a verdict
      # waits for is on a timer. This is for the notification raised while
      # every copy happened to be restarting: it costs one indexed query and
      # catches the case that would otherwise look like grading having stopped.
      EGMA_GRADER_SWEEP_SECONDS: ${EGMA_GRADER_SWEEP_SECONDS:-}
      # How long a production conversation has to be quiet before it is judged
      # without ever having been closed. A well-behaved exporter closes the span
      # the whole conversation happened inside, egma is woken by it, and this
      # decides nothing. It is here for the exporter that never closes one — a
      # crashed agent, a framework that emits no session span — where the event
      # to wait for is the absence of events. Five minutes by default: shorter
      # judges a caller left on hold halfway through, longer leaves a broken
      # exporter's conversations unjudged for an afternoon.
      EGMA_GRADER_TRACE_IDLE_SECONDS: ${EGMA_GRADER_TRACE_IDLE_SECONDS:-}
      EGMA_GRADER_LOG_LEVEL: ${EGMA_GRADER_LOG_LEVEL:-INFO}
    depends_on:
      api:
        condition: service_healthy
    # No `healthcheck` here, for the reason the simulator has none: nothing
    # listens. The schema is applied by the API on boot, which is what this
    # waits for — there is no migration container and no manual step, and a
    # second migrator racing the first would buy nothing.
    #
    # What could go wrong instead is answered elsewhere. Bad configuration
    # stops it before it claims anything, saying which variable. A store it
    # cannot reach is in its log. And a copy that dies holding a conversation
    # is the claim's to notice, by the heartbeats stopping — which is the one
    # place that can act on it, because it is the only side that knows what
    # was claimed.

  # --- The phone stack --------------------------------------------------------
  #
  # Three containers: the LiveKit server (the room a call becomes), its SIP
  # gateway (the thing that speaks to your carrier), and the Redis those two
  # find each other through. They start with everything else, because a
  # platform that cannot place a phone call is not the product — `egma
  # self-host up` brings up one deployment and `egma self-host setup`
  # makes it able to dial. They were an opt-in overlay until the self-hosted
  # release; that overlay is gone and nothing needs to be asked for by name.
  #
  # ## The network truth, container by container
  #
  # | Container         | Reachable from the internet? |
  # |-------------------|------------------------------|
  # | simulator         | **never** — it publishes nothing, in any configuration |
  # | livekit (SFU)     | no — its only clients are the two containers beside it |
  # | livekit-redis     | no |
  # | **livekit-sip**   | **yes**, for a call that arrives — SIP and its RTP range |
  #
  # The gateway is the one honest exception in the whole deployment, and it is
  # not ours to remove: it is the piece a carrier sends a call's audio *to*. It
  # advertises an address and a port in the SDP it sends, and the carrier sends
  # RTP there. On a server with a public IP, or behind a 1:1 NAT with these
  # ports forwarded, that is routine. On a laptop behind an ordinary home
  # router it is not — see the README, which says what actually happens when
  # you try, because we tried.
  #
  # **The escape hatch is one variable.** LiveKit Cloud is the same API behind
  # the same URL, so a deployment that cannot host a gateway points
  # EGMA_SIMULATOR_LIVEKIT_URL at Cloud and everything else — the trunk, the
  # plug, the record — is unchanged.
  #
  # ## The RTP range is narrow on purpose
  #
  # LiveKit's own reference opens 10000-20000/udp. That is ten thousand ports
  # on somebody's firewall for a deployment that places a handful of calls, and
  # a range published to the internet is a range to justify. The default here
  # is 21 ports — about ten calls at once, two ports each — which is more than
  # the simulator's default capacity of two can use. Widen it with the two
  # variables below if you raise capacity, and widen your firewall by exactly
  # as much.

  # The bus the server and the gateway find each other through. Not a store:
  # nothing here is worth keeping across a restart, so there is no volume,
  # and nothing outside this network ever speaks to it, so there is no port.
  livekit-redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The room a phone call becomes. The simulator joins it outbound and the
  # answering phone is put into it by the gateway; from the pipeline's point
  # of view the two are participants in one room and nothing else.
  #
  # Its ports are published to this machine's loopback and no further —
  # the workbench's idiom, for the same reason: a person at this machine
  # may want to reach it, and nobody else has any business doing so. The
  # simulator does not come through here; it uses the compose network.
  #
  # The pair below has **no default**, and that is a fix rather than an
  # omission. It used to fall back to a key and a secret written in this
  # file, in a public repository, and nothing ever replaced them — so a
  # deployment that widened `EGMA_LIVEKIT_BIND` for testing from another
  # machine was accepting anyone who had read the repository. `egma
  # self-host` now generates a pair for the workspace and hands the same
  # one to this server, the simulator and the gateway below.
  #
  # It is the *required* form rather than merely a missing default, which is
  # the difference between a refusal and a puzzle. Empty, this server started
  # on no password at all, the simulator waiting on its health check never
  # started either, and nothing in either log named a variable.
  livekit:
    image: livekit/livekit-server:v1.13.5
    environment:
      LIVEKIT_KEYS: "${EGMA_LIVEKIT_API_KEY:?no default anywhere — egma self-host up generates this pair and writes it to .egma-platform/platform.env}: ${EGMA_LIVEKIT_API_SECRET:?no default anywhere — egma self-host up generates this pair and writes it to .egma-platform/platform.env}"
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          # One UDP port for every room, rather than a range: this server's
          # clients are counted in single figures, so there is nothing to
          # spread across ports.
          udp_port: 7882
          tcp_port: 7881
          # False, and this is the one that matters: with it on, the server
          # STUNs for a public address and hands that to clients as the
          # place to send media. Its clients are on this compose network —
          # the address to give them is this container's own.
          use_external_ip: false
          # What the server tells clients to send media to, when its own
          # address is not the one that works. Empty is right for every
          # deployment where the clients are containers beside it. Set it
          # when a client lives outside this network and cannot route into
          # it — a laptop running Docker Desktop is the case that needs it,
          # and the value is that machine's own LAN address, with
          # EGMA_LIVEKIT_BIND=0.0.0.0 so the published ports answer there.
          node_ip: "${EGMA_LIVEKIT_ADVERTISE_IP:-}"
        redis:
          address: livekit-redis:6379
        logging:
          level: ${EGMA_LIVEKIT_LOG_LEVEL:-info}
    ports:
      - "${EGMA_LIVEKIT_BIND:-127.0.0.1}:7880:7880"
      - "${EGMA_LIVEKIT_BIND:-127.0.0.1}:7881:7881"
      - "${EGMA_LIVEKIT_BIND:-127.0.0.1}:7882:7882/udp"
    depends_on:
      livekit-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7880/"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The gateway: the only container in egma that a carrier talks to.
  #
  # It places the call your trunk carries, and turns the phone leg into a
  # participant in the room above. Its trunk configuration does not live
  # here — the simulator hands a trunk to LiveKit per call, so a customer's
  # carrier credentials stay in the simulator's environment and are never
  # written into a bridge's config file.
  livekit-sip:
    image: livekit/sip:v1.9.0
    # The image's own command names a config file that only exists if you
    # mount one. This overlay has no files to place, so the entrypoint is
    # the binary and the configuration is the environment.
    entrypoint: ["livekit-sip"]
    environment:
      SIP_CONFIG_BODY: |
        # The generated pair, the same one the media server and the
        # simulator hold. No default, for the reason stated above it.
        api_key: ${EGMA_LIVEKIT_API_KEY:?no default anywhere — egma self-host up generates this pair and writes it to .egma-platform/platform.env}
        api_secret: ${EGMA_LIVEKIT_API_SECRET:?no default anywhere — egma self-host up generates this pair and writes it to .egma-platform/platform.env}
        ws_url: ws://livekit:7880
        redis:
          address: livekit-redis:6379
        # The port the gateway listens on **and announces**. It moves with
        # the published port below rather than being fixed at 5060, because
        # the two are one number: a gateway that listens on 5060 while the
        # host publishes 5070 tells the carrier to send its in-dialog
        # requests — a BYE, a re-INVITE — to a port nothing answers on, and
        # what that looks like is a call that connects and then will not hang
        # up cleanly.
        sip_port: ${EGMA_LIVEKIT_SIP_PORT:-5060}
        rtp_port: ${EGMA_LIVEKIT_SIP_RTP_PORT_START:-10000}-${EGMA_LIVEKIT_SIP_RTP_PORT_END:-10020}
        # What address to write into the SDP the carrier reads. Set
        # EGMA_LIVEKIT_SIP_EXTERNAL_IP when you know it — an elastic IP, a
        # 1:1 NAT — and the gateway advertises exactly that. Leave it unset
        # and the gateway asks a STUN server what the world sees, which is
        # right on a host whose public address it cannot read off an
        # interface, and is the case the README's spike is about.
        use_external_ip: ${EGMA_LIVEKIT_SIP_USE_EXTERNAL_IP:-true}
        nat_1_to_1_ip: "${EGMA_LIVEKIT_SIP_EXTERNAL_IP:-}"
        # Nothing dials in, so the gateway is told not to advertise a port
        # for anyone to dial in on.
        hide_inbound_port: true
        logging:
          level: ${EGMA_LIVEKIT_LOG_LEVEL:-info}
    ports:
      # SIP signalling. An outbound call's answers come back on the flow the
      # gateway opened, so this is published for what comes *after* the
      # answer — a carrier's BYE and its in-dialog requests go to the
      # address the gateway advertised, not to that flow.
      - "${EGMA_LIVEKIT_SIP_PORT:-5060}:${EGMA_LIVEKIT_SIP_PORT:-5060}/udp"
      - "${EGMA_LIVEKIT_SIP_PORT:-5060}:${EGMA_LIVEKIT_SIP_PORT:-5060}/tcp"
      # The audio. Narrow, and the same range the config above hands out —
      # they are two halves of one number and moving one without the other
      # is a call that rings and stays silent.
      - "${EGMA_LIVEKIT_SIP_RTP_PORT_START:-10000}-${EGMA_LIVEKIT_SIP_RTP_PORT_END:-10020}:${EGMA_LIVEKIT_SIP_RTP_PORT_START:-10000}-${EGMA_LIVEKIT_SIP_RTP_PORT_END:-10020}/udp"
    depends_on:
      livekit:
        condition: service_healthy
    # No `healthcheck` here, unlike the two above. The gateway serves no
    # HTTP of its own and the image carries no client to ask it with, so
    # anything written here would be a check that cannot run. What "ready"
    # means for this container is not visible from inside it anyway: the
    # gateway announces itself to the server through Redis, and a call is
    # dispatched to it or is not — which the server knows and it does not.
    # It takes about a second, and the first thing that would notice is a
    # dial, which fails honestly and says so.

volumes:
  postgres-data:
  clickhouse-data:
  minio-data:
  # Still here, and still needed, though no recording lands on it any more:
  # the write-ahead log that protects a report lives in it, and that log is
  # the only record of a report the control plane never took.
  simulator-data:
