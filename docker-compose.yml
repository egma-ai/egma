name: egma

services:
  postgres:
    # This is the Supabase production version. Local development and CI must
    # never run a newer Postgres feature line than the hosted database, or a
    # migration can pass here and fail during production boot.
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-egma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-egma}
      POSTGRES_DB: ${POSTGRES_DB:-egma}
    ports:
      # Bind Postgres to loopback by default because the bundled credentials are
      # public development values. Set a deployment password before widening the bind.
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # PostgreSQL cannot open a data directory written by a newer major.
      # The versioned volume gives 17.6 a clean store and leaves the former
      # `postgres-data` volume intact for an explicit export or deletion.
      - postgres-17-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-egma} -d ${POSTGRES_DB:-egma}"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The trace store. Single node, no Keeper and no replication: this is the
  # honest floor for a self-host, not a cluster. This public image is on the
  # same 26.2.1 feature line as ClickHouse Cloud production. Its exact build is
  # pinned rather than left on a moving tag, because the one thing a
  # self-hoster must never get from `docker compose pull` is a different engine
  # underneath their stored traces.
  clickhouse:
    image: clickhouse/clickhouse-server:26.2.1.1139
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-egma}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-egma}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-egma}
    ports:
      # Loopback by default, for the reason Postgres beside it is: the user and
      # password this store answers to are published in this repository, and
      # what it holds is every conversation this platform has ever recorded a
      # trace of. See the paragraph on the Postgres port.
      - "${CLICKHOUSE_BIND:-127.0.0.1}:${CLICKHOUSE_PORT:-8124}:8123"
    volumes:
      # A ClickHouse downgrade may not mount a newer server's data directory.
      # Keep the former `clickhouse-data` volume intact and give 26.2 its own.
      - clickhouse-26-2-data:/var/lib/clickhouse
    # No `ulimits` here on purpose. ClickHouse wants far more descriptors than
    # a shell's default hands it, but asking for them in this file makes
    # `docker compose up` fail outright — a container may not raise its limit
    # above the daemon's own hard one, and on a host whose hard `nofile` is
    # 1024 or 4096 creation fails with "error setting rlimit type 7: operation
    # not permitted". A compose file that does not start is worse than one
    # whose descriptor limit is low, so the raise lives in
    # `docker-compose.override.yml.example` for the self-hoster who needs it.
    healthcheck:
      # The image's temporary initialization server is loopback-only. Probe the
      # network listener so readiness means the final server has replaced it.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://$$(hostname):8123/ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Store recordings and pending ingestion objects in shared S3-compatible
  # storage. The pinned MinIO image supplies the bundled store; managed
  # deployments configure external endpoints instead.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data"]
    environment:
      # Require a deployment-specific MinIO root credential. The bundled simulator
      # also uses this credential; the playback signer has a separate read-only user.
      MINIO_ROOT_USER: ${EGMA_S3_ACCESS_KEY_ID:?no default — egma self-host up generates the bundled store credential in .egma-platform/platform.env}
      MINIO_ROOT_PASSWORD: ${EGMA_S3_SECRET_ACCESS_KEY:?no default — egma self-host up generates the bundled store credential in .egma-platform/platform.env}
    volumes:
      - minio-data:/data
    ports:
      # Browsers fetch signed recording URLs directly from this store. Keep the
      # port on loopback for local use. Remote browsers need a reachable bind and
      # EGMA_BLOB_PUBLIC_URL matching the host used in the signature. Widening the
      # bind also exposes the store API, so protect its administrative credentials
      # and use HTTPS for remote recording access.
      - "${EGMA_S3_BIND:-127.0.0.1}:${EGMA_S3_PORT:-9000}:9000"
    healthcheck:
      # `mc` ships inside this image, so the probe needs no second one. `local`
      # is the alias the server answers to from inside its own container.
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Create recording and ingestion buckets and their policies before dependent
  # services start. This job can run again against an existing store.
  # The playback user gets only GetObject on recordings; the ingestion user
  # gets object access and prefix-limited listing for pending ingestion data.
  # The bundled simulator writes using the store root credential.
  minio-bucket:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      EGMA_S3_ACCESS_KEY_ID: ${EGMA_S3_ACCESS_KEY_ID:?no default — egma self-host up generates the bundled store credential in .egma-platform/platform.env}
      EGMA_S3_SECRET_ACCESS_KEY: ${EGMA_S3_SECRET_ACCESS_KEY:?no default — egma self-host up generates the bundled store credential in .egma-platform/platform.env}
      EGMA_S3_BUCKET: ${EGMA_S3_BUCKET:-egma-recordings}
      # The read-only half, interpolated into the api service below from the
      # same pair so the two can never disagree. It has no default for the
      # reason the root pair above has none: a credential written in a public
      # repository is a credential every reader of it holds, and this one
      # reads every recording a deployment has.
      EGMA_S3_READ_ACCESS_KEY_ID: ${EGMA_S3_READ_ACCESS_KEY_ID:?no default — egma self-host up generates the bundled read credential in .egma-platform/platform.env}
      EGMA_S3_READ_SECRET_ACCESS_KEY: ${EGMA_S3_READ_SECRET_ACCESS_KEY:?no default — egma self-host up generates the bundled read credential in .egma-platform/platform.env}
      # The second bucket on this same store: the pending ingestion spool.
      # Separate from the recordings bucket and reached by a separate
      # credential, because one workload must not be able to read, delete or
      # expire the other's objects — a recording is evidence and so is a pending
      # segment, and each one's retention has to be a promise the other cannot
      # break.
      EGMA_INGEST_BUCKET: ${EGMA_INGEST_BUCKET:-egma-ingestion}
      # **This pair refuses in the API rather than here**, which is the one
      # place this file departs from the pattern the read-only pair above sets.
      # Compose interpolates the whole file before it looks at which service you
      # named, so a `:?` here would stop `docker compose down` and every
      # developer command that touches this file. The API is where the refusal
      # belongs anyway: it is the process that knows whether this deployment's
      # role accepts evidence, and it names EGMA_INGEST_ACCESS_KEY_ID and stops.
      # Left empty, the store below still gets the bucket and the policy and no
      # user holds it.
      EGMA_S3_INGEST_ACCESS_KEY_ID: ${EGMA_S3_INGEST_ACCESS_KEY_ID:-}
      EGMA_S3_INGEST_SECRET_ACCESS_KEY: ${EGMA_S3_INGEST_SECRET_ACCESS_KEY:-}
    # Use environment expansion and quoted arguments so values are treated as
    # data by the shell. Compose preserves $$ as a literal dollar for the container
    # shell. Write policy JSON through printf arguments. Expanded credentials
    # still reach mc as process arguments; this does not hide them from process inspection.
    entrypoint:
      - sh
      - -c
      - >
        mc alias set egma http://minio:9000
        "$$EGMA_S3_ACCESS_KEY_ID" "$$EGMA_S3_SECRET_ACCESS_KEY" &&
        mc mb --ignore-existing "egma/$$EGMA_S3_BUCKET" &&
        printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::%s/*"]}]}'
        "$$EGMA_S3_BUCKET" > /tmp/read-recordings.json &&
        mc admin policy create egma egma-read-recordings /tmp/read-recordings.json &&
        mc admin user add egma
        "$$EGMA_S3_READ_ACCESS_KEY_ID" "$$EGMA_S3_READ_SECRET_ACCESS_KEY" &&
        mc admin policy attach egma egma-read-recordings
        --user "$$EGMA_S3_READ_ACCESS_KEY_ID" &&
        mc mb --ignore-existing "egma/$$EGMA_INGEST_BUCKET" &&
        printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:PutObject","s3:GetObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::%s/pending/*"]},{"Effect":"Allow","Action":["s3:ListBucket"],"Resource":["arn:aws:s3:::%s"],"Condition":{"StringLike":{"s3:prefix":["pending/*"]}}}]}'
        "$$EGMA_INGEST_BUCKET" "$$EGMA_INGEST_BUCKET" > /tmp/ingestion.json &&
        mc admin policy create egma egma-ingestion /tmp/ingestion.json &&
        if [ -n "$$EGMA_S3_INGEST_ACCESS_KEY_ID" ]; then
        mc admin user add egma
        "$$EGMA_S3_INGEST_ACCESS_KEY_ID" "$$EGMA_S3_INGEST_SECRET_ACCESS_KEY" &&
        mc admin policy attach egma egma-ingestion
        --user "$$EGMA_S3_INGEST_ACCESS_KEY_ID";
        else echo "no EGMA_S3_INGEST_ACCESS_KEY_ID was set, so the ingestion
        bucket and its policy exist and no user holds them. The API refuses to
        start and names EGMA_INGEST_ACCESS_KEY_ID."; fi
    depends_on:
      minio:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-egma}:${POSTGRES_PASSWORD:-egma}@postgres:5432/${POSTGRES_DB:-egma}}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://${CLICKHOUSE_USER:-egma}:${CLICKHOUSE_PASSWORD:-egma}@clickhouse:8123/${CLICKHOUSE_DB:-egma}}
      HOST: 0.0.0.0
      PORT: "3100"
      # Signs session cookies. No public default: `egma self-host up` creates
      # one private value for this workspace.
      EGMA_AUTH_SECRET: ${EGMA_AUTH_SECRET:?no default — egma self-host up generates it in .egma-platform/platform.env}
      # Seals connection credentials before they reach the database. No
      # default, and this is the sharpest of the three:
      # a deployment sealed with a key printed in a public repository is not
      # sealed, and a database copy carries the credentials needed to reach
      # customer agents.
      # `egma self-host up` creates it. Back it up alongside the database;
      # losing it loses every stored connection credential.
      EGMA_ENCRYPTION_KEY: ${EGMA_ENCRYPTION_KEY:?no default — egma self-host up generates it in .egma-platform/platform.env; back it up with Postgres}
      # What the simulator must show to claim work. Claim answers carry
      # customers' live connection credentials and port 3100 is published on
      # this machine, so the check is always on and there is no default: it is
      # interpolated identically into the simulator below. `egma self-host up`
      # creates one value and hands the same value to both containers.
      EGMA_SIMULATOR_SERVICE_TOKEN: ${EGMA_SIMULATOR_SERVICE_TOKEN:?no default — egma self-host up generates it in .egma-platform/platform.env}
      # Where a browser reaches this instance. The pages and the API answer on
      # one origin, and that origin is the self-hoster's own — which is why
      # there is no default for it to quietly be wrong about. Every agent
      # repository binds to what this says, and an instance others reach at
      # 192.168.1.10 while this says localhost refuses their first command
      # rather than answering it about somebody else's machine. `egma
      # self-host up` sets this to the address it prints.
      EGMA_BASE_URL: ${EGMA_BASE_URL:?no default — the whole address a browser reaches egma at, scheme host and port. egma self-host up sets it for you, or set it in .env}
      # Use the recording store address that browsers can reach, not its Compose
      # service name. Signed URLs bind the host, so the playback address must match.
      # An HTTPS Egma page requires HTTPS recording playback to avoid mixed content.
      # HTTP exposes audio and signed links to the network. Without a public URL,
      # recording requests return a configuration refusal.
      EGMA_BLOB_PUBLIC_URL: ${EGMA_BLOB_PUBLIC_URL:-http://localhost:${EGMA_S3_PORT:-9000}}
      EGMA_BLOB_BUCKET: ${EGMA_BLOB_BUCKET:-${EGMA_S3_BUCKET:-egma-recordings}}
      # One region for one store, from one place. The simulator signs its
      # uploads with a region and this container signs its playback links with
      # one, and the day those two disagree is a day every upload works and
      # every playback fails with `SignatureDoesNotMatch` — naming neither the
      # setting nor the region, which is the same nameless failure the public
      # address above is written about. So both default from `EGMA_S3_REGION`
      # and a self-hoster on real S3 sets it once.
      EGMA_BLOB_REGION: ${EGMA_BLOB_REGION:-${EGMA_S3_REGION:-}}
      # The read-only half of the store's credentials, interpolated from the
      # same pair the bucket job creates the user with so the two always match.
      # It can fetch one object at a time and nothing else — it cannot write,
      # cannot delete and cannot list, so a leak of it reads a recording rather
      # than replacing one. A deployment pointed at somebody else's S3 sets
      # these two directly and gives that credential the same shape.
      EGMA_BLOB_ACCESS_KEY_ID: ${EGMA_BLOB_ACCESS_KEY_ID:-${EGMA_S3_READ_ACCESS_KEY_ID:?no default — egma self-host up generates the bundled read credential in .egma-platform/platform.env}}
      EGMA_BLOB_SECRET_ACCESS_KEY: ${EGMA_BLOB_SECRET_ACCESS_KEY:-${EGMA_S3_READ_SECRET_ACCESS_KEY:?no default — egma self-host up generates the bundled read credential in .egma-platform/platform.env}}
      EGMA_SINGLE_ORGANIZATION: ${EGMA_SINGLE_ORGANIZATION:-true}
      EGMA_TRUST_PROXY: ${EGMA_TRUST_PROXY:-false}
      # The budget belongs to the organization rather than to a key, so
      # rotating a key does not reset it.
      EGMA_RATE_LIMIT_PER_MINUTE: ${EGMA_RATE_LIMIT_PER_MINUTE:-600}
      # Optional deployment caps. Empty keeps the self-hosted pull loop
      # unchanged; operators can bound each modality or one speech provider.
      EGMA_VOICE_SIMULATION_CONCURRENCY_CAP: ${EGMA_VOICE_SIMULATION_CONCURRENCY_CAP:-}
      EGMA_CHAT_SIMULATION_CONCURRENCY_CAP: ${EGMA_CHAT_SIMULATION_CONCURRENCY_CAP:-}
      EGMA_SPEECH_PROVIDER_CONCURRENCY_CAPS: ${EGMA_SPEECH_PROVIDER_CONCURRENCY_CAPS:-}
      # Mail is optional and unset by default. With none, invitations hand
      # their link back to whoever sent them and signup asks for no
      # verification; setting this turns both around at once. It is never a
      # prerequisite for anything, including adding a second person.
      EGMA_SMTP_URL: ${EGMA_SMTP_URL:-}
      EGMA_MAIL_FROM: ${EGMA_MAIL_FROM:-}
      # Model choices are immutable persona and grader content. These are only
      # the current provider credentials. A self-host supplies the three keys
      # directly. Egma Cloud supplies a Secrets Manager id and region instead;
      # the API reads that object once while preparing each claimed simulation.
      EGMA_OPENAI_API_KEY: ${EGMA_OPENAI_API_KEY:-}
      EGMA_DEEPGRAM_API_KEY: ${EGMA_DEEPGRAM_API_KEY:-}
      EGMA_CARTESIA_API_KEY: ${EGMA_CARTESIA_API_KEY:-}
      EGMA_PROVIDER_CREDENTIALS_SECRET_ID: ${EGMA_PROVIDER_CREDENTIALS_SECRET_ID:-}
      EGMA_PROVIDER_CREDENTIALS_REGION: ${EGMA_PROVIDER_CREDENTIALS_REGION:-}
      # The optional shared carrier route. These are ordinary deployment
      # credentials, read from the operator's environment. Set all four or
      # none; the API adds a complete route only to phone work orders.
      EGMA_PHONE_TRUNK_ADDRESS: ${EGMA_PHONE_TRUNK_ADDRESS:-}
      EGMA_PHONE_SOURCE_NUMBER: ${EGMA_PHONE_SOURCE_NUMBER:-}
      EGMA_PHONE_TRUNK_USERNAME: ${EGMA_PHONE_TRUNK_USERNAME:-}
      EGMA_PHONE_TRUNK_PASSWORD: ${EGMA_PHONE_TRUNK_PASSWORD:-}
      # What selects a billing adapter. Empty on every deployment that does not
      # charge anybody, which is every deployment today: the product then runs
      # on the open plug-in — every allowance unlimited, every usage record
      # discarded — and measures what it spends all the same. Nothing here
      # derives from whether this deployment is the hosted one; a self-hoster
      # who sets the same secret gets the same billing.
      EGMA_STRIPE_SECRET_KEY: ${EGMA_STRIPE_SECRET_KEY:-}
      # What proves a webhook came from Stripe. A delivery carries no cookie
      # and no key: anybody can post to the endpoint, and only Stripe can sign
      # a body against this secret. Empty means the endpoint is not mounted at
      # all — one that could not check a signature would be one anybody could
      # post a payment to. The buttons still work without it.
      EGMA_STRIPE_WEBHOOK_SECRET: ${EGMA_STRIPE_WEBHOOK_SECRET:-}
      # Stripe's client-side key, which is public by design. Nothing reads it
      # yet: every payment happens on a Stripe-hosted page that needs no key of
      # Egma's in the browser. It is here so a deployment answers all three
      # Stripe settings in one place.
      # Egma platform telemetry, behind one flag that defaults to off — see
      # .env.example. Deliberately not the trace store: what customers send
      # through the OTLP door is their data in ClickHouse. This process sends
      # its own spans to the deployment telemetry collector configured below.
      # The two never share a pipe.
      EGMA_TELEMETRY: ${EGMA_TELEMETRY:-}
      EGMA_TELEMETRY_OTLP_ENDPOINT: ${EGMA_TELEMETRY_OTLP_ENDPOINT:-}
      EGMA_POSTHOG_KEY: ${EGMA_POSTHOG_KEY:-}
      EGMA_POSTHOG_HOST: ${EGMA_POSTHOG_HOST:-}
      # Which halves of ingestion this process serves. `all` accepts evidence
      # and drains the pending spool in one process, which is what this
      # deployment runs and what the hosted platform runs. `ingest` and `drain`
      # exist so that splitting them apart later is this setting rather than a
      # second image and a second protocol.
      EGMA_ROLE: ${EGMA_ROLE:-all}
      # **The address this container reaches the ingestion store at**, which is
      # the opposite of EGMA_BLOB_PUBLIC_URL above and the first internal store
      # address this service has ever held. Recordings are signed arithmetic
      # fetched by a browser; a segment is uploaded by this process, so this one
      # is the compose network's own name for the store and never a browser's.
      EGMA_INGEST_ENDPOINT: ${EGMA_INGEST_ENDPOINT:-http://minio:9000}
      EGMA_INGEST_BUCKET: ${EGMA_INGEST_BUCKET:-egma-ingestion}
      EGMA_INGEST_REGION: ${EGMA_INGEST_REGION:-${EGMA_S3_REGION:-}}
      # The ingestion credential, interpolated from the same pair the bucket
      # entrypoint creates the user with so the two can never disagree. It is
      # confined to this bucket's `pending/` prefix — it can write, read, list
      # and delete a pending segment and can do nothing whatever to a recording.
      # Neither recordings pair may appear on this service; `deployment.test.ts`
      # holds that.
      EGMA_INGEST_ACCESS_KEY_ID: ${EGMA_INGEST_ACCESS_KEY_ID:-${EGMA_S3_INGEST_ACCESS_KEY_ID:-}}
      EGMA_INGEST_SECRET_ACCESS_KEY: ${EGMA_INGEST_SECRET_ACCESS_KEY:-${EGMA_S3_INGEST_SECRET_ACCESS_KEY:-}}
      # Where accepted evidence waits between being staged and being durable.
      # It is on the named volume below rather than in the container's own
      # layer, because what is in it is evidence Egma has taken responsibility
      # for and has not made durable yet.
      EGMA_INGESTION_LOG_DIR: ${EGMA_INGESTION_LOG_DIR:-/var/lib/egma/ingestion}
      # What the staging log will hold before acceptance starts refusing. Both
      # bind: a bound in bytes alone would be reached by one deployment after
      # ten records and by another after ten million. Over either, the door
      # answers retryably and nothing already staged is discarded.
      EGMA_INGESTION_LOG_MAX_BYTES: ${EGMA_INGESTION_LOG_MAX_BYTES:-536870912}
      EGMA_INGESTION_LOG_MAX_RECORDS: ${EGMA_INGESTION_LOG_MAX_RECORDS:-200000}
      # How long the oldest staged record waits for company. A low-volume
      # deployment lives on this: one conversation's spans must not wait for a
      # batch that will never fill.
      EGMA_INGESTION_FLUSH_MILLISECONDS: ${EGMA_INGESTION_FLUSH_MILLISECONDS:-500}
      # And how large one segment gets before it seals. The byte bound is
      # uncompressed and sits under the trace store's own insert bound, so one
      # segment is at most one or two inserts.
      EGMA_INGESTION_SEGMENT_MAX_BYTES: ${EGMA_INGESTION_SEGMENT_MAX_BYTES:-8388608}
      EGMA_INGESTION_SEGMENT_MAX_RECORDS: ${EGMA_INGESTION_SEGMENT_MAX_RECORDS:-5000}
      # How long a request waits for the object store before it is answered
      # retryably with its staged evidence retained.
      EGMA_INGESTION_REQUEST_TIMEOUT_MILLISECONDS: ${EGMA_INGESTION_REQUEST_TIMEOUT_MILLISECONDS:-10000}
      # How often the whole pending prefix is listed. The scan is the recovery
      # authority; the in-process handoff after an upload is only a speed hint.
      EGMA_INGESTION_SCAN_INTERVAL_MILLISECONDS: ${EGMA_INGESTION_SCAN_INTERVAL_MILLISECONDS:-30000}
    volumes:
      # The first writable volume this service has ever had, and it holds
      # accepted evidence that is not durable yet. `docker image prune` does not
      # touch a named volume; `docker compose down -v` deletes it, and doing
      # that with a backlog in it throws away evidence Egma answered success to.
      - api-ingestion:/var/lib/egma/ingestion
    ports:
      # Published on the host, so that a self-hoster who already runs
      # something on these can move Egma rather than move the other thing —
      # and so that two Egma platforms can stand side by side on one machine,
      # each with its own instance identity, which is how the boundary between
      # a platform and an agent repository is proved at all. The port inside
      # the container never moves: it is the compose network's, and the two
      # halves of a published port are not the same decision.
      - "${EGMA_API_PORT:-3100}:3100"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # The web application proxies the API's paths so that both answer on one
        # origin. Next resolves this into the build, so it is an argument rather
        # than an environment variable.
        EGMA_API_ORIGIN: ${EGMA_API_ORIGIN:-http://api:3100}
        # Browser telemetry is also fixed at build time. It reads the same one
        # flag as the server processes. The PostHog project token is mapped to
        # its public browser name; it can submit events and cannot read them.
        EGMA_TELEMETRY: ${EGMA_TELEMETRY:-}
        NEXT_PUBLIC_POSTHOG_KEY: ${EGMA_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${EGMA_POSTHOG_HOST:-}
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3101"
    ports:
      - "${EGMA_WEB_PORT:-3101}:3101"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3101/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s

  # The simulator: the service that conducts simulations. It claims its
  # work rather than being sent it, so there is no `ports:` here and there
  # never will be — every arrow points out, and adding this container to a
  # self-host costs no inbound networking at all. Everything it needs is
  # below; there are no files to place and no flags to pass.
  simulator:
    build:
      context: .
      dockerfile: apps/simulator/Dockerfile
    # A stopping simulator finishes the simulations it holds before it
    # exits: the first stop signal ends claiming, not conversations. Ten
    # minutes is a ceiling, not a wait — an idle simulator stops at once,
    # and no call outlives ten minutes. Past the ceiling Docker kills the
    # container and the control plane's sweep records what remained. The
    # default grace is ten seconds, which would kill mid-sentence.
    stop_grace_period: 10m
    environment:
      # Where it claims, heartbeats and reports. The API and the simulator
      # meet inside this network, so this is the service name rather than
      # the origin a browser uses. The endpoints it dials arrive with the
      # trigger; until then it asks, is told there is nothing, and asks
      # again, which is what a queue with nothing in it looks like.
      EGMA_SIMULATOR_CONTROL_PLANE_URL: ${EGMA_SIMULATOR_CONTROL_PLANE_URL:-http://api:3100}
      # What it shows the control plane to be allowed to claim, as a bearer
      # — the same header an Egma key uses everywhere else. The API checks it
      # on every claim, so this reads the same variable as the api service
      # above and the two halves always match. It has no public default;
      # `egma self-host up` supplies the private workspace value.
      EGMA_SIMULATOR_SERVICE_TOKEN: ${EGMA_SIMULATOR_SERVICE_TOKEN:?no default — egma self-host up generates it in .egma-platform/platform.env}
      # Limit concurrent simulations per worker; blank uses the simulator default.
      # More replicas increase total capacity. Phone simulations also consume
      # carrier channels, whose capacity must cover the combined workload.
      EGMA_SIMULATOR_CAPACITY: ${EGMA_SIMULATOR_CAPACITY:-}
      EGMA_SIMULATOR_MODE: ${EGMA_SIMULATOR_MODE:-}
      EGMA_SIMULATOR_MODALITIES: ${EGMA_SIMULATOR_MODALITIES:-}
      EGMA_SIMULATOR_EXECUTION_DEADLINE_SECONDS: ${EGMA_SIMULATOR_EXECUTION_DEADLINE_SECONDS:-}
      EGMA_SIMULATOR_THREAD_POOL_WORKERS: ${EGMA_SIMULATOR_THREAD_POOL_WORKERS:-}
      # No model, voice or provider key is container configuration. The pinned
      # persona version supplies one complete selection, and the claim adds only
      # the current keys for its selected providers. Missing data is refused;
      # there is no environment fallback. Internal simulator adapters remain
      # fixed deployment choices, not persona or platform authoring.
      # The scripted detector understands only the deterministic test codec;
      # every shipped live container must use the real speech detector.
      EGMA_SIMULATOR_VAD_PROVIDER: silero
      # The shipped phone bridge. A work order may supply a carrier route, but
      # it cannot choose or create the deployment's media backend.
      EGMA_SIMULATOR_MEDIA_BACKEND: livekit
      # Connect to the LiveKit bridge with deployment credentials. The bundled
      # server, gateway, and simulator share the generated pair. The connection
      # type selects the adapter and the platform supplies the carrier route;
      # these media settings alone do not enable dialing.
      EGMA_SIMULATOR_LIVEKIT_URL: ${EGMA_SIMULATOR_LIVEKIT_URL:-ws://livekit:7880}
      EGMA_SIMULATOR_LIVEKIT_API_KEY: ${EGMA_SIMULATOR_LIVEKIT_API_KEY:-${EGMA_LIVEKIT_API_KEY:?no default anywhere — egma self-host up generates this pair and writes it to .egma-platform/platform.env}}
      EGMA_SIMULATOR_LIVEKIT_API_SECRET: ${EGMA_SIMULATOR_LIVEKIT_API_SECRET:-${EGMA_LIVEKIT_API_SECRET:?no default anywhere — egma self-host up generates this pair and writes it to .egma-platform/platform.env}}
      # Upload recordings to shared object storage using its internal endpoint.
      # The simulator can use local temporary files during recording and upload.
      # Without an endpoint it retains recordings locally instead.
      EGMA_SIMULATOR_S3_ENDPOINT: ${EGMA_SIMULATOR_S3_ENDPOINT:-http://minio:9000}
      EGMA_SIMULATOR_S3_BUCKET: ${EGMA_SIMULATOR_S3_BUCKET:-${EGMA_S3_BUCKET:-egma-recordings}}
      # The same region the API signs playback links with, from the same
      # place — see EGMA_BLOB_REGION on the api service. Two halves of one
      # store signing for two different regions is every upload working and
      # every playback failing.
      EGMA_SIMULATOR_S3_REGION: ${EGMA_SIMULATOR_S3_REGION:-${EGMA_S3_REGION:-}}
      # The write credential, interpolated from the same pair the store
      # above is stood up with so the two halves always match. A
      # deployment pointed at somebody else's S3 sets these two directly
      # and leaves the store above unused.
      EGMA_SIMULATOR_S3_ACCESS_KEY_ID: ${EGMA_SIMULATOR_S3_ACCESS_KEY_ID:-${EGMA_S3_ACCESS_KEY_ID:?no default — egma self-host up generates the bundled store credential in .egma-platform/platform.env}}
      EGMA_SIMULATOR_S3_SECRET_ACCESS_KEY: ${EGMA_SIMULATOR_S3_SECRET_ACCESS_KEY:-${EGMA_S3_SECRET_ACCESS_KEY:?no default — egma self-host up generates the bundled store credential in .egma-platform/platform.env}}
      # The volume below, and the one thing kept on it. The write-ahead
      # log is the only record of a report that never got through, so
      # losing it to a container being replaced would lose a simulation's
      # evidence — it lives on the volume rather than in the container.
      # Recordings used to sit beside it and now do not; the volume stays
      # for this.
      EGMA_SIMULATOR_WAL_DIR: /var/lib/egma-simulator/wal
      # How the pull behaves. The defaults suit a control plane on the same
      # network; a slow link is what these are for.
      EGMA_SIMULATOR_CLAIMANT: ${EGMA_SIMULATOR_CLAIMANT:-}
      EGMA_SIMULATOR_HEARTBEAT_SECONDS: ${EGMA_SIMULATOR_HEARTBEAT_SECONDS:-}
      EGMA_SIMULATOR_CLAIM_WAIT_SECONDS: ${EGMA_SIMULATOR_CLAIM_WAIT_SECONDS:-}
      EGMA_SIMULATOR_REPORT_DEADLINE_SECONDS: ${EGMA_SIMULATOR_REPORT_DEADLINE_SECONDS:-}
      EGMA_SIMULATOR_LOG_LEVEL: ${EGMA_SIMULATOR_LOG_LEVEL:-INFO}
    volumes:
      - simulator-data:/var/lib/egma-simulator
    depends_on:
      api:
        condition: service_healthy
      # The bucket rather than the store, and completed rather than
      # healthy: a store that is up but has no bucket in it refuses every
      # recording, and the one-shot job above is what puts one there.
      minio-bucket:
        condition: service_completed_successfully
      livekit:
        condition: service_healthy
      # Named even though the simulator never speaks to the gateway
      # directly — it asks the *server* to place a call, and the server
      # hands that to whichever gateway has announced itself. Without this
      # line the gateway is a container nothing depends on, so
      # `docker compose up simulator` would bring up a phone stack that
      # cannot place a phone call, and the first thing to notice would be
      # a dial.
      livekit-sip:
        condition: service_started
    # The simulator publishes no listener, so it has no port healthcheck. Startup
    # validates configuration; logs report API failures, and claim heartbeats
    # let the control plane detect abandoned work.

  # Grader workers claim queued traces and read the stores directly. They
  # require no published port. Scale replicas to distribute queued grading work.
  grader:
    build:
      context: .
      dockerfile: apps/grader/Dockerfile
    environment:
      # The two stores, on the same terms the API reads them: conversations and
      # grader plans come out of Postgres, grades go into ClickHouse. Both are
      # required, because a grader that started with nowhere to read from and
      # nowhere to write to would look healthy and judge nothing.
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-egma}:${POSTGRES_PASSWORD:-egma}@postgres:5432/${POSTGRES_DB:-egma}}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://${CLICKHOUSE_USER:-egma}:${CLICKHOUSE_PASSWORD:-egma}@clickhouse:8123/${CLICKHOUSE_DB:-egma}}
      # This copy's own name for itself, in claims and in its log. Unset is
      # fine and usual — it names itself after its host and process, which is
      # what tells two copies apart.
      # Paid attempts first enter this worker's own recoverable log and shared bucket.
      EGMA_INGEST_ENDPOINT: ${EGMA_INGEST_ENDPOINT:-http://minio:9000}
      EGMA_INGEST_BUCKET: ${EGMA_INGEST_BUCKET:-egma-ingestion}
      EGMA_INGEST_REGION: ${EGMA_INGEST_REGION:-${EGMA_S3_REGION:-}}
      EGMA_INGEST_ACCESS_KEY_ID: ${EGMA_INGEST_ACCESS_KEY_ID:-${EGMA_S3_INGEST_ACCESS_KEY_ID:-}}
      EGMA_INGEST_SECRET_ACCESS_KEY: ${EGMA_INGEST_SECRET_ACCESS_KEY:-${EGMA_S3_INGEST_SECRET_ACCESS_KEY:-}}
      EGMA_ENCRYPTION_KEY: ${EGMA_ENCRYPTION_KEY:?no default — egma self-host up generates it in .egma-platform/platform.env; back it up with Postgres}
      EGMA_GRADER_INGESTION_LOG_DIR: /var/lib/egma/grader-ingestion
      EGMA_GRADER_CLAIMANT: ${EGMA_GRADER_CLAIMANT:-}
      # How many conversations one copy judges at once. It claims only what it
      # has room for, so a burst of finished simulations degrades to a queue
      # rather than to overload — raise this, or start a second copy.
      EGMA_GRADER_CAPACITY: ${EGMA_GRADER_CAPACITY:-4}
      EGMA_GRADING_CONCURRENCY_CAP: ${EGMA_GRADING_CONCURRENCY_CAP:-}
      # How the claim behaves. A copy says it is still alive every heartbeat
      # while it holds a conversation, and a copy silent for longer than the
      # lease loses it to whichever copy asks next — which is how a container
      # replaced during grading costs one lease before another copy retries it. The heartbeat
      # must stay well under the lease.
      EGMA_GRADER_HEARTBEAT_SECONDS: ${EGMA_GRADER_HEARTBEAT_SECONDS:-}
      EGMA_GRADER_LEASE_SECONDS: ${EGMA_GRADER_LEASE_SECONDS:-}
      # The backstop, and **not** how work arrives. A conversation ending wakes
      # this service after completion and durable evidence agree, so no grade
      # waits for is on a timer. This is for the notification raised while
      # every copy happened to be restarting: it costs one indexed query and
      # catches the case that would otherwise look like grading having stopped.
      EGMA_GRADER_SWEEP_SECONDS: ${EGMA_GRADER_SWEEP_SECONDS:-}
      EGMA_GRADER_LOG_LEVEL: ${EGMA_GRADER_LOG_LEVEL:-INFO}
      # The grader resolves the current provider bundle once only when a
      # claimed job includes a model-judged grader. Code-only grading does not
      # depend on the secret store. No model key comes from Postgres.
      EGMA_OPENAI_API_KEY: ${EGMA_OPENAI_API_KEY:-}
      EGMA_DEEPGRAM_API_KEY: ${EGMA_DEEPGRAM_API_KEY:-}
      EGMA_CARTESIA_API_KEY: ${EGMA_CARTESIA_API_KEY:-}
      EGMA_PROVIDER_CREDENTIALS_SECRET_ID: ${EGMA_PROVIDER_CREDENTIALS_SECRET_ID:-}
      EGMA_PROVIDER_CREDENTIALS_REGION: ${EGMA_PROVIDER_CREDENTIALS_REGION:-}
      # The same setting the api reads, for the same reason and from the same
      # .env value. A grading job's only spend is the judge's model usage, so
      # the claim asks the deployment whether Egma's key may fund it before it
      # hands one out. Empty is every deployment that does not charge anybody:
      # nothing is imported and every claim is funded.
      EGMA_STRIPE_SECRET_KEY: ${EGMA_STRIPE_SECRET_KEY:-}
      # Egma platform telemetry, behind one flag that defaults to off. One
      # value in .env reaches this container and the api's alike — see the api
      # service.
      EGMA_TELEMETRY: ${EGMA_TELEMETRY:-}
      EGMA_TELEMETRY_OTLP_ENDPOINT: ${EGMA_TELEMETRY_OTLP_ENDPOINT:-}
      EGMA_POSTHOG_KEY: ${EGMA_POSTHOG_KEY:-}
      EGMA_POSTHOG_HOST: ${EGMA_POSTHOG_HOST:-}
    volumes:
      - grader-ingestion:/var/lib/egma/grader-ingestion
    depends_on:
      api:
        condition: service_healthy
    # Wait for the API to apply the schema before grading starts. The grader
    # has no listener healthcheck; configuration failures stop startup, store
    # failures are logged, and expired claims allow abandoned work to be recovered.

  # The phone stack contains LiveKit, its SIP gateway, and Redis. Dialing also
  # requires a complete carrier route. The SIP gateway needs reachable signaling
  # and RTP ports; NAT and firewalls must permit the advertised media address.
  # For a managed bridge, configure its URL and matching credentials. Keep
  # the RTP range and firewall rules large enough for the intended concurrency.

  # The bus the server and the gateway find each other through. Not a store:
  # nothing here is worth keeping across a restart, so there is no volume,
  # and nothing outside this network ever speaks to it, so there is no port.
  livekit-redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # LiveKit rooms connect simulator and phone participants through the gateway.
  # Host ports bind to loopback by default; containers use the Compose network.
  # Require the generated deployment key and secret shared by server, gateway,
  # and simulator.
  livekit:
    image: livekit/livekit-server:v1.13.5
    environment:
      LIVEKIT_KEYS: "${EGMA_LIVEKIT_API_KEY:?no default anywhere — egma self-host up generates this pair and writes it to .egma-platform/platform.env}: ${EGMA_LIVEKIT_API_SECRET:?no default anywhere — egma self-host up generates this pair and writes it to .egma-platform/platform.env}"
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          # One UDP port for every room, rather than a range: this server's
          # clients are counted in single figures, so there is nothing to
          # spread across ports.
          udp_port: 7882
          tcp_port: 7881
          # False, and this is the one that matters: with it on, the server
          # STUNs for a public address and hands that to clients as the
          # place to send media. Its clients are on this compose network —
          # the address to give them is this container's own.
          use_external_ip: false
          # What the server tells clients to send media to, when its own
          # address is not the one that works. Empty is right for every
          # deployment where the clients are containers beside it. Set it
          # when a client lives outside this network and cannot route into
          # it — a laptop running Docker Desktop is the case that needs it,
          # and the value is that machine's own LAN address, with
          # EGMA_LIVEKIT_BIND=0.0.0.0 so the published ports answer there.
          node_ip: "${EGMA_LIVEKIT_ADVERTISE_IP:-}"
        redis:
          address: livekit-redis:6379
        logging:
          level: ${EGMA_LIVEKIT_LOG_LEVEL:-info}
    ports:
      - "${EGMA_LIVEKIT_BIND:-127.0.0.1}:7880:7880"
      - "${EGMA_LIVEKIT_BIND:-127.0.0.1}:7881:7881"
      - "${EGMA_LIVEKIT_BIND:-127.0.0.1}:7882:7882/udp"
    depends_on:
      livekit-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7880/"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The gateway: the only container in Egma that a carrier talks to.
  #
  # It places the call your trunk carries, and turns the phone leg into a
  # participant in the room above. Its trunk configuration does not live
  # here — the API adds a trunk only to a phone work order, and the simulator
  # hands it to LiveKit per call. Carrier credentials are never written into a
  # bridge's config file.
  livekit-sip:
    image: livekit/sip:v1.9.0
    # The image's own command names a config file that only exists if you
    # mount one. This overlay has no files to place, so the entrypoint is
    # the binary and the configuration is the environment.
    entrypoint: ["livekit-sip"]
    environment:
      SIP_CONFIG_BODY: |
        # The generated pair, the same one the media server and the
        # simulator hold. No default, for the reason stated above it.
        api_key: ${EGMA_LIVEKIT_API_KEY:?no default anywhere — egma self-host up generates this pair and writes it to .egma-platform/platform.env}
        api_secret: ${EGMA_LIVEKIT_API_SECRET:?no default anywhere — egma self-host up generates this pair and writes it to .egma-platform/platform.env}
        ws_url: ws://livekit:7880
        redis:
          address: livekit-redis:6379
        # The port the gateway listens on **and announces**. It moves with
        # the published port below rather than being fixed at 5060, because
        # the two are one number: a gateway that listens on 5060 while the
        # host publishes 5070 tells the carrier to send its in-dialog
        # requests — a BYE, a re-INVITE — to a port nothing answers on, and
        # what that looks like is a call that connects and then will not hang
        # up cleanly.
        sip_port: ${EGMA_LIVEKIT_SIP_PORT:-5060}
        rtp_port: ${EGMA_LIVEKIT_SIP_RTP_PORT_START:-10000}-${EGMA_LIVEKIT_SIP_RTP_PORT_END:-10020}
        # What address to write into the SDP the carrier reads. Set
        # EGMA_LIVEKIT_SIP_EXTERNAL_IP when you know it — an elastic IP, a
        # 1:1 NAT — and the gateway advertises exactly that. Leave it unset
        # and the gateway asks a STUN server what the world sees, which is
        # right on a host whose public address it cannot read off an
        # interface, and is the case the README's spike is about.
        use_external_ip: ${EGMA_LIVEKIT_SIP_USE_EXTERNAL_IP:-true}
        nat_1_to_1_ip: "${EGMA_LIVEKIT_SIP_EXTERNAL_IP:-}"
        # Nothing dials in, so the gateway is told not to advertise a port
        # for anyone to dial in on.
        hide_inbound_port: true
        logging:
          level: ${EGMA_LIVEKIT_LOG_LEVEL:-info}
    ports:
      # SIP signalling. An outbound call's answers come back on the flow the
      # gateway opened, so this is published for what comes *after* the
      # answer — a carrier's BYE and its in-dialog requests go to the
      # address the gateway advertised, not to that flow.
      - "${EGMA_LIVEKIT_SIP_PORT:-5060}:${EGMA_LIVEKIT_SIP_PORT:-5060}/udp"
      - "${EGMA_LIVEKIT_SIP_PORT:-5060}:${EGMA_LIVEKIT_SIP_PORT:-5060}/tcp"
      # The audio. Narrow, and the same range the config above hands out —
      # they are two halves of one number and moving one without the other
      # is a call that rings and stays silent.
      - "${EGMA_LIVEKIT_SIP_RTP_PORT_START:-10000}-${EGMA_LIVEKIT_SIP_RTP_PORT_END:-10020}:${EGMA_LIVEKIT_SIP_RTP_PORT_START:-10000}-${EGMA_LIVEKIT_SIP_RTP_PORT_END:-10020}/udp"
    depends_on:
      livekit:
        condition: service_healthy
    # No `healthcheck` here, unlike the two above. The gateway serves no
    # HTTP of its own and the image carries no client to ask it with, so
    # anything written here would be a check that cannot run. What "ready"
    # means for this container is not visible from inside it anyway: the
    # gateway announces itself to the server through Redis, and a call is
    # dispatched to it or is not — which the server knows and it does not.
    # It takes about a second, and the first thing that would notice is a
    # dial, which fails honestly and says so.

volumes:
  postgres-17-data:
  clickhouse-26-2-data:
  minio-data:
  # Still here, and still needed, though no recording lands on it any more:
  # the write-ahead log that protects a report lives in it, and that log is
  # the only record of a report the control plane never took.
  simulator-data:
  # The same idea one service over: accepted production evidence waits here
  # between being staged and being durable in the ingestion bucket. It survives
  # a container replacement, which is what makes a restart a recovery rather
  # than a loss; `docker compose down -v` deletes it, and doing that with a
  # backlog in it throws away evidence Egma answered success to.
  api-ingestion:
  # Each grader keeps its own recoverable paid-attempt log.
  grader-ingestion:
