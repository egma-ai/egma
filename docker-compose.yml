name: egma

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-egma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-egma}
      POSTGRES_DB: ${POSTGRES_DB:-egma}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-egma} -d ${POSTGRES_DB:-egma}"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The trace store. Single node, no Keeper and no replication: this is the
  # honest floor for a self-host, not a cluster. The version is pinned to the
  # newest long-term-support release rather than to a moving tag, because the
  # one thing a self-hoster must never get from `docker compose pull` is a
  # different engine underneath their stored traces.
  clickhouse:
    image: clickhouse/clickhouse-server:26.3.17.56
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-egma}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-egma}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-egma}
    ports:
      - "${CLICKHOUSE_PORT:-8124}:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    # No `ulimits` here on purpose. ClickHouse wants far more descriptors than
    # a shell's default hands it, but asking for them in this file makes
    # `docker compose up` fail outright — a container may not raise its limit
    # above the daemon's own hard one, and on a host whose hard `nofile` is
    # 1024 or 4096 creation fails with "error setting rlimit type 7: operation
    # not permitted". A compose file that does not start is worse than one
    # whose descriptor limit is low, so the raise lives in
    # `docker-compose.override.yml.example` for the self-hoster who needs it.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The object store, and the third thing this deployment keeps. Postgres holds
  # what happened, ClickHouse holds the traces of it, and this holds the bytes
  # neither of them should ever carry: a voice simulation's recording, which is
  # megabytes of audio that a row can only point at.
  #
  # It is required rather than optional, and that reverses an earlier position.
  # A recording written inside the simulator that made it is a recording only
  # that container can read — so the moment a self-hoster does what this file
  # invites them to do and starts a second simulator, half their audio becomes
  # unreadable with nothing said about it. The cost is one container, accepted
  # knowingly.
  #
  # MinIO speaks the S3 API, so nothing above it knows whether it is talking to
  # this container or to a bucket at any provider: point
  # EGMA_SIMULATOR_S3_ENDPOINT somewhere else and this container is simply not
  # used. The release is pinned rather than left on a moving tag, for the reason
  # ClickHouse's is: what a self-hoster must never get from `docker compose
  # pull` is a different engine underneath their stored objects.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data"]
    environment:
      # The store's own root credential, and the one the simulator writes
      # with. Interpolated into both from one pair here so the two halves can
      # never disagree — the same idiom the LiveKit key below uses. It is a
      # development default like every other in this file: change it, once, in
      # .env, before anybody else can reach the machine. MinIO refuses a root
      # password under eight characters, so a short one fails loudly at `up`
      # rather than quietly at the first recording.
      MINIO_ROOT_USER: ${EGMA_S3_ACCESS_KEY_ID:-egma}
      MINIO_ROOT_PASSWORD: ${EGMA_S3_SECRET_ACCESS_KEY:-egma-development-only-object-storage-secret-change-it}
    volumes:
      - minio-data:/data
    # No `ports:` here. Nothing outside this network reads a recording yet —
    # the simulator writes over the compose network, by service name, exactly
    # as it claims from the API. Publishing this is the day a browser is handed
    # a link to an object, and that day brings its own setting with it: a
    # signed link is bound to the address it was signed for, and the address a
    # browser uses is not the one the platform uses.
    healthcheck:
      # `mc` ships inside this image, so the probe needs no second one. `local`
      # is the alias the server answers to from inside its own container.
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The bucket, made once and then never again.
  #
  # A fresh volume arrives empty, and an empty object store has no bucket in
  # it — so without this the first recording of every new deployment fails
  # against a bucket nobody was told to create, and the error names the bucket
  # rather than the missing step. It runs to completion and exits; the
  # simulator waits for that exit rather than for the store, which is what
  # makes "the deployment creates its bucket on first start" true rather than
  # nearly true.
  #
  # `mc mb --ignore-existing` is what makes it safe to run on every `up`: the
  # second time, and every time after, it finds the bucket and says nothing.
  minio-bucket:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      EGMA_S3_ACCESS_KEY_ID: ${EGMA_S3_ACCESS_KEY_ID:-egma}
      EGMA_S3_SECRET_ACCESS_KEY: ${EGMA_S3_SECRET_ACCESS_KEY:-egma-development-only-object-storage-secret-change-it}
    # The credentials reach `mc` through the environment rather than through
    # this command line, so that a `docker inspect` or a process listing on the
    # host does not carry the store's password. `$$` is an escaped `$`: compose
    # leaves it alone and the shell inside the container reads it.
    entrypoint:
      - sh
      - -c
      - >
        mc alias set egma http://minio:9000
        "$$EGMA_S3_ACCESS_KEY_ID" "$$EGMA_S3_SECRET_ACCESS_KEY" &&
        mc mb --ignore-existing "egma/${EGMA_S3_BUCKET:-egma-recordings}"
    depends_on:
      minio:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-egma}:${POSTGRES_PASSWORD:-egma}@postgres:5432/${POSTGRES_DB:-egma}
      CLICKHOUSE_URL: http://${CLICKHOUSE_USER:-egma}:${CLICKHOUSE_PASSWORD:-egma}@clickhouse:8123/${CLICKHOUSE_DB:-egma}
      HOST: 0.0.0.0
      PORT: "3100"
      # Signs session cookies. The default is a development one and every
      # instance that anybody else can reach needs its own; see .env.example.
      EGMA_AUTH_SECRET: ${EGMA_AUTH_SECRET:-development-only-change-this-before-anybody-else-can-reach-it}
      # Seals connection credentials before they reach the database. The
      # default is a development one and every instance that anybody else can
      # reach needs its own — `openssl rand -hex 32` makes one. Back it up
      # alongside the database; losing it loses every stored credential.
      EGMA_ENCRYPTION_KEY: ${EGMA_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      # What the simulator must show to claim work. Claim answers carry
      # customers' live connection credentials and port 3100 is published on
      # this machine, so the check is always on: the default is a development
      # one, interpolated identically into the simulator below so the two
      # halves always match, and every instance that anybody else can reach
      # needs its own — egma_st_ then `openssl rand -hex 32`.
      EGMA_SIMULATOR_SERVICE_TOKEN: ${EGMA_SIMULATOR_SERVICE_TOKEN:-egma_st_development-only-change-this-before-anybody-else-can-reach-it}
      # Where a browser reaches this instance. The pages and the API answer on
      # one origin, and that origin is the self-hoster's own.
      EGMA_BASE_URL: ${EGMA_BASE_URL:-http://localhost:3101}
      EGMA_SINGLE_ORGANIZATION: ${EGMA_SINGLE_ORGANIZATION:-true}
      EGMA_TRUST_PROXY: ${EGMA_TRUST_PROXY:-false}
      # The budget belongs to the organization rather than to a key, so
      # rotating a key does not reset it.
      EGMA_RATE_LIMIT_PER_MINUTE: ${EGMA_RATE_LIMIT_PER_MINUTE:-600}
      # Mail is optional and unset by default. With none, invitations hand
      # their link back to whoever sent them and signup asks for no
      # verification; setting this turns both around at once. It is never a
      # prerequisite for anything, including adding a second person.
      EGMA_SMTP_URL: ${EGMA_SMTP_URL:-}
      EGMA_MAIL_FROM: ${EGMA_MAIL_FROM:-}
      # What this process knows about the carrier: three non-secret facts,
      # written by `egma self-host phone setup`, from which it reports the
      # platform's phone state. No token, no password, no provider key — the
      # API neither dials nor speaks, and phone authority lives in the
      # container that uses it.
      EGMA_PHONE_TRUNK_ADDRESS: ${EGMA_PHONE_TRUNK_ADDRESS:-}
      EGMA_PHONE_SOURCE_NUMBER: ${EGMA_PHONE_SOURCE_NUMBER:-}
      EGMA_PHONE_SPEECH_PROVIDER: ${EGMA_PHONE_SPEECH_PROVIDER:-}
      # The judge a project is given when it has configured none, from the one
      # OpenAI key phone setup asked for. Written into each project's own
      # sealed row on boot and never over one that is already there. It is here
      # rather than on the grader on purpose: a judge configured per container
      # is a judge no project chose. All three or none — the API refuses to
      # start on half, because half a judge errors every verdict it is given.
      EGMA_JUDGE_PROVIDER: ${EGMA_JUDGE_PROVIDER:-}
      EGMA_JUDGE_MODEL: ${EGMA_JUDGE_MODEL:-}
      EGMA_JUDGE_API_KEY: ${EGMA_JUDGE_API_KEY:-}
    ports:
      # Published on the host, so that a self-hoster who already runs
      # something on these can move egma rather than move the other thing —
      # and so that two egma platforms can stand side by side on one machine,
      # each with its own instance identity, which is how the boundary between
      # a platform and an agent repository is proved at all. The port inside
      # the container never moves: it is the compose network's, and the two
      # halves of a published port are not the same decision.
      - "${EGMA_API_PORT:-3100}:3100"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # The web application proxies the API's paths so that both answer on one
        # origin. Next resolves this into the build, so it is an argument rather
        # than an environment variable.
        EGMA_API_ORIGIN: ${EGMA_API_ORIGIN:-http://api:3100}
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3101"
    ports:
      - "${EGMA_WEB_PORT:-3101}:3101"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3101/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s

  # The simulator: the service that conducts simulations. It claims its
  # work rather than being sent it, so there is no `ports:` here and there
  # never will be — every arrow points out, and adding this container to a
  # self-host costs no inbound networking at all. Everything it needs is
  # below; there are no files to place and no flags to pass.
  simulator:
    build:
      context: .
      dockerfile: apps/simulator/Dockerfile
    environment:
      # Where it claims, heartbeats and reports. The API and the simulator
      # meet inside this network, so this is the service name rather than
      # the origin a browser uses. The endpoints it dials arrive with the
      # trigger; until then it asks, is told there is nothing, and asks
      # again, which is what a queue with nothing in it looks like.
      EGMA_SIMULATOR_CONTROL_PLANE_URL: ${EGMA_SIMULATOR_CONTROL_PLANE_URL:-http://api:3100}
      # What it shows the control plane to be allowed to claim, as a bearer
      # — the same header an egma key uses everywhere else. The API checks it
      # on every claim, so this interpolates the same development default as
      # the api service above and the two halves always match. Change it —
      # once, in .env, for both — before anybody else can reach the machine.
      EGMA_SIMULATOR_SERVICE_TOKEN: ${EGMA_SIMULATOR_SERVICE_TOKEN:-egma_st_development-only-change-this-before-anybody-else-can-reach-it}
      # How many simulations one simulator conducts at once. It claims only
      # what it has room for, so a big run degrades to a queue rather than
      # to overload — raise this, or start a second simulator, and they
      # distribute between themselves with nothing in front of them.
      EGMA_SIMULATOR_CAPACITY: ${EGMA_SIMULATOR_CAPACITY:-4}
      # Where the persona's words come from. `scripted` walks the scenario
      # deterministically and needs no account, which is why it is the
      # default; `openai` speaks to any provider using that shape and makes
      # the next two required.
      EGMA_SIMULATOR_MODEL_PROVIDER: ${EGMA_SIMULATOR_MODEL_PROVIDER:-scripted}
      EGMA_SIMULATOR_MODEL_NAME: ${EGMA_SIMULATOR_MODEL_NAME:-}
      EGMA_SIMULATOR_MODEL_API_KEY: ${EGMA_SIMULATOR_MODEL_API_KEY:-}
      EGMA_SIMULATOR_MODEL_BASE_URL: ${EGMA_SIMULATOR_MODEL_BASE_URL:-}
      # What the persona hears and speaks with in a voice simulation. Both
      # default to `scripted`, which needs no account and no network — a
      # first voice simulation costs nothing — and each is chosen on its
      # own. Naming `deepgram` or `elevenlabs` makes that provider's key
      # required, and the simulator says so at startup rather than failing
      # every voice simulation it later claims.
      EGMA_SIMULATOR_STT_PROVIDER: ${EGMA_SIMULATOR_STT_PROVIDER:-scripted}
      EGMA_SIMULATOR_DEEPGRAM_API_KEY: ${EGMA_SIMULATOR_DEEPGRAM_API_KEY:-}
      EGMA_SIMULATOR_TTS_PROVIDER: ${EGMA_SIMULATOR_TTS_PROVIDER:-scripted}
      EGMA_SIMULATOR_ELEVENLABS_API_KEY: ${EGMA_SIMULATOR_ELEVENLABS_API_KEY:-}
      # One key for both legs when either names `openai`, because one
      # account speaks and listens. It is what `egma self-host phone
      # setup` asks for once, and the same key the persona's brain reads
      # through EGMA_SIMULATOR_MODEL_API_KEY above.
      EGMA_SIMULATOR_OPENAI_API_KEY: ${EGMA_SIMULATOR_OPENAI_API_KEY:-}
      # Which models those legs ask for, and which voice the persona
      # speaks with when its own traits name none. Models are the
      # provider's to retire and add, so they are configuration rather
      # than a constant of the product.
      EGMA_SIMULATOR_STT_MODEL: ${EGMA_SIMULATOR_STT_MODEL:-}
      EGMA_SIMULATOR_TTS_MODEL: ${EGMA_SIMULATOR_TTS_MODEL:-}
      EGMA_SIMULATOR_TTS_VOICE: ${EGMA_SIMULATOR_TTS_VOICE:-}
      # What hears the agent start and stop speaking. Bundled in the image
      # either way, so this downloads nothing at run time.
      EGMA_SIMULATOR_VAD_PROVIDER: ${EGMA_SIMULATOR_VAD_PROVIDER:-scripted}
      # How a phone call's audio travels, for a simulation whose connection
      # names a number. Naming a backend is what makes the rest required
      # and what makes this simulator able to dial at all; unset, it starts
      # in silence and refuses such a simulation with the variable to set.
      # The simulator's own posture is unchanged either way: it joins a
      # LiveKit room outbound and is never dialled into. `scripted` places
      # no call at all and is what the local story and CI use. A LiveKit
      # and a SIP trunk are what make a real call possible; the trunk is
      # yours, from any carrier, either one already stored in LiveKit or
      # the inline fields below. Standing the LiveKit and SIP containers up
      # beside this one is a separate, opt-in overlay: those need a public
      # IP, which this file never assumes.
      #
      # The LiveKit beside it is the default, filled in from the same pair
      # the two containers below authenticate each other with, so the
      # three halves can never disagree. The backend itself stays unset
      # until `egma self-host phone setup` has run: a simulator told to
      # dial with no trunk refuses to start, and platform readiness must
      # not wait on carrier setup.
      EGMA_SIMULATOR_MEDIA_BACKEND: ${EGMA_SIMULATOR_MEDIA_BACKEND:-}
      EGMA_SIMULATOR_LIVEKIT_URL: ${EGMA_SIMULATOR_LIVEKIT_URL:-ws://livekit:7880}
      EGMA_SIMULATOR_LIVEKIT_API_KEY: ${EGMA_SIMULATOR_LIVEKIT_API_KEY:-${EGMA_LIVEKIT_API_KEY:-egma-devkey}}
      EGMA_SIMULATOR_LIVEKIT_API_SECRET: ${EGMA_SIMULATOR_LIVEKIT_API_SECRET:-${EGMA_LIVEKIT_API_SECRET:-egma-development-only-livekit-secret-change-it}}
      EGMA_SIMULATOR_SIP_TRUNK_ID: ${EGMA_SIMULATOR_SIP_TRUNK_ID:-}
      EGMA_SIMULATOR_SIP_TRUNK_ADDRESS: ${EGMA_SIMULATOR_SIP_TRUNK_ADDRESS:-}
      EGMA_SIMULATOR_SIP_TRUNK_NUMBER: ${EGMA_SIMULATOR_SIP_TRUNK_NUMBER:-}
      EGMA_SIMULATOR_SIP_TRUNK_USERNAME: ${EGMA_SIMULATOR_SIP_TRUNK_USERNAME:-}
      EGMA_SIMULATOR_SIP_TRUNK_PASSWORD: ${EGMA_SIMULATOR_SIP_TRUNK_PASSWORD:-}
      # Where recordings go. Naming an endpoint is the whole of what sends
      # them to object storage; naming none keeps them in a directory
      # inside this container, which is what a bare `egma-simulator`
      # process on somebody's laptop does and what the test suite runs on.
      # This deployment names one, so no recording touches this
      # container's disk — which is the point: a recording only the
      # container that made it can read is a recording nobody can hear,
      # and starting a second simulator would silently lose half the
      # audio.
      #
      # The service name, not the address a browser uses. They are two
      # different addresses on nearly every real deployment and confusing
      # them is the most common way a self-hosted object store breaks.
      EGMA_SIMULATOR_S3_ENDPOINT: ${EGMA_SIMULATOR_S3_ENDPOINT:-http://minio:9000}
      EGMA_SIMULATOR_S3_BUCKET: ${EGMA_SIMULATOR_S3_BUCKET:-${EGMA_S3_BUCKET:-egma-recordings}}
      EGMA_SIMULATOR_S3_REGION: ${EGMA_SIMULATOR_S3_REGION:-}
      # The write credential, interpolated from the same pair the store
      # above is stood up with so the two halves always match. A
      # deployment pointed at somebody else's S3 sets these two directly
      # and leaves the store above unused.
      EGMA_SIMULATOR_S3_ACCESS_KEY_ID: ${EGMA_SIMULATOR_S3_ACCESS_KEY_ID:-${EGMA_S3_ACCESS_KEY_ID:-egma}}
      EGMA_SIMULATOR_S3_SECRET_ACCESS_KEY: ${EGMA_SIMULATOR_S3_SECRET_ACCESS_KEY:-${EGMA_S3_SECRET_ACCESS_KEY:-egma-development-only-object-storage-secret-change-it}}
      # The volume below, and the one thing kept on it. The write-ahead
      # log is the only record of a report that never got through, so
      # losing it to a container being replaced would lose a simulation's
      # evidence — it lives on the volume rather than in the container.
      # Recordings used to sit beside it and now do not; the volume stays
      # for this.
      EGMA_SIMULATOR_WAL_DIR: /var/lib/egma-simulator/wal
      # How the pull behaves. The defaults suit a control plane on the same
      # network; a slow link is what these are for.
      EGMA_SIMULATOR_CLAIMANT: ${EGMA_SIMULATOR_CLAIMANT:-}
      EGMA_SIMULATOR_HEARTBEAT_SECONDS: ${EGMA_SIMULATOR_HEARTBEAT_SECONDS:-}
      EGMA_SIMULATOR_CLAIM_WAIT_SECONDS: ${EGMA_SIMULATOR_CLAIM_WAIT_SECONDS:-}
      EGMA_SIMULATOR_REPORT_DEADLINE_SECONDS: ${EGMA_SIMULATOR_REPORT_DEADLINE_SECONDS:-}
      EGMA_SIMULATOR_LOG_LEVEL: ${EGMA_SIMULATOR_LOG_LEVEL:-INFO}
    volumes:
      - simulator-data:/var/lib/egma-simulator
    depends_on:
      api:
        condition: service_healthy
      # The bucket rather than the store, and completed rather than
      # healthy: a store that is up but has no bucket in it refuses every
      # recording, and the one-shot job above is what puts one there.
      minio-bucket:
        condition: service_completed_successfully
      livekit:
        condition: service_healthy
      # Named even though the simulator never speaks to the gateway
      # directly — it asks the *server* to place a call, and the server
      # hands that to whichever gateway has announced itself. Without this
      # line the gateway is a container nothing depends on, so
      # `docker compose up simulator` would bring up a phone stack that
      # cannot place a phone call, and the first thing to notice would be
      # a dial.
      livekit-sip:
        condition: service_started
    # No `healthcheck` here, unlike every other service, and for the same
    # reason there is no `ports`: nothing listens. The other four are
    # probed by asking them something over a port they listen on, and this
    # one listens on none — a check that only proved the process exists
    # would prove nothing Docker does not already know, since the process
    # is the container and its death is the container's exit.
    #
    # What could go wrong instead is already answered elsewhere. Bad
    # configuration stops it before it claims anything, saying which
    # variable. A control plane it cannot reach is in its log, once and
    # then once a minute. And a simulator that dies holding claimed work
    # is the control plane's to notice, by the heartbeats stopping — which
    # is the one place that can act on it, because it is the only side
    # that knows what was claimed.

  # The grader: the service that judges finished conversations. It claims its
  # work rather than being sent it, so there is no `ports:` here and there
  # never will be — every arrow points out, exactly as the simulator's do,
  # and adding this container to a self-host costs no inbound networking at
  # all. It sits on the control plane's side of the wire, so it reads the two
  # stores directly rather than through the API; the API gains nothing at all
  # from grading existing.
  #
  # Scaling it is running more copies of it. They claim from one queue, take
  # what they have room for, and distribute between themselves with nothing in
  # front of them: `docker compose up --scale grader=3` is the whole dial.
  grader:
    build:
      context: .
      dockerfile: apps/grader/Dockerfile
    environment:
      # The two stores, on the same terms the API reads them: conversations and
      # graders come out of Postgres, verdicts go into ClickHouse. Both are
      # required, because a grader that started with nowhere to read from and
      # nowhere to write to would look healthy and judge nothing.
      DATABASE_URL: postgres://${POSTGRES_USER:-egma}:${POSTGRES_PASSWORD:-egma}@postgres:5432/${POSTGRES_DB:-egma}
      CLICKHOUSE_URL: http://${CLICKHOUSE_USER:-egma}:${CLICKHOUSE_PASSWORD:-egma}@clickhouse:8123/${CLICKHOUSE_DB:-egma}
      # The same key the API seals with, because a judged grader has to replay
      # the project's own judge key to the provider, and the process making the
      # call is this one. What it can open is held narrow on the other side: a
      # judge key is resolved through one door that refuses every caller whose
      # context did not come from a grading claim, and a connection's
      # credentials sit behind a door asking for a permission the engine's
      # context does not carry. Leave it unset for a deployment whose projects
      # configure no judge — the deterministic graders judge for free either
      # way, and a project that did configure one gets `errored` verdicts saying
      # the key could not be read rather than a silent green tick.
      #
      # There is still deliberately no model key here. A judge belongs to the
      # project that configured it, never to a container.
      EGMA_ENCRYPTION_KEY: ${EGMA_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      # This copy's own name for itself, in claims and in its log. Unset is
      # fine and usual — it names itself after its host and process, which is
      # what tells two copies apart.
      EGMA_GRADER_CLAIMANT: ${EGMA_GRADER_CLAIMANT:-}
      # How many conversations one copy judges at once. It claims only what it
      # has room for, so a burst of finished simulations degrades to a queue
      # rather than to overload — raise this, or start a second copy.
      EGMA_GRADER_CAPACITY: ${EGMA_GRADER_CAPACITY:-4}
      # How the claim behaves. A copy says it is still alive every heartbeat
      # while it holds a conversation, and a copy silent for longer than the
      # lease loses it to whichever copy asks next — which is how a container
      # replaced mid-judgment costs one lease and no verdict. The heartbeat
      # must stay well under the lease.
      EGMA_GRADER_HEARTBEAT_SECONDS: ${EGMA_GRADER_HEARTBEAT_SECONDS:-}
      EGMA_GRADER_LEASE_SECONDS: ${EGMA_GRADER_LEASE_SECONDS:-}
      # The backstop, and **not** how work arrives. A conversation ending wakes
      # this service on the transaction that ended it, so nothing a verdict
      # waits for is on a timer. This is for the notification raised while
      # every copy happened to be restarting: it costs one indexed query and
      # catches the case that would otherwise look like grading having stopped.
      EGMA_GRADER_SWEEP_SECONDS: ${EGMA_GRADER_SWEEP_SECONDS:-}
      # How long a production conversation has to be quiet before it is judged
      # without ever having been closed. A well-behaved exporter closes the span
      # the whole conversation happened inside, egma is woken by it, and this
      # decides nothing. It is here for the exporter that never closes one — a
      # crashed agent, a framework that emits no session span — where the event
      # to wait for is the absence of events. Five minutes by default: shorter
      # judges a caller left on hold halfway through, longer leaves a broken
      # exporter's conversations unjudged for an afternoon.
      EGMA_GRADER_TRACE_IDLE_SECONDS: ${EGMA_GRADER_TRACE_IDLE_SECONDS:-}
      EGMA_GRADER_LOG_LEVEL: ${EGMA_GRADER_LOG_LEVEL:-INFO}
    depends_on:
      api:
        condition: service_healthy
    # No `healthcheck` here, for the reason the simulator has none: nothing
    # listens. The schema is applied by the API on boot, which is what this
    # waits for — there is no migration container and no manual step, and a
    # second migrator racing the first would buy nothing.
    #
    # What could go wrong instead is answered elsewhere. Bad configuration
    # stops it before it claims anything, saying which variable. A store it
    # cannot reach is in its log. And a copy that dies holding a conversation
    # is the claim's to notice, by the heartbeats stopping — which is the one
    # place that can act on it, because it is the only side that knows what
    # was claimed.

  # --- The phone stack --------------------------------------------------------
  #
  # Three containers: the LiveKit server (the room a call becomes), its SIP
  # gateway (the thing that speaks to your carrier), and the Redis those two
  # find each other through. They start with everything else, because a
  # platform that cannot place a phone call is not the product — `egma
  # self-host up` brings up one deployment and `egma self-host phone setup`
  # makes it able to dial. They were an opt-in overlay until the self-hosted
  # release; that overlay is gone and nothing needs to be asked for by name.
  #
  # ## The network truth, container by container
  #
  # | Container         | Reachable from the internet? |
  # |-------------------|------------------------------|
  # | simulator         | **never** — it publishes nothing, in any configuration |
  # | livekit (SFU)     | no — its only clients are the two containers beside it |
  # | livekit-redis     | no |
  # | **livekit-sip**   | **yes**, for a call that arrives — SIP and its RTP range |
  #
  # The gateway is the one honest exception in the whole deployment, and it is
  # not ours to remove: it is the piece a carrier sends a call's audio *to*. It
  # advertises an address and a port in the SDP it sends, and the carrier sends
  # RTP there. On a server with a public IP, or behind a 1:1 NAT with these
  # ports forwarded, that is routine. On a laptop behind an ordinary home
  # router it is not — see the README, which says what actually happens when
  # you try, because we tried.
  #
  # **The escape hatch is one variable.** LiveKit Cloud is the same API behind
  # the same URL, so a deployment that cannot host a gateway points
  # EGMA_SIMULATOR_LIVEKIT_URL at Cloud and everything else — the trunk, the
  # plug, the record — is unchanged.
  #
  # ## The RTP range is narrow on purpose
  #
  # LiveKit's own reference opens 10000-20000/udp. That is ten thousand ports
  # on somebody's firewall for a deployment that places a handful of calls, and
  # a range published to the internet is a range to justify. The default here
  # is 21 ports — about ten calls at once, two ports each — which is more than
  # the simulator's default capacity of four can use. Widen it with the two
  # variables below if you raise capacity, and widen your firewall by exactly
  # as much.

  # The bus the server and the gateway find each other through. Not a store:
  # nothing here is worth keeping across a restart, so there is no volume,
  # and nothing outside this network ever speaks to it, so there is no port.
  livekit-redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The room a phone call becomes. The simulator joins it outbound and the
  # answering phone is put into it by the gateway; from the pipeline's point
  # of view the two are participants in one room and nothing else.
  #
  # Its ports are published to this machine's loopback and no further —
  # the workbench's idiom, for the same reason: a person at this machine
  # may want to reach it, and nobody else has any business doing so. The
  # simulator does not come through here; it uses the compose network. That
  # is also what makes the development key below harmless — it
  # authenticates traffic that cannot arrive from off this host. Change
  # `EGMA_LIVEKIT_BIND` and it stops being harmless, so if you ever do,
  # change the key pair first.
  livekit:
    image: livekit/livekit-server:v1.13.5
    environment:
      LIVEKIT_KEYS: "${EGMA_LIVEKIT_API_KEY:-egma-devkey}: ${EGMA_LIVEKIT_API_SECRET:-egma-development-only-livekit-secret-change-it}"
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          # One UDP port for every room, rather than a range: this server's
          # clients are counted in single figures, so there is nothing to
          # spread across ports.
          udp_port: 7882
          tcp_port: 7881
          # False, and this is the one that matters: with it on, the server
          # STUNs for a public address and hands that to clients as the
          # place to send media. Its clients are on this compose network —
          # the address to give them is this container's own.
          use_external_ip: false
          # What the server tells clients to send media to, when its own
          # address is not the one that works. Empty is right for every
          # deployment where the clients are containers beside it. Set it
          # when a client lives outside this network and cannot route into
          # it — a laptop running Docker Desktop is the case that needs it,
          # and the value is that machine's own LAN address, with
          # EGMA_LIVEKIT_BIND=0.0.0.0 so the published ports answer there.
          node_ip: "${EGMA_LIVEKIT_ADVERTISE_IP:-}"
        redis:
          address: livekit-redis:6379
        logging:
          level: ${EGMA_LIVEKIT_LOG_LEVEL:-info}
    ports:
      - "${EGMA_LIVEKIT_BIND:-127.0.0.1}:7880:7880"
      - "${EGMA_LIVEKIT_BIND:-127.0.0.1}:7881:7881"
      - "${EGMA_LIVEKIT_BIND:-127.0.0.1}:7882:7882/udp"
    depends_on:
      livekit-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7880/"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The gateway: the only container in egma that a carrier talks to.
  #
  # It places the call your trunk carries, and turns the phone leg into a
  # participant in the room above. Its trunk configuration does not live
  # here — the simulator hands a trunk to LiveKit per call, so a customer's
  # carrier credentials stay in the simulator's environment and are never
  # written into a bridge's config file.
  livekit-sip:
    image: livekit/sip:v1.9.0
    # The image's own command names a config file that only exists if you
    # mount one. This overlay has no files to place, so the entrypoint is
    # the binary and the configuration is the environment.
    entrypoint: ["livekit-sip"]
    environment:
      SIP_CONFIG_BODY: |
        api_key: ${EGMA_LIVEKIT_API_KEY:-egma-devkey}
        api_secret: ${EGMA_LIVEKIT_API_SECRET:-egma-development-only-livekit-secret-change-it}
        ws_url: ws://livekit:7880
        redis:
          address: livekit-redis:6379
        # The port the gateway listens on **and announces**. It moves with
        # the published port below rather than being fixed at 5060, because
        # the two are one number: a gateway that listens on 5060 while the
        # host publishes 5070 tells the carrier to send its in-dialog
        # requests — a BYE, a re-INVITE — to a port nothing answers on, and
        # what that looks like is a call that connects and then will not hang
        # up cleanly.
        sip_port: ${EGMA_LIVEKIT_SIP_PORT:-5060}
        rtp_port: ${EGMA_LIVEKIT_SIP_RTP_PORT_START:-10000}-${EGMA_LIVEKIT_SIP_RTP_PORT_END:-10020}
        # What address to write into the SDP the carrier reads. Set
        # EGMA_LIVEKIT_SIP_EXTERNAL_IP when you know it — an elastic IP, a
        # 1:1 NAT — and the gateway advertises exactly that. Leave it unset
        # and the gateway asks a STUN server what the world sees, which is
        # right on a host whose public address it cannot read off an
        # interface, and is the case the README's spike is about.
        use_external_ip: ${EGMA_LIVEKIT_SIP_USE_EXTERNAL_IP:-true}
        nat_1_to_1_ip: "${EGMA_LIVEKIT_SIP_EXTERNAL_IP:-}"
        # Nothing dials in, so the gateway is told not to advertise a port
        # for anyone to dial in on.
        hide_inbound_port: true
        logging:
          level: ${EGMA_LIVEKIT_LOG_LEVEL:-info}
    ports:
      # SIP signalling. An outbound call's answers come back on the flow the
      # gateway opened, so this is published for what comes *after* the
      # answer — a carrier's BYE and its in-dialog requests go to the
      # address the gateway advertised, not to that flow.
      - "${EGMA_LIVEKIT_SIP_PORT:-5060}:${EGMA_LIVEKIT_SIP_PORT:-5060}/udp"
      - "${EGMA_LIVEKIT_SIP_PORT:-5060}:${EGMA_LIVEKIT_SIP_PORT:-5060}/tcp"
      # The audio. Narrow, and the same range the config above hands out —
      # they are two halves of one number and moving one without the other
      # is a call that rings and stays silent.
      - "${EGMA_LIVEKIT_SIP_RTP_PORT_START:-10000}-${EGMA_LIVEKIT_SIP_RTP_PORT_END:-10020}:${EGMA_LIVEKIT_SIP_RTP_PORT_START:-10000}-${EGMA_LIVEKIT_SIP_RTP_PORT_END:-10020}/udp"
    depends_on:
      livekit:
        condition: service_healthy
    # No `healthcheck` here, unlike the two above. The gateway serves no
    # HTTP of its own and the image carries no client to ask it with, so
    # anything written here would be a check that cannot run. What "ready"
    # means for this container is not visible from inside it anyway: the
    # gateway announces itself to the server through Redis, and a call is
    # dispatched to it or is not — which the server knows and it does not.
    # It takes about a second, and the first thing that would notice is a
    # dial, which fails honestly and says so.

volumes:
  postgres-data:
  clickhouse-data:
  minio-data:
  # Still here, and still needed, though no recording lands on it any more:
  # the write-ahead log that protects a report lives in it, and that log is
  # the only record of a report the control plane never took.
  simulator-data:
