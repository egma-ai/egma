name: Build platform images
run-name: Build platform images ${{ inputs.public_sha }} from ${{ inputs.source_run_id }}

# Main's gated deploy job is the only caller. Pull requests run code checks and
# never receive registry or Daytona credentials.
on:
  workflow_dispatch:
    inputs:
      public_sha:
        description: Exact public commit to publish
        required: true
        type: string
      source_run_id:
        description: Calling test workflow run
        required: true
        type: string

concurrency:
  group: build-platform-images-${{ inputs.public_sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Require main and one immutable public commit
        id: release
        env:
          REQUESTED_SHA: ${{ inputs.public_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "public_sha must be one full lowercase commit SHA." >&2
            exit 1
          }
          echo "sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"

  build:
    name: Publish AMD64 ${{ matrix.app }}
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        app: [api, grader, simulator]
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      REGISTRY: ${{ vars.ECR_REGISTRY }}
      DEPLOY_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Log in to ECR
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
      - name: Build and publish the exact SHA image
        env:
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          image="$REGISTRY/egma/$APP:$RELEASE_SHA"
          if bash .github/ecr-image-exists.sh "egma/$APP" "$RELEASE_SHA"; then
            echo "$image is already published; keeping its immutable bytes."
            exit 0
          else
            status=$?
            [ "$status" -eq 1 ] || exit "$status"
          fi
          docker build --pull --platform linux/amd64 -f "apps/$APP/Dockerfile" -t "$image" .
          docker push "$image"

  snapshot:
    name: Create immutable Daytona snapshot
    needs: [authorize, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      DEPLOY_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      SIMULATOR_IMAGE: ${{ vars.ECR_REGISTRY }}/egma/simulator:${{ needs.authorize.outputs.release_sha }}
      RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Read the Daytona control token
        run: |
          set -euo pipefail
          token=$(aws secretsmanager get-secret-value \
            --secret-id egma/daytona --query SecretString --output text \
            | jq -r '.api_key // empty')
          [ -n "$token" ] || { echo "egma/daytona has no api_key field." >&2; exit 1; }
          echo "::add-mask::$token"
          echo "DAYTONA_API_KEY=$token" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Create or verify the snapshot and wait for active
        run: node apps/api/scripts/create-daytona-snapshot.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daytona-snapshot-${{ env.RELEASE_SHA }}
          path: daytona-snapshot-id.txt
          if-no-files-found: error
          retention-days: 7
