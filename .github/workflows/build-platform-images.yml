name: Build platform images

# Pull requests prove each Dockerfile on native AMD64 and ARM64 runners without
# receiving AWS credentials. A manual main run publishes immutable commit tags.
# The cloud repository becomes the deployment writer in the release handoff.
on:
  pull_request:
    paths:
      - .github/workflows/build-platform-images.yml
      - apps/api/**
      - apps/grader/**
      - apps/simulator/**
      - certificates/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
  workflow_dispatch:

concurrency:
  group: build-platform-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Build ${{ matrix.app }} (${{ matrix.arch }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            runner: ubuntu-latest
            arch: amd64
          - app: api
            runner: ubuntu-24.04-arm
            arch: arm64
          - app: grader
            runner: ubuntu-latest
            arch: amd64
          - app: grader
            runner: ubuntu-24.04-arm
            arch: arm64
          - app: simulator
            runner: ubuntu-latest
            arch: amd64
          - app: simulator
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prove this is a native build
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          actual="$(uname -m)"
          case "$EXPECTED_ARCH:$actual" in
            amd64:x86_64|arm64:aarch64|arm64:arm64) ;;
            *) echo "Expected native $EXPECTED_ARCH runner, got $actual." >&2; exit 1 ;;
          esac

      - name: Build without publishing
        env:
          APP: ${{ matrix.app }}
          ARCH: ${{ matrix.arch }}
        run: docker build --pull -f "apps/$APP/Dockerfile" -t "egma-ci/$APP:$GITHUB_SHA-$ARCH" .

  authorize-publish:
    name: Require main for publication
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse publication from any other ref
        run: test "$GITHUB_REF" = refs/heads/main

  build:
    name: Publish native ${{ matrix.app }} (${{ matrix.arch }})
    needs: authorize-publish
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            runner: ubuntu-latest
            arch: amd64
          - app: api
            runner: ubuntu-24.04-arm
            arch: arm64
          - app: grader
            runner: ubuntu-latest
            arch: amd64
          - app: grader
            runner: ubuntu-24.04-arm
            arch: arm64
          - app: simulator
            runner: ubuntu-latest
            arch: amd64
          - app: simulator
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      REGISTRY: ${{ vars.ECR_REGISTRY }}
      DEPLOY_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Prove this is a native build
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          actual="$(uname -m)"
          case "$EXPECTED_ARCH:$actual" in
            amd64:x86_64|arm64:aarch64|arm64:arm64) ;;
            *) echo "Expected native $EXPECTED_ARCH runner, got $actual." >&2; exit 1 ;;
          esac

      - name: Log in to ECR
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"

      - name: Build and push the native image
        env:
          APP: ${{ matrix.app }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          image="$REGISTRY/egma/$APP:$GITHUB_SHA-$ARCH"
          docker build --pull -f "apps/$APP/Dockerfile" -t "$image" .
          docker push "$image"

  publish:
    name: Publish immutable multi-architecture tags
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      REGISTRY: ${{ vars.ECR_REGISTRY }}
      DEPLOY_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      SOCI_VERSION: 0.15.0
    steps:
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.11.1

      - name: Install the pinned SOCI v2 converter
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes skopeo
          base="https://github.com/awslabs/soci-snapshotter/releases/download/v${SOCI_VERSION}"
          asset="soci-snapshotter-${SOCI_VERSION}-linux-amd64-static.tar.gz"
          curl -fsSLO "$base/$asset"
          curl -fsSLO "$base/$asset.sha256sum"
          sha256sum --check "$asset.sha256sum"
          tar -xzf "$asset" soci
          sudo install -m 0755 soci /usr/local/bin/soci
          soci --version

      - name: Log in to ECR
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          aws ecr get-login-password --region "$AWS_REGION" | skopeo login --username AWS --password-stdin "$REGISTRY"

      - name: Publish one commit tag for every image
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          for app in api grader simulator; do
            repo="$REGISTRY/egma/$app"
            docker buildx imagetools create \
              --tag "$repo:raw-$GITHUB_SHA" \
              "$repo:$GITHUB_SHA-amd64" \
              "$repo:$GITHUB_SHA-arm64"

            if [ "$app" = simulator ]; then
              skopeo copy --all "docker://$repo:raw-$GITHUB_SHA" "oci-archive:$work/simulator.tar"
              soci convert --standalone --all-platforms "$work/simulator.tar" "$work/simulator-soci.tar"
              skopeo copy --all "oci-archive:$work/simulator-soci.tar" "docker://$repo:$GITHUB_SHA"
            else
              docker buildx imagetools create --tag "$repo:$GITHUB_SHA" "$repo:raw-$GITHUB_SHA"
            fi
          done

      - name: Verify platforms and simulator SOCI v2 manifests
        run: |
          set -euo pipefail
          for app in api grader simulator; do
            response="$(aws ecr batch-get-image \
              --repository-name "egma/$app" \
              --image-ids "imageTag=$GITHUB_SHA" \
              --output json)"
            manifest="$(jq -r '.images[0].imageManifest' <<<"$response")"
            digest="$(jq -r '.images[0].imageId.imageDigest' <<<"$response")"
            jq -e '
              [.manifests[] | select(
                .artifactType == null and .platform.os == "linux") |
                (.platform.os + "/" + .platform.architecture)] | sort ==
              ["linux/amd64", "linux/arm64"]' <<<"$manifest" >/dev/null
            if [ "$app" = simulator ]; then
              jq -e '
                [.manifests[] | select(.artifactType ==
                  "application/vnd.amazon.soci.index.v2+json") |
                  (.platform.os + "/" + .platform.architecture)] | sort ==
                ["linux/amd64", "linux/arm64"]' <<<"$manifest" >/dev/null
            fi
            echo "$app:$GITHUB_SHA digest $digest contains native linux/amd64 and linux/arm64 images."
          done
          echo "simulator:$GITHUB_SHA contains both SOCI index manifest v2 artifacts."
