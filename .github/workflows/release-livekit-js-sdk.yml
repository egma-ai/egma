name: Release LiveKit JavaScript SDK

# A version increase on main creates its release tag and publishes the SDK.
# Manual livekit-js-sdk-v<version> tags use the same release checks.
#
# npm must trust this repository, workflow, and @egma/livekit package. GitHub
# then supplies one short-lived OIDC credential. No long-lived npm token is
# stored in this repository.

on:
  push:
    branches:
      - main
    tags:
      - "livekit-js-sdk-v*"

concurrency:
  group: release-livekit-js-sdk
  queue: max

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      should_publish: ${{ steps.release.outputs.should_publish }}
      version: ${{ steps.release.outputs.version }}
      npm_tag: ${{ steps.release.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Compare versions and prepare the release tag
        id: release
        run: python3 .github/package_release.py prepare livekit-js

  compatibility:
    name: LiveKit JS compatibility
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Build and pack the SDK
        id: pack
        run: |
          pnpm --filter @egma/livekit build
          dir="$(mktemp -d)"
          pnpm --config.node-linker=hoisted \
            --filter @egma/livekit \
            pack --pack-destination "$dir"
          tarball="$(find "$dir" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Verify all LiveKit versions in parallel
        run: python3 .github/livekit_compatibility.py javascript "${{ steps.pack.outputs.tarball }}"

  release:
    name: Verify and publish
    needs: [prepare, compatibility]
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      NPM_TAG: ${{ needs.prepare.outputs.npm_tag }}
    steps:
      # This workflow holds npm publishing authority, so every action is pinned
      # to the commit behind the human-readable version in its comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        # Version comes from "packageManager" in the root package.json.

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Report toolchain
        run: node --version && npm --version && pnpm --version

      - name: Make the native build toolchain available
        run: ./.github/native-toolchain.sh

      - run: pnpm install --frozen-lockfile

      - name: Check the release matches the package version
        run: |
          packaged="$(node -p "require('./sdks/livekit-js/package.json').version")"
          if [ "$RELEASE_VERSION" != "$packaged" ]; then
            echo "Release says $RELEASE_VERSION and sdks/livekit-js/package.json says $packaged." >&2
            exit 1
          fi
          echo "Releasing @egma/livekit $packaged."

      - name: Test and build the SDK
        run: |
          pnpm --filter @egma/livekit test
          pnpm --filter @egma/livekit build

      - name: Pack the public SDK
        id: pack
        run: |
          set -e
          dir="$(mktemp -d)"
          pnpm --config.node-linker=hoisted \
            --filter @egma/livekit \
            pack --pack-destination "$dir"
          tarball="$(find "$dir" -maxdepth 1 -name '*.tgz' -print -quit)"
          if [ -z "$tarball" ]; then
            echo "pnpm did not produce an SDK tarball." >&2
            exit 1
          fi
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@681c641aba71e4a1c380be3ab5e12ad51f415867 # v7.1.6
        with:
          version: "0.11.33"

      - name: Build the web API client
        run: pnpm --filter @egma/platform-api build

      - name: Start the full-path evidence stores
        run: pnpm db:up

      - name: Sync the shipped simulator
        working-directory: apps/simulator
        run: uv sync --frozen

      - name: Install the voice sentence tokenizer
        working-directory: apps/simulator
        run: uv run python -m nltk.downloader punkt_tab

      - name: Report the browser
        run: google-chrome --version

      - name: Warm the object-store image
        run: docker pull "$(awk '/^  minio:/{found=1} found && /image:/{print $2; exit}' docker-compose.yml)"

      - name: Prove the exact package through storage and browser-visible grades
        env:
          LIVEKIT_E2E_OPENAI_API_KEY: ${{ secrets.LIVEKIT_E2E_OPENAI_API_KEY }}
          LIVEKIT_E2E_JAVASCRIPT_PACKAGE: ${{ steps.pack.outputs.tarball }}
        run: |
          set -e
          if [ -z "$LIVEKIT_E2E_OPENAI_API_KEY" ]; then
            echo "LIVEKIT_E2E_OPENAI_API_KEY is required before this package can publish." >&2
            exit 1
          fi
          package="$(realpath "$LIVEKIT_E2E_JAVASCRIPT_PACKAGE")"

          run_case() {
            version="$1"
            modality="$2"
            rm -rf .proofs/simulation-e2e
            set +e
            EGMA_REQUIRE_OBJECT_STORAGE=1 \
              SIMULATION_E2E_LIVE=1 \
              SIMULATION_E2E_LANGUAGE=javascript \
              SIMULATION_E2E_MODALITY="$modality" \
              SIMULATION_E2E_ACCESS=project_credentials \
              SIMULATION_E2E_MOCKS=on \
              LIVEKIT_E2E_JAVASCRIPT_PACKAGE="$package" \
              LIVEKIT_E2E_JAVASCRIPT_AGENTS_VERSION="$version" \
              pnpm exec vitest run --project fast \
                apps/api/test/simulator-conversation.test.ts \
                --testNamePattern "runs a packaged LiveKit worker"
            status="$?"
            set -e
            destination=".proofs/livekit-js-sdk-release/$version-$modality"
            mkdir -p "$(dirname "$destination")"
            if [ -d .proofs/simulation-e2e ]; then
              mv .proofs/simulation-e2e "$destination"
            fi
            return "$status"
          }

          for version in 1.5.5 1.6.4 1.7.1; do
            for modality in chat voice; do
              run_case "$version" "$modality"
            done
          done

      - name: Upload redacted full-path proof manifests
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: livekit-js-sdk-release-full-path-${{ github.sha }}
          path: .proofs/livekit-js-sdk-release/**/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Use the minimum supported Node.js release
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Inspect and install the built package
        run: |
          set -e
          tarball="${{ steps.pack.outputs.tarball }}"
          dir="$(dirname "$tarball")"
          tar -tzf "$tarball" > "$dir/files.txt"
          for required in \
            package/dist/index.js \
            package/dist/index.d.ts \
            package/LICENSE \
            package/README.md; do
            grep -Fx "$required" "$dir/files.txt" > /dev/null || {
              echo "Packed SDK is missing $required." >&2
              exit 1
            }
          done
          if grep -F '.tsbuildinfo' "$dir/files.txt"; then
            echo "Packed SDK contains a TypeScript build cache." >&2
            exit 1
          fi
          if tar -xOzf "$tarball" package/package.json | grep -F 'workspace:'; then
            echo "Packed SDK contains a workspace dependency range." >&2
            exit 1
          fi
          if tar -xOzf "$tarball" | grep -E 'egma_sk_[A-Za-z0-9_-]{43}'; then
            echo "Packed SDK contains an Egma API key." >&2
            exit 1
          fi
          mkdir "$dir/clean"
          cd "$dir/clean"
          npm init -y > /dev/null
          npm install "$tarball" \
            "@livekit/agents@1.7.1" \
            "@livekit/rtc-node@^0.13.34" \
            "zod@^4.1.8" \
            --no-audit --no-fund
          node --input-type=module -e \
            'import { monitor, simulation } from "@egma/livekit"; if (typeof simulation !== "function" || typeof monitor !== "function") process.exit(1); delete process.env.EGMA_URL; delete process.env.EGMA_API_KEY; monitor({ job: { room: { name: "egma-sim-release-smoke" } } });'

      - name: Restore the publishing toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install the trusted-publishing npm client
        run: npm install --global npm@11.5.1

      - name: Refuse a manifest npm would silently rewrite
        run: |
          set -e
          status=0
          out="$(npm publish --dry-run --tag "$NPM_TAG" "${{ steps.pack.outputs.tarball }}" 2>&1)" || status=$?
          echo "$out"
          if echo "$out" | grep -qi "auto-corrected some errors"; then
            echo "::error::npm would rewrite the packed manifest before publishing." >&2
            exit 1
          fi
          exit "$status"

      - name: Publish to npm
        run: python3 .github/package_release.py publish-npm livekit-js "${{ steps.pack.outputs.tarball }}"
