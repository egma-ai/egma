name: Release Python SDK

# A version increase on main creates its release tag and publishes the SDK.
# Manual python-sdk-v<version> tags use the same release checks.
#
# PyPI must trust this repository, workflow, and `pypi` environment. GitHub
# then supplies one short-lived OIDC credential. No long-lived PyPI token is
# stored in this repository.

on:
  push:
    branches:
      - main
    tags:
      - "python-sdk-v*"

concurrency:
  group: release-python-sdk
  queue: max

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      should_publish: ${{ steps.release.outputs.should_publish }}
      version: ${{ steps.release.outputs.version }}
      npm_tag: ${{ steps.release.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Compare versions and prepare the release tag
        id: release
        run: python3 .github/package_release.py prepare python

  release:
    name: Verify and publish
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    environment:
      name: pypi
      url: https://pypi.org/p/egma
    permissions:
      contents: read
      id-token: write

    steps:
      # Every action is pinned to the commit behind its release tag. This job
      # holds publication authority, so a moved tag must not change its code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@681c641aba71e4a1c380be3ab5e12ad51f415867 # v7.1.6
        with:
          # Match the package's declared uv-build minor. A release must not
          # silently change build backends because the CLI moved forward.
          version: "0.11.33"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Make the native build toolchain available
        run: ./.github/native-toolchain.sh

      - run: pnpm install --frozen-lockfile

      - name: Build the web API client
        run: pnpm --filter @egma/platform-api build

      - name: Check the release matches both package versions
        working-directory: sdks/python
        run: |
          set -e
          packaged="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          workspace="$(python -c 'import json; print(json.load(open("package.json"))["version"])')"
          if [ "$RELEASE_VERSION" != "$packaged" ] || [ "$packaged" != "$workspace" ]; then
            echo "Release says $RELEASE_VERSION, pyproject.toml says $packaged, and package.json says $workspace." >&2
            exit 1
          fi
          echo "Releasing egma $packaged."

      - name: Lint the Python SDK
        working-directory: sdks/python
        run: |
          uv sync --frozen
          uv run --frozen ruff check src tests

      - name: Test the LiveKit fixture
        working-directory: fixtures/livekit-dumb-agent
        run: |
          uv sync --frozen
          uv run --frozen ruff check .
          uv run --frozen pytest

      - name: Build the wheel and source distribution
        working-directory: sdks/python
        run: uv build --out-dir dist

      - name: Verify the wheel against supported LiveKit versions in parallel
        run: |
          wheel="$(find sdks/python/dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          python3 .github/livekit_compatibility.py python "$wheel"

      - name: Start the full-path evidence stores
        run: pnpm db:up

      - name: Sync the shipped simulator
        working-directory: apps/simulator
        run: uv sync --frozen

      - name: Install the voice sentence tokenizer
        working-directory: apps/simulator
        run: uv run python -m nltk.downloader punkt_tab

      - name: Report the browser
        run: google-chrome --version

      - name: Warm the object-store image
        run: docker pull "$(awk '/^  minio:/{found=1} found && /image:/{print $2; exit}' docker-compose.yml)"

      - name: Prove the exact wheel through storage and browser-visible grades
        env:
          LIVEKIT_E2E_OPENAI_API_KEY: ${{ secrets.LIVEKIT_E2E_OPENAI_API_KEY }}
        run: |
          set -e
          if [ -z "$LIVEKIT_E2E_OPENAI_API_KEY" ]; then
            echo "LIVEKIT_E2E_OPENAI_API_KEY is required before this wheel can publish." >&2
            exit 1
          fi
          wheel="$(realpath "$(find sdks/python/dist -maxdepth 1 -name '*.whl' -print -quit)")"
          version="1.7.1"

          run_case() {
            modality="$1"
            rm -rf .proofs/simulation-e2e
            set +e
            EGMA_REQUIRE_OBJECT_STORAGE=1 \
              SIMULATION_E2E_LIVE=1 \
              SIMULATION_E2E_LANGUAGE=python \
              SIMULATION_E2E_MODALITY="$modality" \
              SIMULATION_E2E_ACCESS=project_credentials \
              SIMULATION_E2E_MOCKS=on \
              LIVEKIT_E2E_PYTHON_WHEEL="$wheel" \
              LIVEKIT_E2E_PYTHON_AGENTS_VERSION="$version" \
              pnpm exec vitest run --project fast \
                apps/api/test/simulator-conversation.test.ts \
                --testNamePattern "runs a packaged LiveKit worker"
            status="$?"
            set -e
            destination=".proofs/python-sdk-release/$version-$modality"
            mkdir -p "$(dirname "$destination")"
            if [ -d .proofs/simulation-e2e ]; then
              mv .proofs/simulation-e2e "$destination"
            fi
            return "$status"
          }

          for modality in chat voice; do
            run_case "$modality"
          done

      - name: Upload redacted full-path proof manifests
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-sdk-release-full-path-${{ github.sha }}
          path: .proofs/python-sdk-release/**/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Prove the built wheel in a clean environment
        working-directory: sdks/python
        run: |
          set -e
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          clean="$(mktemp -d)"
          uv venv --python 3.11 "$clean/venv"
          uv pip install --python "$clean/venv/bin/python" \
            "$wheel" "livekit-agents[openai]==1.6.6"
          "$clean/venv/bin/python" - <<'PY'
          import asyncio
          import os
          from importlib.metadata import version
          from egma import monitor, simulation
          from egma import export
          from livekit import agents


          class Job:
              metadata = ""


          class Context:
              job = Job()

              def __init__(self):
                  self.callbacks = []

              def add_shutdown_callback(self, callback):
                  self.callbacks.append(callback)

          expected = os.environ["RELEASE_VERSION"]
          assert version("egma") == expected
          assert version("openai").split(".", 1)[0] == "2"
          assert agents.JobContext is not None
          assert callable(simulation)
          assert callable(monitor)
          context = Context()
          monitor(
              context,
              endpoint="http://127.0.0.1:9",
              api_key="egma_sk_" + "r" * 43,
          )
          assert export._state is not None
          assert export._livekit_provider() is export._state.provider
          assert len(context.callbacks) == 1
          asyncio.run(context.callbacks[0]())
          PY

      - name: Inspect the distributions
        working-directory: sdks/python
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from tarfile import open as open_tar
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          source = next(Path("dist").glob("*.tar.gz"))
          with ZipFile(wheel) as archive:
              wheel_names = set(archive.namelist())
          with open_tar(source) as archive:
              source_names = set(archive.getnames())

          required = {
              "egma/__init__.py",
              "egma/export.py",
              "egma/monitoring.py",
              "egma/room.py",
              "egma/simulation_room.py",
          }
          missing = sorted(required - wheel_names)
          if missing:
              raise SystemExit(f"wheel is missing: {', '.join(missing)}")
          if not any(
              name.endswith(".dist-info/licenses/LICENSE")
              for name in wheel_names
          ):
              raise SystemExit("wheel is missing LICENSE")
          if not any(name.endswith("/LICENSE") for name in source_names):
              raise SystemExit("source distribution is missing LICENSE")

          secret = re.compile(rb"egma_sk_[A-Za-z0-9_-]{43}")
          with ZipFile(wheel) as archive:
              for name in archive.namelist():
                  if secret.search(archive.read(name)):
                      raise SystemExit(f"wheel contains an Egma API key: {name}")
          with open_tar(source) as archive:
              for member in archive.getmembers():
                  if not member.isfile():
                      continue
                  extracted = archive.extractfile(member)
                  if extracted is not None and secret.search(extracted.read()):
                      raise SystemExit(
                          f"source distribution contains an Egma API key: {member.name}"
                      )
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: sdks/python/dist/
          skip-existing: true
