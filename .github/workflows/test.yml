name: Tests

# What runs, and when.
#
# Every pull request gets the cheap lane: lint, typecheck, and `test:fast` —
# the unit, database, API, grader, CLI and web tests, with no Chrome and no web
# application. That is the loop a change is written in, and it is what a review
# needs to see.
#
# A pull request **into `main`** gets everything: the cheap lane plus the
# real-browser proof, the simulator tests, the SDK tests and the fixture
# tests. That is the handoff gate, and nothing in it is allowed to skip.
#
# A push to `main` runs the same jobs again on the tree `main` now owns.
# One `Deploy` job then waits for all of them. This keeps the test names identical
# on pull requests and main, and gives production one gate and one owner.
#
# The split is deliberate rather than thrifty. An effort lands as a dozen pull
# requests into one integration branch and then one pull request from that
# branch into `main`. Running the browser proof and separate SDK suites on each
# of the dozen would pay for the complete proof twelve times and gate on it
# once — which is the wrong way round. So the trigger is broad and the scope
# depends on the branch being merged into: `github.base_ref`, which on a pull
# request is the branch the change is going to.
#
# `vitest.config.ts` owns what each lane selects, as two Vitest projects. The
# fast lane declares no `include` — it is Vitest's own default search minus the
# one real-browser file — so a new test file joins it by existing. Every run
# prints its lane and Vitest labels each file with the project it came from, so
# a green tick can always be read back to the proof it stands for.
#
# Every job runs on a Blacksmith runner, which the organization already pays
# for and which carries GitHub's own runner image — so docker, the compose
# services and the official cache actions all behave as they did. One thing it
# does not carry is `node-gyp`, which this repository needs to install at all;
# `.github/native-toolchain.sh` is that gap and nothing else. The release
# workflow beside this one stays on `ubuntu-latest` on purpose: it holds npm
# publishing authority, and moving that is a separate decision.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # A newer push makes an older pull-request run pointless. Main is different:
  # its run may already be changing production, so later merges wait their turn.
  # Keep the old production group name so the first new run also waits for any
  # `Deploy platform` run that started before this workflow replaced it.
  group: ${{ github.ref == 'refs/heads/main' && 'deploy-platform' || format('tests-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint and typecheck
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Say which lanes this run uses
        # So a tick can be read back to the proof it stands for, rather than to
        # whichever jobs happened to be enabled that day.
        env:
          BASE: ${{ github.base_ref }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" = "refs/heads/main" ]; then
            echo "On main — the complete proof runs before Deploy."
          elif [ "$BASE" = "main" ]; then
            echo "Into main — the complete proof: lint, typecheck, the fast lane, the browser lane, the simulator, SDK and fixture tests."
          else
            echo "Into $BASE — the cheap lane: lint, typecheck and the fast lane."
            echo "The browser lane and the complete SDK suites run at the gate into main."
          fi

      # Actions are pinned to a commit rather than a tag, the way
      # `release-cli.yml` pins them: a tag can be moved, and a workflow that
      # decides whether a change may merge must not change under it. The
      # trailing comment is the human-readable version each SHA is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        # Version comes from "packageManager" in the root package.json.

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Make the native build toolchain available
        # Blacksmith's image carries no node-gyp, and `node-pty` publishes no
        # Linux prebuild — so the install below compiles it, and without a
        # compiler it dies as a bare "node-gyp: not found" underneath a package
        # name. A gap in this runner image, not a requirement of this
        # repository: `.github/native-toolchain.sh` says why in full, and
        # installs nothing on an image that already has the four tools.
        run: ./.github/native-toolchain.sh

      - run: pnpm install --frozen-lockfile

      - name: Lint
        # The data-access boundary rules. `pnpm typecheck` runs these too, but
        # a boundary violation reported on its own line is read in a second.
        run: pnpm lint

      - name: Typecheck
        # Builds the workspace, then the tests against it, then the web app.
        run: pnpm typecheck

  fast:
    name: Fast lane
    # Four CPUs guarantee the two Vitest workers below while leaving Postgres,
    # ClickHouse and the runner room to work. The old two-CPU tier sometimes got
    # a free capacity upgrade and sometimes did not, so identical suites varied
    # between one worker and two.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Make the native build toolchain available
        # Blacksmith's image carries no node-gyp, and `node-pty` publishes no
        # Linux prebuild — so the install below compiles it, and without a
        # compiler it dies as a bare "node-gyp: not found" underneath a package
        # name. A gap in this runner image, not a requirement of this
        # repository: `.github/native-toolchain.sh` says why in full, and
        # installs nothing on an image that already has the four tools.
        run: ./.github/native-toolchain.sh

      - run: pnpm install --frozen-lockfile

      - name: Install uv and sync the simulator
        # The fast lane is not all TypeScript. `apps/api/test/simulator-
        # conversation.test.ts` spawns the real shipped simulator — `uv run
        # --frozen egma-simulator`, in `apps/simulator` — and drives a run
        # through it to a verdict. Without uv that child never starts, and the
        # pass waits sixty seconds for a simulation nothing was ever going to
        # conduct.
        #
        # The sync is separate so the Python install is paid here rather than
        # inside that sixty-second window. It is the same pair of steps
        # `egma-dev-setup` runs on a developer's machine.
        run: pipx install uv && uv sync --frozen
        working-directory: apps/simulator

      - name: Warm the object-store image
        # Only where a skip is not allowed. The recording suites start a MinIO
        # of their own from the image the compose file deploys, so pulling it
        # through compose keeps one version in one place.
        if: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' }}
        # **Compose interpolates every service before it pulls one**, and the
        # self-hosted phone platform declares ten variables with no default —
        # the LiveKit pair, the recording store's four credentials, the auth
        # secret. So `docker compose pull minio` fails on a variable that has
        # nothing to do with MinIO, before any network call happens.
        #
        # Those guards are right where they are: a self-hoster who has not run
        # `egma self-host up` should be told which variable by name rather than
        # handed a half-started platform. CI is not that person and starts none
        # of those services. Placeholders would work today and break on the
        # eleventh variable, so this does not use them.
        #
        # The tag still lives in one place. This reads it out of the compose
        # file rather than repeating it, so the image CI warms stays the image
        # the compose file deploys.
        run: docker pull "$(awk '/^  minio:/{found=1} found && /image:/{print $2; exit}' docker-compose.yml)"

      - name: Run the fast lane
        # PostgreSQL and ClickHouse come up inside `test:fast`, which is also
        # what a developer runs, so CI and a laptop prove the same thing.
        env:
          # At the gate, a recording suite that quietly skipped because no
          # object store could be started would report the opposite of what
          # happened. Everywhere else the skip is the promise that contributing
          # costs no new infrastructure.
          EGMA_REQUIRE_OBJECT_STORAGE: ${{ (github.ref == 'refs/heads/main' || github.base_ref == 'main') && '1' || '' }}
        run: |
          node -e 'const os = require("node:os"); console.log(`Fast Lane capacity: ${os.availableParallelism()} CPUs, 2 Vitest workers`);'
          pnpm test:fast

  browser:
    # **One job, and never sharded.** The real-browser proof is one ordered
    # file on purpose: two Next development servers compile into one
    # `apps/web/.next` and each ends up serving half of the other's build. A
    # matrix here would not make it faster, it would make it wrong — see
    # `apps/api/test/support/instance.ts` and `apps/web/tools/output-lock.ts`.
    name: Browser lane (one job, never sharded)
    if: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Make the native build toolchain available
        # Blacksmith's image carries no node-gyp, and `node-pty` publishes no
        # Linux prebuild — so the install below compiles it, and without a
        # compiler it dies as a bare "node-gyp: not found" underneath a package
        # name. A gap in this runner image, not a requirement of this
        # repository: `.github/native-toolchain.sh` says why in full, and
        # installs nothing on an image that already has the four tools.
        run: ./.github/native-toolchain.sh

      - run: pnpm install --frozen-lockfile

      - name: Report the browser
        # This repository depends on `playwright-core` and downloads no
        # browser, so the proof runs against the Chrome the runner image
        # already has. Printed here so a runner without one fails on this line
        # rather than a minute later inside a launcher.
        run: google-chrome --version

      - name: Warm the object-store image
        # The recording flows start a MinIO of their own from the image the
        # compose file deploys. Pulling it first keeps a cold registry out of
        # the suite's own timeout.
        #
        # Pulled by tag rather than through compose, for the reason the fast
        # lane's own step gives: compose interpolates every service before it
        # pulls one, and the self-host platform's variables have no defaults.
        run: docker pull "$(awk '/^  minio:/{found=1} found && /image:/{print $2; exit}' docker-compose.yml)"

      - name: Run the browser lane
        env:
          # The whole reason this job exists is to prove that a recording can
          # be signed, fetched and played. A run that went green because no
          # object store started would prove the opposite, so a missing store
          # is a failure here rather than a skip.
          EGMA_REQUIRE_OBJECT_STORAGE: "1"
        run: pnpm test:browser

  simulator:
    name: Simulator tests
    if: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Make the native build toolchain available
        # Blacksmith's image carries no node-gyp, and `node-pty` publishes no
        # Linux prebuild — so the install below compiles it, and without a
        # compiler it dies as a bare "node-gyp: not found" underneath a package
        # name. A gap in this runner image, not a requirement of this
        # repository: `.github/native-toolchain.sh` says why in full, and
        # installs nothing on an image that already has the four tools.
        run: ./.github/native-toolchain.sh

      - run: pnpm install --frozen-lockfile

      - name: Install uv
        # The real toolchain of every Python part of this repository. `uv run
        # --frozen` brings its own interpreter and installs the locked
        # dependencies, so nothing here sets up Python separately.
        run: pipx install uv

      - name: Run the simulator tests
        run: pnpm test:simulator

  sdk:
    name: SDK tests
    if: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Make the native build toolchain available
        # Blacksmith's image carries no node-gyp, and `node-pty` publishes no
        # Linux prebuild — so the install below compiles it, and without a
        # compiler it dies as a bare "node-gyp: not found" underneath a package
        # name. A gap in this runner image, not a requirement of this
        # repository: `.github/native-toolchain.sh` says why in full, and
        # installs nothing on an image that already has the four tools.
        run: ./.github/native-toolchain.sh

      - run: pnpm install --frozen-lockfile

      - name: Install the Python SDK toolchain
        run: pipx install uv

      - name: Run the Python and JavaScript SDK tests
        run: pnpm test:sdk

  livekit-js-compatibility:
    name: LiveKit JS ${{ matrix.livekit }} compatibility
    if: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        # 1.5.0 is the mock-tool floor. 1.5.5 is the monitoring floor.
        # 1.6.4 is the exact Rentlyx pin. The remaining lanes catch a break at
        # each supported minor boundary and at the current upper edge.
        livekit: ["1.5.0", "1.5.5", "1.6.0", "1.6.4", "1.7.0", "1.7.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Make the native build toolchain available
        run: ./.github/native-toolchain.sh

      - run: pnpm install --frozen-lockfile

      - name: Build and pack the SDK
        id: pack
        run: |
          pnpm --filter @egma/livekit build
          dir="$(mktemp -d)"
          pnpm --config.node-linker=hoisted \
            --filter @egma/livekit \
            pack --pack-destination "$dir"
          tarball="$(find "$dir" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Verify the packed SDK with LiveKit ${{ matrix.livekit }}
        run: >-
          node sdks/livekit-js/test/verify-packed-compatibility.mjs
          "${{ steps.pack.outputs.tarball }}"
          "${{ matrix.livekit }}"

  fixture:
    name: Fixture agent tests
    if: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Make the native build toolchain available
        # Blacksmith's image carries no node-gyp, and `node-pty` publishes no
        # Linux prebuild — so the install below compiles it, and without a
        # compiler it dies as a bare "node-gyp: not found" underneath a package
        # name. A gap in this runner image, not a requirement of this
        # repository: `.github/native-toolchain.sh` says why in full, and
        # installs nothing on an image that already has the four tools.
        run: ./.github/native-toolchain.sh

      - run: pnpm install --frozen-lockfile

      - name: Install uv
        run: pipx install uv

      - name: Run the fixture agent tests
        run: pnpm test:fixture

  deploy:
    name: Deploy
    needs: [checks, fast, browser, simulator, sdk, livekit-js-compatibility, fixture]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      DEPLOY_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      REGISTRY: ${{ vars.ECR_REGISTRY }}
      INSTANCE: ${{ vars.PLATFORM_INSTANCE_ID }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The path decision compares this tree with the last green main run.
          fetch-depth: 0

      - name: Decide what this push deploys
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "platform=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "Dispatched by hand: the whole deployment runs."
            exit 0
          fi
          base=$(curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&status=success&per_page=100" \
            | python3 -c 'import json,sys; runs=json.load(sys.stdin).get("workflow_runs",[]); print(next((r["head_sha"] for r in runs if r.get("event") in {"push", "workflow_dispatch"} and r.get("name") in {"Tests", "Deploy platform"}), ""))')
          if [ -n "$base" ]; then
            echo "Diffing against the last successful main test/deploy run: $base"
          else
            echo "platform=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "No successful main test/deploy run found: the whole deployment runs."
            exit 0
          fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "platform=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "No usable base commit: the whole deployment runs."
            exit 0
          fi
          changed=$(git diff --name-only "$base" "${{ github.sha }}")
          printf 'Changed:\n%s\n' "$changed"
          platform=false
          web=false
          while IFS= read -r path; do
            case "$path" in
              apps/api/*|apps/grader/*|apps/simulator/*|packages/*) platform=true ;;
              docker-compose.yml|docker-compose.managed.yml|.env.example) platform=true ;;
              pnpm-lock.yaml|pnpm-workspace.yaml|package.json|tsconfig.base.json) platform=true ;;
              .github/workflows/test.yml) platform=true ;;
              apps/web/*|tools/*) web=true ;;
            esac
          done <<< "$changed"
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          if [ "$platform" = "true" ]; then
            echo "Platform paths changed: deploy the platform, then the web."
          elif [ "$web" = "true" ]; then
            echo "Only the web changed."
          else
            echo "Nothing here deploys."
          fi

      - name: Check the platform deployment is configured
        if: steps.decide.outputs.platform == 'true'
        run: |
          missing=""
          for v in DEPLOY_ROLE REGISTRY INSTANCE; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "Set these repository variables before deploying:$missing" >&2
            echo "AWS_DEPLOY_ROLE_ARN is the role this workflow assumes." >&2
            echo "ECR_REGISTRY is <account>.dkr.ecr.<region>.amazonaws.com." >&2
            echo "PLATFORM_INSTANCE_ID is the box to restart." >&2
            exit 1
          fi

      - name: Take a short-lived AWS credential
        if: steps.decide.outputs.platform == 'true'
        run: |
          set -euo pipefail
          token=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          creds=$(aws sts assume-role-with-web-identity \
            --role-arn "$DEPLOY_ROLE" \
            --role-session-name "deploy-${GITHUB_RUN_ID}" \
            --web-identity-token "$token" \
            --duration-seconds 3600 \
            --query Credentials --output json)
          python3 - "$creds" >> "$GITHUB_ENV" <<'PY'
          import json, sys
          c = json.loads(sys.argv[1])
          print(f"AWS_ACCESS_KEY_ID={c['AccessKeyId']}")
          print(f"AWS_SECRET_ACCESS_KEY={c['SecretAccessKey']}")
          print(f"AWS_SESSION_TOKEN={c['SessionToken']}")
          PY
          echo "::add-mask::$(echo "$creds" | python3 -c 'import json,sys; print(json.load(sys.stdin)["SecretAccessKey"])')"
          echo "::add-mask::$(echo "$creds" | python3 -c 'import json,sys; print(json.load(sys.stdin)["SessionToken"])')"

      - name: Build and push the three images
        if: steps.decide.outputs.platform == 'true'
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"
          for app in api simulator grader; do
            echo "::group::$app"
            docker build -f "apps/$app/Dockerfile" \
              -t "$REGISTRY/egma/$app:$GITHUB_SHA" \
              -t "$REGISTRY/egma/$app:latest" .
            docker push "$REGISTRY/egma/$app:$GITHUB_SHA"
            docker push "$REGISTRY/egma/$app:latest"
            echo "::endgroup::"
          done

      - name: Replace what is running, and wait for its health checks
        if: steps.decide.outputs.platform == 'true'
        run: |
          set -euo pipefail
          ACCOUNT="${REGISTRY%%.*}"
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --document-name AWS-RunShellScript \
            --comment "deploy $GITHUB_SHA" \
            --parameters commands="aws s3 sync s3://egma-deploy-${ACCOUNT}/deployment /opt/egma/deployment --delete && bash /opt/egma/deployment/deploy.sh $GITHUB_SHA" \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"
          for _ in $(seq 1 120); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Undeliverable|Terminated) break ;;
            esac
            sleep 10
          done
          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$INSTANCE" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' \
            --output text
          status=$(aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$INSTANCE" \
            --query Status --output text)
          [ "$status" = "Success" ] || { echo "Deployment failed: $status" >&2; exit 1; }

      - name: Yield when a newer merge owns the web deployment
        id: yield
        if: steps.decide.outputs.platform == 'true' || steps.decide.outputs.web == 'true'
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          head=$(git rev-parse origin/main)
          if [ "$head" = "${{ github.sha }}" ]; then
            echo "fire=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          deployable=false
          while IFS= read -r path; do
            case "$path" in
              apps/api/*|apps/grader/*|apps/simulator/*|packages/*) deployable=true ;;
              docker-compose.yml|docker-compose.managed.yml|.env.example) deployable=true ;;
              pnpm-lock.yaml|pnpm-workspace.yaml|package.json|tsconfig.base.json) deployable=true ;;
              .github/workflows/test.yml) deployable=true ;;
              apps/web/*|tools/*) deployable=true ;;
            esac
          done <<< "$(git diff --name-only "${{ github.sha }}" "$head")"
          if [ "$deployable" = "true" ]; then
            echo "main moved to $head with deployable changes; that run owns the web deployment."
            echo "fire=false" >> "$GITHUB_OUTPUT"
          else
            echo "main moved only by changes that do not deploy; this run still owns the web deployment."
            echo "fire=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tell Vercel to ship
        if: >-
          (steps.decide.outputs.platform == 'true' || steps.decide.outputs.web == 'true') &&
          steps.yield.outputs.fire == 'true'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL is not set, so the web cannot deploy." >&2
            exit 1
          fi
          curl -fsS -X POST "$HOOK" >/dev/null
          echo "Vercel told to ship the web application."
