name: Tests

# All pull requests run lint, typecheck, and the fast tests. Pull requests
# into main and pushes to main also run browser, simulator, SDK, and fixture
# tests. Deployment on main waits for the required jobs.
# Vitest defines test discovery and separates the browser acceptance file.
# CI uses the native-toolchain script when dependencies need compilation.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: Replace production and ship the web after publishing the images
        required: true
        type: boolean
        default: true

concurrency:
  # A newer push makes an older pull-request run pointless. Main is different:
  # its run may already be changing production, so later merges wait their turn.
  # Keep the old production group name so the first new run also waits for any
  # `Deploy platform` run that started before this workflow replaced it.
  group: ${{ github.ref == 'refs/heads/main' && 'deploy-platform' || format('tests-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint and typecheck
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Say which lanes this run uses
        # So a tick can be read back to the proof it stands for, rather than to
        # whichever jobs happened to be enabled that day.
        env:
          BASE: ${{ github.base_ref }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" = "refs/heads/main" ]; then
            echo "On main — the complete proof runs before Deploy."
          elif [ "$BASE" = "main" ]; then
            echo "Into main — the complete proof: lint, typecheck, the fast lane, the browser lane, the simulator, SDK and fixture tests."
          else
            echo "Into $BASE — the cheap lane: lint, typecheck and the fast lane."
            echo "The browser lane and the complete SDK suites run at the gate into main."
          fi

      # Actions are pinned to a commit rather than a tag, the way
      # `release-cli.yml` pins them: a tag can be moved, and a workflow that
      # decides whether a change may merge must not change under it. The
      # trailing comment is the human-readable version each SHA is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        # Version comes from "packageManager" in the root package.json.

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Make the native build toolchain available
        # Blacksmith's image carries no node-gyp, and `node-pty` publishes no
        # Linux prebuild — so the install below compiles it, and without a
        # compiler it dies as a bare "node-gyp: not found" underneath a package
        # name. A gap in this runner image, not a requirement of this
        # repository: `.github/native-toolchain.sh` says why in full, and
        # installs nothing on an image that already has the four tools.
        run: ./.github/native-toolchain.sh

      - run: pnpm install --frozen-lockfile

      - name: Lint
        # The data-access boundary rules. `pnpm typecheck` runs these too, but
        # a boundary violation reported on its own line is read in a second.
        run: pnpm lint

      - name: Typecheck
        # Builds the workspace, then the tests against it, then the web app.
        run: pnpm typecheck

      - name: Check documentation and generated API reference
        run: |
          pnpm docs:check
          pnpm docs:build

      - name: Test CI and release helpers
        run: python3 -B -m unittest discover -s .github -p 'test_*.py'

  fast:
    name: Fast lane
    # Four CPUs guarantee the two Vitest workers below while leaving Postgres,
    # ClickHouse and the runner room to work. The old two-CPU tier sometimes got
    # a free capacity upgrade and sometimes did not, so identical suites varied
    # between one worker and two.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Make the native build toolchain available
        # Blacksmith's image carries no node-gyp, and `node-pty` publishes no
        # Linux prebuild — so the install below compiles it, and without a
        # compiler it dies as a bare "node-gyp: not found" underneath a package
        # name. A gap in this runner image, not a requirement of this
        # repository: `.github/native-toolchain.sh` says why in full, and
        # installs nothing on an image that already has the four tools.
        run: ./.github/native-toolchain.sh

      - run: pnpm install --frozen-lockfile

      - name: Install uv and sync the simulator
        # The fast lane starts the shipped Python simulator in an API integration
        # test. Install and sync it here so dependency setup does not consume the
        # test's startup timeout.
        run: pipx install uv && uv sync --frozen
        working-directory: apps/simulator

      - name: Warm the object-store image
        # Only where a skip is not allowed. The recording suites start a MinIO
        # of their own from the image the compose file deploys, so pulling it
        # through compose keeps one version in one place.
        if: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' }}
        # Pull the image directly to avoid interpolating unrelated required Compose
        # settings. Read its tag from Compose so the warmed image matches deployment.
        run: docker pull "$(awk '/^  minio:/{found=1} found && /image:/{print $2; exit}' docker-compose.yml)"

      - name: Run the fast lane
        # PostgreSQL and ClickHouse come up inside `test:fast`, which is also
        # what a developer runs, so CI and a laptop prove the same thing.
        env:
          # At the gate, a recording suite that quietly skipped because no
          # object store could be started would report the opposite of what
          # happened. Everywhere else the skip is the promise that contributing
          # costs no new infrastructure.
          EGMA_REQUIRE_OBJECT_STORAGE: ${{ (github.ref == 'refs/heads/main' || github.base_ref == 'main') && '1' || '' }}
        run: |
          node -e 'const os = require("node:os"); console.log(`Fast Lane capacity: ${os.availableParallelism()} CPUs, 2 Vitest workers`);'
          pnpm test:fast

  browser:
    # **One job, and never sharded.** The real-browser proof is one ordered
    # file on purpose: two Next development servers compile into one
    # `apps/web/.next` and each ends up serving half of the other's build. A
    # matrix here would not make it faster, it would make it wrong — see
    # `apps/api/test/support/instance.ts` and `apps/web/tools/output-lock.ts`.
    name: Browser lane (one job, never sharded)
    if: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Make the native build toolchain available
        # Blacksmith's image carries no node-gyp, and `node-pty` publishes no
        # Linux prebuild — so the install below compiles it, and without a
        # compiler it dies as a bare "node-gyp: not found" underneath a package
        # name. A gap in this runner image, not a requirement of this
        # repository: `.github/native-toolchain.sh` says why in full, and
        # installs nothing on an image that already has the four tools.
        run: ./.github/native-toolchain.sh

      - run: pnpm install --frozen-lockfile

      - name: Report the browser
        # This repository depends on `playwright-core` and downloads no
        # browser, so the proof runs against the Chrome the runner image
        # already has. Printed here so a runner without one fails on this line
        # rather than a minute later inside a launcher.
        run: google-chrome --version

      - name: Warm the object-store image
        # The recording flows start a MinIO of their own from the image the
        # compose file deploys. Pulling it first keeps a cold registry out of
        # the suite's own timeout.
        #
        # Pulled by tag rather than through compose, for the reason the fast
        # lane's own step gives: compose interpolates every service before it
        # pulls one, and the self-host platform's variables have no defaults.
        run: docker pull "$(awk '/^  minio:/{found=1} found && /image:/{print $2; exit}' docker-compose.yml)"

      - name: Run the browser lane
        env:
          # The whole reason this job exists is to prove that a recording can
          # be signed, fetched and played. A run that went green because no
          # object store started would prove the opposite, so a missing store
          # is a failure here rather than a skip.
          EGMA_REQUIRE_OBJECT_STORAGE: "1"
        run: pnpm test:browser

  simulator:
    name: Simulator tests
    if: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Make the native build toolchain available
        # Blacksmith's image carries no node-gyp, and `node-pty` publishes no
        # Linux prebuild — so the install below compiles it, and without a
        # compiler it dies as a bare "node-gyp: not found" underneath a package
        # name. A gap in this runner image, not a requirement of this
        # repository: `.github/native-toolchain.sh` says why in full, and
        # installs nothing on an image that already has the four tools.
        run: ./.github/native-toolchain.sh

      - run: pnpm install --frozen-lockfile

      - name: Install uv
        # The real toolchain of every Python part of this repository. `uv run
        # --frozen` brings its own interpreter and installs the locked
        # dependencies, so nothing here sets up Python separately.
        run: pipx install uv

      - name: Run the simulator tests
        run: pnpm test:simulator

  livekit-python-compatibility:
    name: LiveKit Python compatibility
    if: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' }}
    # Isolated Python environments run their core suites concurrently.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@681c641aba71e4a1c380be3ab5e12ad51f415867 # v7.1.6
        with:
          version: "0.11.33"

      - name: Lint the Python SDK
        working-directory: sdks/python
        run: uv run --frozen ruff check --config pyproject.toml src tests ../../.github/*.py

      - name: Build the Python SDK once
        id: pack
        run: |
          dir="$(mktemp -d)"
          uv build sdks/python --wheel --out-dir "$dir"
          wheel="$(find "$dir" -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          echo "wheel=$wheel" >> "$GITHUB_OUTPUT"

      - name: Verify the supported LiveKit versions in parallel
        run: python3 .github/livekit_compatibility.py python "${{ steps.pack.outputs.wheel }}"

  livekit-js-compatibility:
    name: LiveKit JS compatibility
    if: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' }}
    # Share checkout/build work; all six clean installs run concurrently.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Make the native build toolchain available
        run: ./.github/native-toolchain.sh

      - run: pnpm install --frozen-lockfile

      - name: Run the JavaScript SDK tests
        run: pnpm test:sdk:javascript

      - name: Build and pack the SDK
        id: pack
        run: |
          pnpm --filter @egma/livekit build
          dir="$(mktemp -d)"
          pnpm --config.node-linker=hoisted \
            --filter @egma/livekit \
            pack --pack-destination "$dir"
          tarball="$(find "$dir" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Verify all LiveKit versions in parallel
        run: python3 .github/livekit_compatibility.py javascript "${{ steps.pack.outputs.tarball }}"

  fixture:
    name: Fixture agent tests
    if: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Make the native build toolchain available
        # Blacksmith's image carries no node-gyp, and `node-pty` publishes no
        # Linux prebuild — so the install below compiles it, and without a
        # compiler it dies as a bare "node-gyp: not found" underneath a package
        # name. A gap in this runner image, not a requirement of this
        # repository: `.github/native-toolchain.sh` says why in full, and
        # installs nothing on an image that already has the four tools.
        run: ./.github/native-toolchain.sh

      - run: pnpm install --frozen-lockfile

      - name: Install uv
        run: pipx install uv

      - name: Run the fixture agent tests
        run: pnpm test:fixture

  livekit-e2e:
    name: LiveKit packaged end-to-end
    if: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' || github.event_name == 'workflow_dispatch' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@681c641aba71e4a1c380be3ab5e12ad51f415867 # v7.1.6
        with:
          version: "0.11.33"

      - name: Make the native build toolchain available
        run: ./.github/native-toolchain.sh

      - run: pnpm install --frozen-lockfile

      - name: Sync the shipped simulator
        working-directory: apps/simulator
        run: uv sync --frozen

      - name: Require the trusted model credential
        env:
          LIVEKIT_E2E_OPENAI_API_KEY: ${{ secrets.LIVEKIT_E2E_OPENAI_API_KEY }}
        run: |
          if [ -z "$LIVEKIT_E2E_OPENAI_API_KEY" ]; then
            echo "LIVEKIT_E2E_OPENAI_API_KEY is unavailable. A maintainer must run reviewed code in a trusted repository context before merge." >&2
            exit 1
          fi

      - name: Run packaged SDKs through LiveKit and the simulator
        env:
          LIVEKIT_E2E_OPENAI_API_KEY: ${{ secrets.LIVEKIT_E2E_OPENAI_API_KEY }}
        run: pnpm test:livekit-e2e

      - name: Upload redacted proof records
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: livekit-e2e-${{ github.sha }}
          path: .proofs/livekit-e2e/**/upload/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  deploy:
    name: Deploy
    needs: [checks, fast, browser, simulator, livekit-python-compatibility, livekit-js-compatibility, fixture, livekit-e2e]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      REPLACE_PRODUCTION: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy }}
      CLOUD_REPOSITORY: egma-ai/egma-cloud
      DEPLOYMENT_HEALTH_URL: ${{ vars.DEPLOYMENT_HEALTH_URL || 'https://app.egma.ai/health' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The path decision compares this tree with the last green main run.
          fetch-depth: 0

      - name: Decide what this push deploys
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "platform=true" >> "$GITHUB_OUTPUT"
            if [ "$REPLACE_PRODUCTION" = "true" ]; then
              echo "web=true" >> "$GITHUB_OUTPUT"
              echo "Dispatched by hand: the whole deployment runs."
            else
              echo "web=false" >> "$GITHUB_OUTPUT"
              echo "Dispatched by hand: build and publish the exact image tags only."
            fi
            exit 0
          fi
          base=$(curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&status=success&per_page=100" \
            | python3 -c 'import json,sys; runs=json.load(sys.stdin).get("workflow_runs",[]); print(next((r["head_sha"] for r in runs if r.get("event") in {"push", "workflow_dispatch"} and r.get("name") in {"Tests", "Deploy platform"}), ""))')
          if [ -n "$base" ]; then
            echo "Diffing against the last successful main test/deploy run: $base"
          else
            echo "platform=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "No successful main test/deploy run found: the whole deployment runs."
            exit 0
          fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "platform=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "No usable base commit: the whole deployment runs."
            exit 0
          fi
          changed=$(git diff --name-only "$base" "${{ github.sha }}")
          printf 'Changed:\n%s\n' "$changed"
          platform=false
          web=false
          while IFS= read -r path; do
            case "$path" in
              apps/api/*|apps/grader/*|apps/simulator/*|packages/*|ee/*) platform=true ;;
              docker-compose.yml|docker-compose.managed.yml|.env.example) platform=true ;;
              pnpm-lock.yaml|pnpm-workspace.yaml|package.json|tsconfig.base.json) platform=true ;;
              certificates/*|.github/ecr-image-exists.sh|.github/verify-platform-images.py|.github/workflows/test.yml|.github/workflows/build-platform-images.yml) platform=true ;;
              apps/web/*|tools/*) web=true ;;
            esac
          done <<< "$changed"
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          if [ "$platform" = "true" ]; then
            echo "Platform paths changed: deploy the platform, then the web."
          elif [ "$web" = "true" ]; then
            echo "Only the web changed."
          else
            echo "Nothing here deploys."
          fi

      - name: Check the platform deployment is configured
        if: steps.decide.outputs.platform == 'true'
        env:
          CLOUD_RELEASE_TOKEN: ${{ secrets.EGMA_CLOUD_RELEASE_TOKEN }}
        run: |
          missing=""
          if [ "$REPLACE_PRODUCTION" = "true" ]; then
            [ -n "$CLOUD_RELEASE_TOKEN" ] || missing="$missing EGMA_CLOUD_RELEASE_TOKEN"
            [ -n "$DEPLOYMENT_HEALTH_URL" ] || missing="$missing DEPLOYMENT_HEALTH_URL"
          fi
          if [ -n "$missing" ]; then
            echo "Set these repository variables before deploying:$missing" >&2
            exit 1
          fi
          if [ "$REPLACE_PRODUCTION" = "true" ]; then
            curl -fsS --max-time 20 \
              -H "Authorization: Bearer $CLOUD_RELEASE_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$CLOUD_REPOSITORY/actions/workflows/infrastructure.yml" >/dev/null || {
                echo "Configure the cloud workflow and EGMA_CLOUD_RELEASE_TOKEN with egma-cloud Contents:write and Actions:read before deployment." >&2
                exit 1
              }
          fi

      - name: Publish the immutable native images
        if: steps.decide.outputs.platform == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          title="Build platform images $GITHUB_SHA from $GITHUB_RUN_ID"
          gh workflow run build-platform-images.yml --ref main \
            -f "public_sha=$GITHUB_SHA" -f "source_run_id=$GITHUB_RUN_ID"
          run_id=""
          for _ in $(seq 1 30); do
            run_id=$(gh run list --workflow build-platform-images.yml \
              --event workflow_dispatch --limit 20 \
              --json databaseId,createdAt,displayTitle \
              --jq "[.[] | select(.createdAt >= \"$started\" and .displayTitle == \"$title\")][0].databaseId // empty")
            [ -n "$run_id" ] && break
            sleep 2
          done
          [ -n "$run_id" ] || { echo "The image publication run did not appear." >&2; exit 1; }
          gh run watch "$run_id" --exit-status

      - name: Ask the cloud repository to deploy this release
        if: steps.decide.outputs.platform == 'true' && env.REPLACE_PRODUCTION == 'true'
        env:
          CLOUD_RELEASE_TOKEN: ${{ secrets.EGMA_CLOUD_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          title="Release $GITHUB_SHA from $GITHUB_RUN_ID"
          payload=$(jq -cn \
            --arg sha "$GITHUB_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$GITHUB_RUN_ID" \
            '{event_type:"public-release",client_payload:{sha:$sha,source_repository:$repository,source_run_id:$run_id}}')
          curl -fsS -X POST \
            -H "Authorization: Bearer $CLOUD_RELEASE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$CLOUD_REPOSITORY/dispatches" \
            -d "$payload"
          run_id=""
          for _ in $(seq 1 30); do
            runs=$(curl -fsS \
              -H "Authorization: Bearer $CLOUD_RELEASE_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$CLOUD_REPOSITORY/actions/workflows/infrastructure.yml/runs?event=repository_dispatch&per_page=20")
            run_id=$(jq -r --arg title "$title" --arg started "$started" \
              '[.workflow_runs[] | select(.display_title == $title and .created_at >= $started)][0].id // empty' <<<"$runs")
            [ -n "$run_id" ] && break
            sleep 2
          done
          [ -n "$run_id" ] || { echo "The cloud release run did not appear." >&2; exit 1; }
          for _ in $(seq 1 540); do
            run=$(curl -fsS \
              -H "Authorization: Bearer $CLOUD_RELEASE_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$CLOUD_REPOSITORY/actions/runs/$run_id")
            status=$(jq -r '.status' <<<"$run")
            if [ "$status" = "completed" ]; then
              conclusion=$(jq -r '.conclusion' <<<"$run")
              [ "$conclusion" = "success" ] || { echo "Cloud release ended with $conclusion." >&2; exit 1; }
              break
            fi
            sleep 10
          done
          [ "${status:-}" = "completed" ] || { echo "Cloud release did not finish within 90 minutes." >&2; exit 1; }

      - name: Wait for this exact release identity
        if: steps.decide.outputs.platform == 'true' && env.REPLACE_PRODUCTION == 'true'
        run: |
          set -euo pipefail
          for _ in $(seq 1 540); do
            identity=$(curl -fsS "$DEPLOYMENT_HEALTH_URL" 2>/dev/null || true)
            if jq -e --arg sha "$GITHUB_SHA" \
              '.status == "ok" and .releaseSha == $sha' <<<"$identity" >/dev/null 2>&1; then
              echo "Deployment reports release $GITHUB_SHA."
              exit 0
            fi
            sleep 10
          done
          echo "Deployment did not report release $GITHUB_SHA within 90 minutes." >&2
          exit 1

      - name: Yield when a newer merge owns the web deployment
        id: yield
        if: >-
          env.REPLACE_PRODUCTION == 'true' &&
          (steps.decide.outputs.platform == 'true' || steps.decide.outputs.web == 'true')
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          head=$(git rev-parse origin/main)
          if [ "$head" = "${{ github.sha }}" ]; then
            echo "fire=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          deployable=false
          while IFS= read -r path; do
            case "$path" in
              apps/api/*|apps/grader/*|apps/simulator/*|packages/*|ee/*) deployable=true ;;
              docker-compose.yml|docker-compose.managed.yml|.env.example) deployable=true ;;
              pnpm-lock.yaml|pnpm-workspace.yaml|package.json|tsconfig.base.json) deployable=true ;;
              certificates/*|.github/ecr-image-exists.sh|.github/verify-platform-images.py|.github/workflows/test.yml|.github/workflows/build-platform-images.yml) deployable=true ;;
              apps/web/*|tools/*) deployable=true ;;
            esac
          done <<< "$(git diff --name-only "${{ github.sha }}" "$head")"
          if [ "$deployable" = "true" ]; then
            echo "main moved to $head with deployable changes; that run owns the web deployment."
            echo "fire=false" >> "$GITHUB_OUTPUT"
          else
            echo "main moved only by changes that do not deploy; this run still owns the web deployment."
            echo "fire=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tell Vercel to ship
        if: >-
          env.REPLACE_PRODUCTION == 'true' &&
          (steps.decide.outputs.platform == 'true' || steps.decide.outputs.web == 'true') &&
          steps.yield.outputs.fire == 'true'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL is not set, so the web cannot deploy." >&2
            exit 1
          fi
          curl -fsS -X POST "$HOOK" >/dev/null
          echo "Vercel told to ship the web application."
