name: Release CLI

# A version increase on main creates its release tag and publishes the CLI.
# Manual cli-v<version> tags use the same checks and npm trusted publisher.

on:
  push:
    branches:
      - main
    tags:
      - "cli-v*"

concurrency:
  group: release-cli
  queue: max

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      should_publish: ${{ steps.release.outputs.should_publish }}
      version: ${{ steps.release.outputs.version }}
      npm_tag: ${{ steps.release.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Compare versions and prepare the release tag
        id: release
        run: python3 .github/package_release.py prepare cli

  release:
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      NPM_TAG: ${{ needs.prepare.outputs.npm_tag }}
    steps:
      # Actions are pinned to a commit, not a tag. A tag can be moved; this job
      # holds npm publishing authority, so what it runs must not change under
      # it. The trailing comment is the human-readable version each SHA is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        # Version comes from "packageManager" in the root package.json.

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Report toolchain
        # Trusted publishing needs npm >= 11.5.1. Printed so a failure here is
        # readable rather than a bare 404 from the registry.
        run: node --version && npm --version && pnpm --version

      - run: pnpm install --frozen-lockfile

      - name: Check the release matches the package version
        run: |
          package="$(node -p "require('./apps/cli/package.json').name")"
          packaged="$(node -p "require('./apps/cli/package.json').version")"
          if [ "$package" != "egma-cli" ]; then
            echo "apps/cli/package.json names $package, expected egma-cli." >&2
            exit 1
          fi
          if [ "$RELEASE_VERSION" != "$packaged" ]; then
            echo "Release says $RELEASE_VERSION, apps/cli/package.json says $packaged." >&2
            exit 1
          fi
          echo "Releasing egma-cli $packaged."

      - name: Build
        # Root build is lint + tsc -b over every project the CLI is built from.
        run: pnpm build

      - name: Pack the public CLI
        id: pack
        # pnpm rewrites workspace dependency ranges to publishable versions.
        # npm does not. npm still performs the final publish for trusted OIDC.
        run: |
          set -e
          dir="$(mktemp -d)"
          pnpm --config.node-linker=hoisted --filter egma-cli pack --pack-destination "$dir"
          echo "tarball=$(ls "$dir"/*.tgz)" >> "$GITHUB_OUTPUT"

      - name: Prove new and upgraded installs
        # Pack once, then prove both user paths: a clean install and an upgrade
        # from the current public version. The upgrade proof catches invalid
        # registry metadata that a clean install of bundled files can hide.
        run: |
          set -e
          tarball="${{ steps.pack.outputs.tarball }}"
          dir="$(dirname "$tarball")"
          if tar -tzf "$tarball" | grep -q '^package/skills/'; then
            echo "The CLI tarball must not contain Agent Skills." >&2
            exit 1
          fi
          tar -xOf "$tarball" package/package.json > "$dir/packed-package.json"
          node -e '
            const manifest = require(process.argv[1]);
            const invalid = Object.entries(manifest.dependencies ?? {})
              .filter(([, spec]) => String(spec).startsWith("workspace:"));
            if (invalid.length > 0) {
              const names = invalid.map(([name]) => name).join(", ");
              console.error(`Published dependencies use workspace protocol: ${names}`);
              process.exit(1);
            }
          ' "$dir/packed-package.json"
          mkdir "$dir/clean"
          cd "$dir/clean"
          npm init -y > /dev/null
          npm install "$tarball" --no-audit --no-fund
          ./node_modules/.bin/egma --version
          mkdir "$dir/upgrade"
          cd "$dir/upgrade"
          npm init -y > /dev/null
          previous="$(npm view egma-cli version)"
          npm install "egma-cli@$previous" --no-audit --no-fund
          npm install "$tarball" --no-audit --no-fund
          ./node_modules/.bin/egma --version

      - name: Refuse a manifest npm would silently rewrite
        # npm quietly "corrects" a manifest on publish and ships the corrected
        # one. A bin path written "./dist/bin.js" gets dropped entirely, so the
        # package installs with no command — and the tarball check above still
        # passes, because a local tarball reads bin from its own package.json.
        # The dry run is the only place this shows up. Treat it as fatal.
        run: |
          set -e
          status=0
          out="$(npm publish --dry-run --tag "$NPM_TAG" "${{ steps.pack.outputs.tarball }}" 2>&1)" || status=$?
          echo "$out"
          if echo "$out" | grep -qi "auto-corrected some errors"; then
            echo "::error::npm would rewrite the packed manifest before publishing. Fix it rather than shipping the rewrite." >&2
            exit 1
          fi
          exit "$status"

      - name: Publish to npm
        # npm, not pnpm: OIDC trusted publishing lives in the npm CLI.
        # No NODE_AUTH_TOKEN — the OIDC exchange is the credential.
        run: python3 .github/package_release.py publish-npm cli "${{ steps.pack.outputs.tarball }}"
