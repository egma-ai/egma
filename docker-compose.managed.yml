# Use managed stores and media services instead of bundled containers:
#   docker compose -f docker-compose.yml -f docker-compose.managed.yml up -d
#
# Set DATABASE_URL and CLICKHOUSE_URL. Configure the media bridge with
# EGMA_SIMULATOR_LIVEKIT_URL, EGMA_SIMULATOR_LIVEKIT_API_KEY, and
# EGMA_SIMULATOR_LIVEKIT_API_SECRET.
#
# Recording upload and playback need separate configuration:
#   EGMA_SIMULATOR_S3_ENDPOINT           EGMA_BLOB_PUBLIC_URL
#   EGMA_SIMULATOR_S3_BUCKET             EGMA_BLOB_BUCKET
#   EGMA_SIMULATOR_S3_REGION             EGMA_BLOB_REGION
#   EGMA_SIMULATOR_S3_ACCESS_KEY_ID      EGMA_BLOB_ACCESS_KEY_ID
#   EGMA_SIMULATOR_S3_SECRET_ACCESS_KEY  EGMA_BLOB_SECRET_ACCESS_KEY
# Use a read-only playback credential. Also configure the API ingestion
# store settings from the base file; the disabled bucket job provisions none
# of these managed buckets, users, or policies.

services:
  # The seven containers a managed deployment does not run. A profile is what
  # takes a service out of the default set: `docker compose up` starts
  # everything with no profile, so naming one here is how a service becomes
  # opt-in without being deleted.
  postgres:
    profiles: [bundled]
  clickhouse:
    profiles: [bundled]
  minio:
    profiles: [bundled]
  minio-bucket:
    profiles: [bundled]
  livekit:
    profiles: [bundled]
  livekit-redis:
    profiles: [bundled]
  livekit-sip:
    profiles: [bundled]

  # The web application is here too, and for a different reason than the rest.
  # It is not replaced by a managed *store* — it is replaced by a managed
  # *host*, and one setting of its own goes with it: `EGMA_API_ORIGIN` is a
  # build argument, because Next resolves rewrites into the build rather than
  # reading them at start-up. So a deployment serving its pages elsewhere
  # carries that setting wherever it builds, and no compose file can hold it.
  web:
    profiles: [bundled]

  # The five edges that point at a switched-off service.
  #
  # **`required: false` is what makes this work, and without it nothing loads.**
  # Compose refuses a file whose service depends on one that no profile
  # enabled — `service "api" depends on undefined service "postgres"` — and it
  # skips that error only when the edge is not required. With the flag, the
  # health condition underneath is still honoured whenever the service *is*
  # enabled, so a self-hoster running everything loses nothing at all.
  api:
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      clickhouse:
        condition: service_healthy
        required: false

  simulator:
    depends_on:
      minio-bucket:
        condition: service_completed_successfully
        required: false
      livekit:
        condition: service_healthy
        required: false
      livekit-sip:
        condition: service_started
        required: false
