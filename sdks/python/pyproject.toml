[project]
name = "egma"
version = "0.1.0"
description = "Test and monitor LiveKit agents with Egma."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
# The text itself, packaged. `license-files` cannot reach outside the project
# directory, so the repository's LICENSE is copied here rather than pointed at
# — and without this the wheel declared a licence it did not carry, which is
# the one thing a licence file exists to prevent. The copy is byte-identical
# to the repository's, exception clause and all.
license-files = ["LICENSE"]
keywords = ["livekit", "voice", "agents", "testing", "mock tools", "egma"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

# Pinned to one minor on purpose. Mock-tool substitution uses LiveKit's
# testing namespace. Monitoring also reads LiveKit's current dynamic tracer
# provider because the public telemetry API has a setter but no getter. An
# unread minor must not change either seam by itself. The floor is where the
# session-scoped form of `mock_tools` exists; the ceiling is the next minor.
# Raising either is a deliberate act backed by the fixture and live tests.
dependencies = [
    "livekit-agents>=1.6.7,<1.7",
    "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
    "opentelemetry-sdk>=1.39,<2",
]

[project.urls]
Homepage = "https://github.com/egma-ai/egma"
Repository = "https://github.com/egma-ai/egma"
Documentation = "https://github.com/egma-ai/egma/tree/main/sdks/python#readme"

[dependency-groups]
dev = [
    "livekit-plugins-openai>=1.6.7,<1.7",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.14.5",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Every test here is hermetic but one, and the one that is not carries its
# own wall. Anything slower than this is a courier that hangs, which is
# the one failure mode this package exists to make impossible.
timeout = 60

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
