[project]
name = "egma"
version = "0.4.0"
description = "Test and monitor LiveKit and Pipecat agents with Egma."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# Include the SDK license in wheels and source distributions.
license-files = ["LICENSE"]
keywords = ["livekit", "pipecat", "voice", "agents", "testing", "mock tools", "egma"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

# The shared exporter, and the OpenAI bound. Each framework comes with its own
# extra, so a Pipecat bot never installs LiveKit and a LiveKit worker never
# installs Pipecat.
dependencies = [
    # LiveKit Agents 1.6 passes an httpx client into OpenAI and does not bound
    # OpenAI itself; OpenAI 3 moved to httpx2. Kept in the base so a LiveKit
    # worker that installs plain egma keeps OpenAI 2. Every supported Pipecat
    # minor accepts OpenAI 2.
    "openai>=2,<3",
    "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
    "opentelemetry-sdk>=1.39,<2",
]

[project.optional-dependencies]
# LiveKit 1.6.6 uses session-scoped mocks during tool execution. Validate its
# testing API and private tracer provider access before adding another minor
# release. The SDK reads this range back from its own metadata at import.
livekit = [
    "livekit-agents>=1.6.6,<1.9",
]
# The tool hook reads Pipecat's function-call runner, which is not public API.
# Each minor is tested before it joins this range. The SDK, its tests and the
# CI matrix read this range; it is written nowhere else.
pipecat = [
    "pipecat-ai>=1.9,<1.12",
    # The HTTPS seam's client. Pipecat depends on it too.
    "aiohttp>=3.11.12,<4",
]

[project.urls]
Homepage = "https://github.com/egma-ai/egma"
Repository = "https://github.com/egma-ai/egma"
Documentation = "https://github.com/egma-ai/egma/tree/main/sdks/python#readme"

[dependency-groups]
# The compatibility checks install every entry here except this package itself,
# which they install from the built wheel.
dev = [
    "egma[livekit,pipecat]",
    "livekit-plugins-openai>=1.6.6,<1.9",
    "packaging>=24",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.14.5",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Every test here is hermetic but one, and the one that is not carries its
# own wall. Anything slower than this is a courier that hangs, which is
# the one failure mode this package exists to make impossible.
timeout = 60

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# These modules skip themselves before importing Pipecat where it is absent.
"tests/pipecat_tests/support.py" = ["E402"]
# Fixtures imported from the support module are used as test arguments, and
# each module skips itself before importing Pipecat where it is absent.
"tests/pipecat_tests/test_*.py" = ["E402", "F401", "F811"]
