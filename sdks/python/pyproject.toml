[project]
name = "egma"
version = "0.0.0"
description = "The egma SDK: mock tools for LiveKit agents, answered by egma during a simulation and inert everywhere else."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
# The text itself, packaged. `license-files` cannot reach outside the project
# directory, so the repository's LICENSE is copied here rather than pointed at
# — and without this the wheel declared a licence it did not carry, which is
# the one thing a licence file exists to prevent. The copy is byte-identical
# to the repository's, exception clause and all.
license-files = ["LICENSE"]
keywords = ["livekit", "voice", "agents", "testing", "mock tools", "egma"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

# Pinned to one minor on purpose. The substitution mechanism is LiveKit's
# own `mock_tools`, which sits in the framework's testing namespace and
# carries no stability promise, so an unread minor is exactly the thing
# that must not arrive by itself. The floor is where the session-scoped
# form of `mock_tools` exists; the ceiling is the next minor, where it may
# move. Raising either is a deliberate act with the live smoke test as its
# evidence — and the README names the fallback if the API ever goes.
dependencies = ["livekit-agents>=1.6.7,<1.7"]

[project.urls]
Homepage = "https://github.com/egma-ai/egma"
Repository = "https://github.com/egma-ai/egma"
Documentation = "https://github.com/egma-ai/egma/tree/main/sdks/python#readme"

[dependency-groups]
dev = [
    "livekit-plugins-openai>=1.6.7,<1.7",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.14.5",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Every test here is hermetic but one, and the one that is not carries its
# own wall. Anything slower than this is a courier that hangs, which is
# the one failure mode this package exists to make impossible.
timeout = 60

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
