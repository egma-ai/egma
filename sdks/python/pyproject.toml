[project]
name = "egma"
version = "0.3.4"
description = "Test and monitor LiveKit agents with Egma."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# Include the SDK license in wheels and source distributions.
license-files = ["LICENSE"]
keywords = ["livekit", "voice", "agents", "testing", "mock tools", "egma"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

# LiveKit 1.6.6 uses session-scoped mocks during tool execution. Validate its testing API
# and private tracer provider access before adding another minor release.
dependencies = [
    "livekit-agents>=1.6.6,<1.9",
    # LiveKit Agents 1.6 passes an httpx client into OpenAI. OpenAI 3 moved
    # to httpx2, so this range follows LiveKit's own compatibility bound.
    "openai>=2,<3",
    "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
    "opentelemetry-sdk>=1.39,<2",
]

[project.urls]
Homepage = "https://github.com/egma-ai/egma"
Repository = "https://github.com/egma-ai/egma"
Documentation = "https://github.com/egma-ai/egma/tree/main/sdks/python#readme"

[dependency-groups]
dev = [
    "livekit-plugins-openai>=1.6.6,<1.9",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.14.5",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Every test here is hermetic but one, and the one that is not carries its
# own wall. Anything slower than this is a courier that hangs, which is
# the one failure mode this package exists to make impossible.
timeout = 60

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
