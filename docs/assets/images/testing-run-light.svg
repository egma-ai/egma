<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="850" viewBox="0 0 1040 850" role="img" aria-labelledby="title desc">
<title id="title">From configuration to graded simulations</title>
<desc id="desc">Test suite, containing tests and selected personas, and Agent plus Connection feed into a Run. The Run creates Simulations, one per test and persona pair. Graders assess each conversation's evidence.</desc>
